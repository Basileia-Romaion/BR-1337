l_english:

 br_ere_disaster: "The Crisis of the Imperial Order"
 br_ere_disaster_desc: "For generations, the Roman Empire has endured because the order of the realm has endured. The throne commanded, the provinces obeyed, the armies guarded the frontiers, and the great houses of the Empire remained bound to the authority of the Basileus. Now, that ancient order begins to falter. The weakness of the throne has emboldened those who would test its authority, while rival claimants and ambitious dynatoi cast their eyes upon the imperial dignity. From the provinces come petitions and defiance; from the armies, murmurs of discontent; and within the Palace, factions gather around their own interests. The bonds that hold the Roman realm together are beginning to fray. Should the authority of the throne continue to wane, what was preserved by our forefathers may yet be divided by their descendants..."
 br_ere_disaster_events.1.a: "The Empire shall endure."
