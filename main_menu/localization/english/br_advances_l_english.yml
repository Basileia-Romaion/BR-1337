 br_anatolian_heartland: "Heartland of Anatolia"
 br_anatolian_heartland_desc: "The great plateau of Anatolia has long served as the crossroads of empires and the granary of armies. Its strategic position, fortified settlements, and extensive trade routes allow those who rule it to draw strength from both commerce and defense."

 br_anatolian_farmlands: "Anatolian Breadbasket"
 br_anatolian_farmlands_desc: "The fertile plains of central Anatolia and Cappadocia sustain vast fields of grain. Centuries of cultivation and irrigation have transformed the region into one of the foremost sources of wheat in the known world."

 br_anatolian_heritage: "Heritage of the Anatolikoi"
 br_anatolian_heritage_desc: "The peoples of Anatolia have endured invasions, migrations, and wars for generations. Accustomed to life among mountains, hills, and plateaus, they have developed military traditions that produce disciplined infantry and resilient cavalry well suited to the rugged landscape of their homeland."

 br_pontic_heritage: "Heritage of the Pontikoi"
 br_pontic_heritage_desc: "The Pontic Greeks are heirs to a long tradition of mountain warfare, seafaring commerce, and frontier defense along the shores of the Euxine. Their communities thrive through trade and maritime enterprise while maintaining a reputation for steadfast soldiers and hardy fighting men."

 br_mount_athos_incense: "Pilgrimage Offerings"
 br_mount_athos_incense_desc: "Pilgrims, nobles, and rulers alike bestow gifts upon the holy communities, enriching their treasuries with incense, candles, and other offerings. These donations sustain the monasteries and strengthen their spiritual influence throughout the Orthodox world."

 br_mount_athos_books: "Monastic Scriptoria"
 br_mount_athos_books_desc: "Within the quiet halls of the monasteries, skilled scribes labor to preserve sacred texts, theological works, and the wisdom of the ancients. Their scriptoria serve as renowned centers of learning, producing manuscripts sought throughout Christendom."

 br_mount_athos_wine: "Monastic Vineyards"
 br_mount_athos_wine_desc: "The brotherhood cultivates extensive vineyards upon lands granted by pious benefactors. Through careful stewardship and generations of experience, the monasteries produce wine both for liturgical use and for trade, providing a steady source of revenue to the community."


 #Armenia
 br_armenian_mountain_strongholds: "Armenian Mountain Strongholds"
 br_armenian_mountain_strongholds_desc: "For centuries the Armenians have relied on the natural strength of their mountainous homeland. Fortresses perched atop steep ridges and narrow passes dominate the landscape, allowing defenders to harass invaders, disrupt their movement, and bleed their armies through attrition long before they reach the heartland."

 br_elysian_foederati_advance: "Lex Foederatorum"
 br_elysian_foederati_advance_desc: "In accordance with the ancient customs preserved by the Elysian state, the Senate has sanctioned the settlement of allied peoples within our frontiers under binding foedera. These Foederati, though foreign in tongue and custom, are bound by oath to furnish soldiers to Elysium, strengthening our armies where loyalty is uncertain. Yet such arrangements, while advantageous in war, grant considerable influence to tribal leaders and risk the weakening of Elysian authority in the provinces."

 br_balkan_mountain_strongholds: "Balkan Mountain Strongholds"
 br_balkan_mountain_strongholds_desc: "The mountains and valleys of the Balkans have long sheltered fortified settlements and resilient communities. Generations of warfare in difficult terrain have produced a network of strongholds capable of frustrating invaders while safeguarding trade and communication through the interior."

 br_bulgar_steppe_heritage: "Legacy of the Horse Lords"
 br_bulgar_steppe_heritage_desc: "Though settled among the mountains and plains of the Balkans, the Bulgars retain traditions born upon the Eurasian steppe. Skilled horsemen and hardy warriors answer the call to arms with speed and discipline, providing a reliable source of cavalry and levies for the realm."

 br_asturias_fortress: "Fortress of Asturias"
 br_asturias_fortress_desc: "The rugged mountains of Asturias have long served as a bastion against foreign conquest. Fortified passes, hilltop castles, and isolated strongholds enable local rulers to resist larger foes while inflicting heavy losses upon any army that dares penetrate the highlands."

 br_asturias_military: "Asturian Martial Tradition"
 br_asturias_military_desc: "Forged in generations of frontier warfare, the military traditions of Asturias emphasize discipline, noble leadership, and shock action. Its knights and levies are renowned for their tenacity, providing the realm with a formidable force capable of overcoming even superior enemies."

 br_asturias_repoblaciones: "Repoblaciones Asturleonesas"
 br_asturias_repoblaciones_desc: "For generations, settlers from the mountains of Asturias and León have reclaimed abandoned lands and founded new communities along the frontier. These repoblaciones strengthen the realm, expand cultivation, and bind newly settled territories to the Crown."

 br_asturias_the_reconquista: "Legacy of Covadonga"
 br_asturias_the_reconquista_desc: "The victory of Pelayo at Covadonga remains the founding legend of the Asturian realm. Inspired by the deeds of their forefathers, our warriors continue the struggle to reclaim the lands of Hispania."

 br_asturias_castilian_navy: "Cantabrian Seafarers"
 br_asturias_castilian_navy_desc: "The sailors of the Cantabrian coast have long navigated the rough waters of the Atlantic. Their skill in shipbuilding and seamanship provides the kingdom with a capable and resilient navy."

 br_asturias_cronicas_reales: "Chronicles of León"
 br_asturias_cronicas_reales_desc: "The scribes and scholars of León preserve the memory of kings, victories, and laws through carefully maintained chronicles. Their works strengthen the prestige and cultural legacy of the realm."

 br_asturias_masters_of_the_orders: "Patrons of the Military Orders"
 br_asturias_masters_of_the_orders_desc: "The Crown maintains close ties with the military orders that guard the frontiers and defend Christendom. Their experience and discipline contribute greatly to the kingdom's martial traditions."

 br_asturias_reform_of_millones: "Leónese Fiscal Reforms"
 br_asturias_reform_of_millones_desc: "A thorough reorganization of taxation and royal administration has improved the collection of revenues throughout the kingdom, providing greater resources for the Crown."

 br_asturias_pasos: "Pilgrimage Traditions"
 br_asturias_pasos_desc: "The roads leading to Santiago de Compostela unite peoples from across Christendom. The religious traditions and processions associated with these pilgrimages foster harmony and devotion among the faithful."

 br_asturias_real_academia_espanola: "Academy of León"
 br_asturias_real_academia_espanola_desc: "Dedicated to the advancement of letters and learning, the Academy promotes scholarship, literacy, and the preservation of the cultural heritage of the Asturleonese realm."

 br_asturias_canal_de_castilla: "Irrigation of the Meseta"
 br_asturias_canal_de_castilla_desc: "Investment in canals, waterways, and agricultural improvements across the Leónese heartland has greatly increased the productivity of the countryside."

 br_asturias_royal_factories: "Royal Manufactories"
 br_asturias_royal_factories_desc: "State-sponsored workshops and manufactories encourage skilled production, strengthen domestic industry, and reduce reliance upon foreign goods."

 br_adu_new_world: "Atlantic Expeditions"
 br_adu_new_world_desc: "The sailors of Al-Andalus look beyond the western horizon in search of new lands and opportunities. Supported by advances in navigation and astronomy, their voyages extend the reach of the realm across distant seas."

 br_adu_marine_infantry: "Mujāhidūn al-Baḥr"
 br_adu_marine_infantry_desc: "The Warriors of the Sea are elite troops trained for naval warfare and coastal assaults. Embarked aboard the fleets of Al-Andalus, they bring the strength of the realm to distant shores."

 
