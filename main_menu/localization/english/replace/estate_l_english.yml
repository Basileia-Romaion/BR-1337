l_english:

 consolidated_corruption_of_the_nobles: "Entrenched Dynatoi Privileges"
 consolidated_corruption_of_the_nobles_desc: "The Dynatoi have entrenched themselves within the machinery of the state, enriching their households while weakening central authority and military obligations."

 consolidated_corruption_of_the_burghers: "Emporoi Entrenchment"
 consolidated_corruption_of_the_burghers_desc: "The urban guilds and mercantile archontes have secured privileges and monopolies that hinder efficient commerce while increasing their influence over the state."

 consolidated_corruption_of_the_clergy: "Ecclesiastical Decadence"
 consolidated_corruption_of_the_clergy_desc: "The higher clergy have become increasingly consumed by privilege, intrigue, and worldly affairs, diminishing both spiritual authority and public trust."

 consolidated_corruption_of_the_peasants: "Decay of the Rural Themes"
 consolidated_corruption_of_the_peasants_desc: "The old rural order has weakened as peasant obligations and provincial administration fall into disorder, reducing the manpower and stability once provided by the thematic system."

 #corruption_desc: "throughout the Empire have long since entrenched themselves within the treasury and imperial administration, securing privileges, exemptions, and fostering a stagnant climate of corruption."

 #consolidated_corruption_of_the_burghers: "Consolidated Corruption of the Emporoi"
 #consolidated_corruption_of_the_burghers_desc: "The entrenched guilds, merchants, and urban magnates $corruption_desc$"

 #consolidated_corruption_of_the_peasants: "Consolidated Corruption of the Themes"
 #consolidated_corruption_of_the_peasants_desc: "The provincial populace no longer respects imperial authority. In many regions, local communities and thematic officials resist taxation and threaten revolt should harsher levies be imposed."

 #consolidated_corruption_of_the_nobles: "Consolidated Corruption of the Dynatoi"
 #consolidated_corruption_of_the_nobles_desc: "The entrenched Dynatoi and provincial aristocracy $corruption_desc$"

 #consolidated_corruption_of_the_clergy: "Consolidated Corruption of the Patriarchate"
 #consolidated_corruption_of_the_clergy_desc: "The unfortunate reality that the clergy and synodal hierarchy wield influence over imperial affairs is merely one consequence of the many privileges and concessions they have extracted under the threat of spiritual condemnation."

