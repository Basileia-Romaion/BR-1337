l_english:
 akritai_privilege: "Akritai Privilege"
 akritai_privilege_desc: "Along the borders of Romanía, the Akritai stand as soldier-farmers and guardians of the marches. Granted wide autonomy, they are authorized to raid hostile frontiers, seize captives, and disrupt enemy lands. These practices secure the borders, but they also strengthen rural interests and hinder the consolidation of central rule."

 boyarski_voiski: "Boiárski Voĭski"
 boyarski_voiski_desc: "The traditional levy of the Bulgarian boyars forms the backbone of our armies. These noble households maintain armed retainers and provide large contingents of horsemen in times of war. By reaffirming their martial rights and obligations, we strengthen our military capacity—though at the cost of granting the boyars greater influence within the realm."

 br_arm_nakharars: "Empowered Nakharars"
 br_arm_nakharars_desc: "The ancient nakharar houses stand as the backbone of Armenian defense. Entrusted with the guarding of mountain passes and the mustering of hereditary warbands, they command deep loyalty from their retainers and the peasantry alike. In times of invasion, their banners rise swiftly and the highlands become a fortress."

 br_arm_highland_villages: "Highland Village Militias"
 br_arm_highland_villages_desc: "Across Armenia’s mountains and valleys, villages maintain their own traditions of self-defense. When invasion looms, peasants abandon plough and vineyard to harry supply lines, defend monasteries, and fight beside their lords. Their resolve makes conquest costly, though their autonomy limits the reach of royal administration."

 br_special_trade_companies: "Chartered Trade Companies"
 br_special_trade_companies_desc: "By granting expansive privileges to powerful trade companies, the state entrusts overseas commerce and naval logistics to mercantile elites. In return, these companies sustain trade dominance, expand maritime reach, and shoulder much of the burden of naval upkeep."

 br_latin_trade_naval_reliance: "Latin Maritime Reliance"
 br_latin_trade_naval_reliance_desc: "Imperial naval administration has grown dependent upon Latin merchant fleets and their capital. In return for sustained access to ships and maritime expertise, the state has granted extensive commercial privileges, shifting naval costs outward while eroding native levies, sailors, and imperial control of the seas."

 br_roman_ecumenical_patriarch_privilege: "Prerogatives of the Ecumenical Patriarch"
 br_roman_ecumenical_patriarch_privilege_desc: "By ancient canon and the dignity of New Rome, the Ecumenical Patriarch presides as first among hierarchs within the oikoumene. Through synod, embassy, and sacred decree, his authority extends across the sees of the Empire, guiding doctrine, shaping diplomacy, and binding newly restored lands to the Orthodox communion."

 br_bureaucrat_clergy: "Ekklēsiastikē Dioikēsis"
 br_bureaucrat_clergy_desc: "The sekreta of the Empire are entrusted to the logothetai, guardians of fisc and nomos throughout the oikoumene. By chrysobull and sealed ordinance, imperial command is reduced to written statute and enduring register. Thus the Basileus rules not by whim, but through ordered administration rooted in Roman law. Allows [ShowBuildingTypeName('br_nomophylakeion')] and [ShowBuildingTypeName('br_dikasterion')]"

 br_themata_peasant_privilege: "Stratiōtai Land Grant"
 br_themata_peasant_privilege_desc: "Within the themes, land is held by stratiōtai bound to render service in defense of the Roman order. These free households, settled upon military allotments, furnish disciplined levies in time of war and uphold imperial authority in time of peace. Through this system, the state secures loyal levies drawn from free households, reinforcing provincial defense while tempering the dominance of magnate estates. Allows [ShowBuildingTypeName('br_soldier_farmers')] and [ShowBuildingTypeName('br_stratiotikon_thema_estate')]"

 br_themata_reformed_privilege: "Anakainisis tōn Thematōn"
 br_themata_reformed_privilege_desc: "The Anakainisis tōn Thematōn, the Renewal of the Themes, restores the military foundations of the Roman state. New generations of Stratiōtai are settled upon military allotments, while provincial administration is reorganized to support the defense of [ROOT.GetCountry.GetName]. The resulting system produces loyal levies, prosperous frontier communities, and a resilient army rooted in the free households of the Empire. Allows [ShowBuildingTypeName('br_soldier_farmers')] and [ShowBuildingTypeName('br_stratiotikon_thema_estate')]"

 br_dynatoi_magnates: "Dynatoi Magnates"
 br_dynatoi_magnates_desc: "Powerful landed magnates consolidate estates across the provinces, extending their authority over dependent cultivators and local administration. Their wealth strengthens rural production and fortifies the countryside, yet their growing dominance diminishes the independence of smaller households and shifts the balance of power away from the crown. Allows [ShowBuildingTypeName('br_pronoia_estate')] and [ShowBuildingTypeName('br_kekhrismene_pronoia')]"

 br_frontier_expansion_privilege: "Frontier Homestead Privileges"
 br_frontier_expansion_privilege_desc: "Settler households on the frontier are granted broad autonomy to clear land, fortify their holdings, and subdue surrounding tribes. In exchange for protection and expansion, they are permitted to organize local militias and manage captured labor. This fosters hardy independence, though it weakens central oversight."

 br_latin_occupiers: "Latin Occupation Authority"
 br_latin_occupiers_desc: "Latin lords rule over Roman lands not as natural sovereigns, but as occupiers sustained by force, privilege, and uneasy compromise. While they rely on local elites and tolerate divergent rites to maintain order, their authority remains fragile. The people endure rather than assimilate, and true unity between ruler and ruled remains distant."

 br_tsar_bulgars_romans: "Tsardom of Bulgars and Romans"
 br_tsar_bulgars_romans_desc: "Styled as ruler of both Bulgars and Romans, the Tsar governs a realm of mixed peoples and traditions. Local customs are preserved and cooperation is favored over forced assimilation, allowing the state to draw upon a broader base of support. Yet such balance comes at a cost, as divisions endure and a single identity remains elusive."

 br_elysian_foederati_privilege: "Foederati Privilegia"
 br_elysian_foederati_privilege_desc: "The tribal leaders are granted formal recognition under sacred foedera, securing their rights, lands, and autonomy in exchange for military service to Elysium. Their warriors swell the ranks of our armies, particularly in regions where Elysian culture holds little sway. However, empowering these federate chiefs elevates their standing within the realm and binds the state closer to their interests."

 br_noble_armies: "$noble_armies$"
 br_noble_armies_desc: "$noble_armies_desc$"

 br_ere_foederati_privilege: "Foideratoi"
 br_ere_foederati_privilege_desc: "Lands upon the imperial frontiers have been granted to the Foideratoi, allied [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] bound by oath and treaty to the service of the Basileus. These federate tribes guard the marches, watch the mountain passes, and furnish warriors to the armies of [ROOT.GetCountry.GetName], preserving the strength of the themes in troubled regions. Yet their chieftains retain considerable authority, and the customs and tongues of foreign peoples endure within the Empire. Allows [ShowBuildingTypeName('br_foederati_grant')]"

 br_ere_varangian_privilege: "Várangoi Hetaireía"
 br_ere_varangian_privilege_desc: "The Várangoi of the Imperial Hetaireía stand among the most trusted warriors of the Basileus, bound by oath, gold, and glory to the service of [ROOT.GetCountry.GetName]. Drawn from the northern seas and settled throughout the [ROOT.GetCountry.GetFlavorRank], these axe-bearing foreigners strengthen the Tagmata, guard the person of the Emperor, and furnish seasoned captains to the armies of the Empire. Yet their communities remain apart from the [ShowCultureName('greek_culture')], preserving the customs, laws, and tongue of their distant homelands. Allows [ShowBuildingTypeName('br_varangian_recruitment_building')], [ShowBuildingTypeName('br_varangian_camp')] and [ShowBuildingTypeName('br_varangian_barracks')]"

 br_ere_varangian_privateers: "Varangoi Nautikoi"
 br_ere_varangian_privateers_desc: "Companies of Varangoi in Imperial service are granted the right to outfit vessels and wage war against the enemies of the Basileus. Their skill as sailors and raiders reduces the cost of maintaining private fleets, while their exploits bring wealth and renown to both themselves and [ROOT.GetCountry.GetName]."

 br_turkoman_privilege: "Türkmen Frontier Privileges"
 br_turkoman_privilege_desc: "The Türkmen tribes are granted wide autonomy across the marches in exchange for military service and loyalty to the state. Their horsemen swell the armies of the realm at little expense, yet their growing influence entrenches tribal traditions and slows the transition toward a more settled society."

 br_ottoman_dhimmi_levies: "Dhimmi Auxiliary Levies"
 br_ottoman_dhimmi_levies_desc: "The Christian and Jewish communities of the realm are permitted to furnish auxiliary soldiers in service to the Sultan. In return for their loyalty and military contribution, the Dhimmi are afforded greater toleration and protection, easing unrest within the provinces while strengthening the armies with experienced local recruits."

 br_roman_orthodox_catechesis: "Katēchēsis tōn Romaiōn"
 br_roman_orthodox_catechesis_desc: "The Holy Church has been entrusted with the spiritual guidance of the Empire's peoples. Through catechesis, instruction, and the teaching of the Roman tradition, the faithful shall be drawn into the commonwealth of the Romaioi and strengthened in devotion to the Orthodox faith. Allows [ShowBuildingTypeName('br_didaskaleion')]"

 br_berber_privilege: "Privileges of the Berber Junds"
 br_berber_privilege_desc: "The Berber junds and tribal confederations of Al-Andalus retain their ancient rights in return for military service. Their horsemen and warriors stand ready to defend the realm, while their chiefs remain influential figures in provincial affairs. Though this arrangement strengthens the armies of the state, it also preserves tribal loyalties and customs."

 br_andalusian_dhimmi_levies: "Muwallad and Dhimmi Militias"
 br_andalusian_dhimmi_levies_desc: "The diverse peoples of Al-Andalus are called upon to aid in the defense of the realm. Christian and Jewish communities may furnish local militias and auxiliary formations, strengthening regional security and fostering coexistence between the faiths under Andalusian rule."

 br_reconquista_privilege: "Spirit of the Reconquista"
 br_reconquista_privilege_desc: "The frontier nobility are entrusted with the sacred duty of reclaiming lands held by the enemies of the Faith. Drawn by promises of plunder, captives, and glory, these warriors maintain a constant state of readiness against neighboring infidels. While this strengthens the armies of Christendom and fuels expansion, it also empowers a militant aristocracy whose interests are tied to perpetual frontier warfare."

 br_ghazi_privilege: "Ghazi Frontier Tradition"
 br_ghazi_privilege_desc: "The Ghazis are warriors of the frontier who dedicate themselves to the struggle against the enemies of Islam. Sustained by raids, booty, and religious zeal, they gather beneath local lords and tribal chiefs to wage war along the borders of the Dār al-Islām. Their presence strengthens the military power of the realm and inspires martial vigor, though it also reinforces the influence of decentralized frontier elites."

 br_latinoi_privateers: "Latinoi Corsair Contracts"
 br_latinoi_privateers_desc: "The Latinoi merchant houses are granted charters to outfit private vessels and wage war against the enemies of the state. Drawing upon generations of maritime expertise and commercial networks that span the seas, these privateers protect trade, harass rival shipping, and enrich both themselves and the treasury through captured prizes."

 br_slavic_tribes_privilege: "The Županates"
 br_slavic_tribes_privilege_desc: "Though much of the South Slavic world has embraced feudal institutions, many communities still look to their tribal leaders and local župans for guidance and protection. By preserving their traditional rights and obligations, the state gains a dependable source of hardy warriors and frontier levies. Yet the influence of tribal customs and local chieftains continues to hinder central authority and the development of a more settled society."

 br_albanian_tribes_privilege: "Privileges of the Fiset"
 br_albanian_tribes_privilege_desc: "The Albanian highlands remain the domain of powerful clans bound together by kinship, custom, and martial tradition. By recognizing the authority of their chieftains and safeguarding their ancient privileges, the state secures the loyalty of fierce warriors renowned throughout the Balkans. However, the strength of the clans reinforces local autonomy and preserves a tribal way of life resistant to centralization."