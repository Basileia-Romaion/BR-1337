l_english:
 
#ERE
 br_imperial_administration: "Imperial Dioikēsis"
 br_imperial_administration_desc: "From the capital radiates a carefully ordered hierarchy of offices and dignities through which the Oikoumenē is administered. Rank, stipend, and command are granted by imperial decree, ensuring that those who hold title do so as servants of the Basileía rather than as independent lords. When authority is firm, the Crown rises above faction and magnate ambition; yet should the throne falter, those accustomed to rank and revenue may test the limits of their submission."

 br_sub_theme_subject: "Theme Subject"
 br_sub_theme_subject_desc: "A system of provincial headquarters and armies, spearheaded by a strategos with dual responsibilities to protect the locals and establish authority at the behest of the [GetCountry('BYZ').GetFlavorRank]. This system replaced the provincial administration of Diocletian and has served our people ever since."

 br_sub_pronoia_subject: "Pronoïakon Ktéma"
 br_sub_pronoia_subject_desc: "The Prónoia system functions as a means of temporarily transferring imperial fiscal rights, such as taxes or income from various sources, to individuals or institutions. Unlike the feudal system prevalent in Europe at the time, Prónoia grants were neither hereditary nor transferable, and ultimate ownership remained with the Emperor. In exchange for these privileges, the system ultimately served the purpose for the head of state to raise an army in times of need, and entailed that the troops had to mostly cover their own expenses."

 br_naval_akritai_reform: "Naval Theme Administration"
 br_naval_akritai_reform_desc: "Coastal and island districts are organized into naval themes, where land, service, and fleet obligation are bound together. Through regulated levies and permanent maritime infrastructure, the state sustains large galley forces, rapid embarkation, and disciplined control of the frontier seas."

#Other
 br_carolingian_heritage: "Carolingian Heritage"
 br_carolingian_heritage_desc: "The legacy of Charlemagne still endures within this realm. Rooted in the traditions of feudal kingship, noble privilege, and imperial ambition, the state claims descent from the old Carolingian order that once united much of Western Christendom beneath a single crown."

 br_new_world_colonial_reform: "New World Colony"
 br_new_world_colonial_reform_desc: "Established to support life at the edge of the known world, this colonial structure encourages exploration, organized settlement, and steady population growth as new lands are charted and claimed."

 br_spqe_reform: "Senatus Populusque Elysianus"
 br_spqe_reform_desc: "The authority of the Elysian state is vested in the Senate and People, united under ancient forms preserved and adapted across generations. Though guided by tradition, this order reflects a distinctly Elysian character, balancing senatorial authority, civic identity, and the realities of rule beyond the old world. In this union, the state derives both its legitimacy and its strength."

 br_mongol_tolerance: "Steppe Tolerance"
 br_mongol_tolerance_desc: "Ruling over a vast and diverse steppe realm, the state governs through pragmatism rather than enforced unity. Customs, faiths, and peoples are permitted to coexist so long as tribute flows and order is maintained. This tolerance eases cultural administration but slows efforts at assimilation and religious conversion."

 anatolian_beylik: "Beylik"
 anatolian_beylik_desc: "We have emerged after the decay of the Seljuk Sultanate, whose borders we once inhabited. Hardened warriors and capable bureaucrats form the solid base of our robust government."

 patriarchate: "Patriarchate"
 patriarchate_desc: "We have been given a mission to bring the word of God to all nations. Governorship over this land should help us with this task."
 
 br_holy_community: "Hiera Koinotēs"
 br_holy_community_desc: "This realm is governed by a Holy Community, a sacred brotherhood of monks entrusted with both temporal administration and spiritual stewardship. Led by elders chosen from among the monastic fathers, the community preserves Orthodox traditions, fosters learning, and provides guidance to the faithful. Through the patronage of rulers and pilgrims alike, these monastic commonwealths endure as bastions of piety and devotion."

 br_sub_religious_subject: "Imperial Stavropegion"
 br_sub_religious_subject_desc: "This sacred community enjoys the protection of the Roman Emperor while maintaining authority over its own spiritual affairs. Bound to the wider Roman Commonwealth through faith, privilege, and patronage, its clergy preserve Orthodox traditions and serve as guardians of learning and piety."
 
 br_sub_foideratoi_subject: "Foideratoi"
 br_sub_foideratoi_subject_desc: "The Foideratoi are frontier tribes settled within the Empire under treaty, entrusted with guarding the marches in exchange for land and a measure of self-government. Their chieftains owe military service to the Basileus, providing swift cavalry and hardy warriors whenever the Empire calls. While loyal Foideratoi become steadfast defenders of the Roman frontier, neglect or mistreatment can quickly turn these martial settlers into dangerous rebels."

 # Republics
 br_special_merchant_republic: "Merchant Republic"
 br_special_merchant_republic_desc: "A republic founded upon the principles of trade. The flow of commerce is the most important factor for the families who rule these republics."

 br_alandalus_reform: "The Andalusian Compact"
 br_alandalus_reform_desc: "The rulers of al-Andalus have long maintained their authority through a careful balance of tolerance, scholarship, and administrative sophistication. Muslims, Christians, and Jews alike are granted space within the realm’s social order, strengthening the prosperity and resilience of the state. Yet this same spirit of accommodation preserves local identities and traditions, slowing the cultural and religious unification of the realm."

 #[ShowSpecialStatusName('emperor')] #[GetCountry('LOT').GetAdjectiveWithNoTooltip] #[GetCountry('LOT').GetName] #[GetCountry('LOT').GetAdjective]
 
 #HRE
 
 br_ancient_french_taxation: "[GetUniqueInternationalOrganization('hre').GetName] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] Taxation"
 br_ancient_french_taxation_desc: "Faced with a nobility too powerful to be adequately taxed, the emperors turned to the peasantry to fill the imperial coffers. Already burdened by feudal levies, the peasants saw their burdens grow even heavier. This policy strengthened imperial finances at the cost of their freedom and prosperity.."

 br_aftermatch_louis_iv: "Aftermatch Louis IV"
 br_aftermatch_louis_iv_desc: "Although nearly a century and a half has passed, the disastrous consequences of the defeat of Louis IV the Mad remain deeply rooted in imperial politics. Imperial authority has gradually collapsed in favor of the great lords of the realm. Until the imperial dignity regains its prestige and authority, the Empire will remain incapable of reforming itself."
 br_aftermatch_louis_iv_removal_conditions: "Will be changed by the success of the iberian crusade , or by the defeat of electors ." 
 
 br_french_centralized_monarchy: "[GetUniqueInternationalOrganization('hre').GetName] Monarchy"
 br_french_centralized_monarchy_desc: "Following centuries of heavy decentralization, [ShowSpecialStatusName('emperor')] has consolidated many of its fragmented appanage and ducal lands, paving the way for a more modern state"

 br_succesfull_iberian_crusade: "Victory in the Iberian Crusade"
 br_succesfull_iberian_crusade_desc: "The honour of the Carolingian dynasty has finally been restored! We have annihilated the vile heretical state of Al-Andalus and saved Christian Spain! Yet, while this victory brings us great prestige and renewed influence within the Holy Roman Empire, the road remains long before the royal authority can be fully cleansed of the deeds of Louis IV."
 br_succesfull_iberian_crusade_iv_removal_conditions: "Will be change by active a decision"

br_imperial_authority_restored: "Imperial Authority Restored"
br_imperial_authority_restored_desc: "There was a time when our name was mocked, a time when our authority was disregarded, a time when our Empire was an empire in name only. Those days are over. The faithful sons of Charlemagne have restored imperial authority. The prince-electors fear us and respect our authority. Yet they remain fiercely attached to their privileges. The day will come when the Empire shall once again be one and indivisible!"

br_french_feudal_nobility: "The Feudal Nobility"
br_french_feudal_nobility_desc: "The nobility, through the price of blood, certainly allows us to maintain inexpensive cavalry. However, in return, its influence over our lands continues to grow."
