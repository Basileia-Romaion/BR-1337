 br_latin_trading_base_desc: "$br_latin_trading_post_desc$"
 br_latin_trading_base_maintenance: "Fondaco Administration"


 br_doukate_building: "Doukate"
 br_doukate_building_desc: "Centered upon a fortified provincial capital, the Doukate serves as the seat of a Doux entrusted with both military and civil authority over the surrounding lands. From its walls are organized the regional levies, maintained the frontier garrisons, and enforced the authority of the Roman state. Though subordinate to the Imperial court, the Doux commands considerable local influence through the landed aristocracy and military households gathered beneath him."

 br_katapanate_building: "Katepaníkion"
 br_katapanate_building_desc: "The Katapanate represents an elevated military command entrusted to a Katapano, a supreme governor granted authority over multiple districts and frontier territories. Designed to coordinate large defensive regions and respond swiftly to invasion, these fortified administrative centers stand as the backbone of imperial frontier strategy. Their garrisons are substantial, and their commanders wield powers rivaling the great magnates of the Empire."

 br_despotate_building: "Despotate"
 br_despotate_building_desc: "Granted only to the most vital and prestigious regions of the Empire, the Despotate serves as the domain of a Despot ruling in the Emperor’s name. These immense fortified centers combine military administration, aristocratic court, and regional governance into a single institution. The Despot commands extensive resources and manpower, maintaining formidable fortifications capable of anchoring imperial authority even in times of civil strife and foreign invasion."

 br_dioikesis_building: "Dioikesis"
 br_dioikesis_building_desc: "The Dioikesis represents the culmination of Roman provincial administration: a vast military-administrative command directly integrated into the machinery of the Empire. Governed by senior imperial officials and sustained by immense fortifications, these centers oversee strategic regions of exceptional importance. Their authority extends across military logistics, taxation, defense, and governance, serving as both bastions of imperial order and symbols of centralized Roman power."

 br_episkopeion: "Episkopeion"
 br_episkopeion_desc: "The residence and administrative seat of a bishop. From here, the clergy oversee the spiritual life of the province, spread Orthodox doctrine, and draw local communities more closely into the Roman world."

 br_didaskaleion: "Didaskaleion"
 br_didaskaleion_desc: "A church-sponsored school where clergy instruct the faithful in letters, doctrine, and the Greek tongue. Such institutions cultivate a common Roman identity among diverse peoples."

 br_nomophylakeion: "Nomophylakeion"
 br_nomophylakeion_desc: "An archive and center of legal learning where jurists preserve and interpret the laws of the Empire. The authority of Roman law radiates outward from these halls into the surrounding province."

 br_dikasterion: "Dikasterion"
 br_dikasterion_desc: "A provincial court charged with administering justice according to Roman law. Through its judgments and officials, the authority of the Basileus is made manifest to all subjects."

### town rights

 br_naval_theme_rights: "Naval Theme Rights"
 br_naval_theme_rights_desc: "This city has been granted the privileges and obligations of a Naval Theme, binding its fortunes to the strength of the Roman fleet. Local magnates and maritime households are entrusted with maintaining harbors, supplying sailors, and furnishing ships for imperial service. In return, the city enjoys greater autonomy, influence, and prosperity through trade and naval patronage."

 br_land_theme_rights: "Land Theme Rights"
 br_land_theme_rights_desc: "This city has been organized under the privileges and obligations of a Land Theme, tying its administration to the defense of the Empire’s frontiers and interior. Local elites are expected to maintain levies, arms, and military infrastructure in service to the Basileía Romaíon. In exchange, the city gains greater authority, prestige, and economic support from imperial military investment."


