l_english:
 #Religious
 orthodox_missionary_building: "Orthodox Mission"
 orthodox_missionary_building_desc: "The $orthodox_missionary_building$ is the local center for religious ambassadors and missionaries who aim to convert the local population to the one true faith."
 patriarchate_seat: "Patriarch Seat"
 patriarchate_seat_desc: "A clergyman, elevated to the rank of Patriarch, grants us significant influence within the Orthodox Church."
 patriarchate_seat_maintenance: "Patriarch Seat Maintenance"
 
 #ERE
 br_great_palace_building: "Méga Palátion"
 br_great_palace_building_desc: "The principal imperial residence and ceremonial heart of the Roman state, comprising audience halls, chapels, residences, and gardens where emperors governed and enacted the rituals of empire."
 #br_great_palace_building_maintenance

 br_hagia_sophia_building: "Hagia Sophia"
 br_hagia_sophia_building_desc: "$hagia_sophia$ was originally constructed c. 346 during the reign of Emperor Constantius II, burned down during the Nika Revolt in 532, and fully reconstructed and consecrated in 537 by Emperor Justinian, becoming the largest cathedral in Christendom. Designed by Anthemius of Tralles and Isidore of Miletus, it is renowned for its immense dome, innovative engineering, and detailed mosaics that reflect the grandeur of Orthodox Christianity."
 br_hagia_sophia_building_maintenance: "Hagia Sophia Maintenance"

 br_senaton_building: "The Sénaton"
 br_senaton_building_desc: "The hall in which the Sýnklētos (Senate) convenes, preserving the unbroken civic tradition of the Roman people from the ancient Republic, through Constantine, and into the present age."
 br_senaton_building_maintenance: "Sénaton Maintenance"

 br_constantinople_university: "Pandidakterion"
 br_constantinople_university_desc: "Founded to preserve and cultivate the totality of Roman knowledge, the Pandidakterion stands as the foremost center of learning in the empire. Here, law, philosophy, rhetoric, medicine, and theology are taught in an unbroken tradition stretching back to Late Antiquity. Scholars trained within its halls shape the imperial administration, the courts, and the conscience of the Roman world itself."
 br_constantinople_university_maintenance: "Pandidakterion Maintenance"

 br_constantinople_military_academy: "Imperial Military Academy"
 br_constantinople_military_academy_desc: "Established in Constantinople under the authority of the Basileus, the Imperial Military Academy serves as the foremost institution for the training of Roman officers, tacticians, and professional soldiers. Drawing upon centuries of Roman military tradition alongside newer methods of war, the Academy cultivates disciplined commanders capable of leading the armies of the Empire against both eastern and western foes. Its halls produce learned strategoi, while its workshops and drill grounds ensure the capital remains the military heart of the Basileía Romaíon."
 br_constantinople_military_academy_maintenance: "Imperial Military Curriculum"

 br_constantinople_shipyard: "Kontoskalion & Prosphorion"
 br_constantinople_shipyard_desc: "The twin harbors of the Queen of Cities, where the lifeblood of the Roman world flows in and out with the tides. From the sheltered basins of the Kontoskalion to the bustling quays of the Prosphorion, grain fleets, merchants, and war galleys alike have sustained Constantinople since its founding. Fortified, regulated, and ceaselessly active, these ports bind the capital to every sea under Roman influence."
 br_constantinople_shipyard_maintenance: "Kontoskalion & Prosphorion Maintenance"

 br_constantinople_shipyard_improved: "Imperial Shipyards of the Golden Horn"
 br_constantinople_shipyard_improved_desc: "Expanded and modernized under Imperial patronage, the great shipyards of the Golden Horn stand among the largest naval construction complexes in the known world. From these docks emerge the war galleys and heavy vessels that secure Roman dominance across the Aegean and beyond. Supported by vast storehouses of timber, naval supplies, and artillery, the shipyards of Constantinople serve not only as centers of maritime industry, but as symbols of the Empire’s renewed mastery of the seas."
 br_constantinople_shipyard_improved_maintenance: "Imperial Naval Infrastructure"

 br_hippodrome_building: "Hippodrome of Constantinople"
 br_hippodrome_building_desc: "The great arena of the capital, where sport, ceremony, and politics converge before the eyes of the people. More than a place of spectacle, the Hippodrome has long served as a public forum through which popular will, factional rivalry, and imperial authority are expressed. Its crowds have celebrated emperors, condemned ministers, and shaped the rhythm of civic life in the Queen of Cities."
 br_hippodrome_building_maintenance: "Hippodrome Maintenance"

 br_constantinople_infrastructure: "The Cisterns Constantinople"
 br_constantinople_infrastructure_desc: "An immense and ancient hydraulic system of aqueducts, reservoirs, and underground cisterns sustains the Queen of Cities. Fed by distant springs and maintained through centuries of imperial care, this vast network secures the capital against drought and siege alike, enabling a population unmatched in Christendom."
 br_constantinople_infrastructure_maintenance: "Constantinople Infastructure Maintenance"

 #Rural 
 fishing_village_pearl_maintenance: "Pearl Farming"
 farming_village_wool_maintenance: "Wool Farming"
 farming_village_sturdy_crops_maintenance: "Grain Farming"
 farming_village_horses_maintenance: "Horse Ranch"
 forest_village_wild_game_maintenance: "Wild Game Hunting"
 forest_village_lumber_maintenance: "Lumber Farming"

 #Military

 orthodox_order_commandery: "Orthodox Order Commandery"
 orthodox_order_commandery_desc: "A fortified commandery established by an Orthodox military order beyond its own domains. From this house, revenues are drawn from the surrounding lands while new brethren are recruited into sacred service. Sustained through imperial sponsorship, the commandery binds piety and arms in defense of the Roman oikoumenē."
 orthodox_order_commandery_tt: "Owner grants [ShowRelationTypeName('military_sponsorship')] to us"

 br_varangian_recruitment_building: "Varangian Commandery"
 br_varangian_recruitment_building_desc: "An imperial compound maintained for the enlistment of northern warriors into Roman service. Here envoys and officers oversee the induction of Varangians, who pledge their axes and loyalty to the Basileus in exchange for pay, honor, and advancement within the Tágmata. From these halls, foreign strength is bound to imperial authority. Increases the amount of [ShowUnitTypeName('a_varangians')] and their upgraded varients you can have by one."


 br_tagmata_barracks: "Tágmata Barracks"
 br_tagmata_barracks_desc: "Permanent urban barracks housing the professional Tágmata regiments. Stationed only in provinces under firm imperial control, these soldiers answer directly to the Basileus. Costly to maintain yet disciplined and reliable, they embody the centralized military authority of the Roman state."

 br_soldier_farmers: "Théma Ktêma"
 br_soldier_farmers_desc: "A rural military holding established under the Théma system. Stratiōtai cultivate the land in peace and take up arms in defense of their province when summoned. Productive and resilient, these settlements strengthen the peasantry and preserve provincial autonomy alongside imperial service."

 br_pronoia_estate: "Prónoia Ktêma"
 br_pronoia_estate_desc: "A conditional land grant awarded in exchange for military obligation. The holder raises retainers and extracts revenue in the Emperor’s name, restoring order where direct control is weak. Yet each Prónoia entrenches the power of the Dynatoi, binding local strength to noble authority rather than the crown."

 br_naval_theme_hq: "Naútikon Théma Neōrion"
 br_naval_theme_hq_desc: "A fortified naval headquarters of the Naútikon Théma, combining administrative command with imperial shipyard facilities. From these harbors the Roman fleet is provisioned, constructed, and maintained, securing control of the seas and reinforcing maritime authority."
 br_naval_theme_hq_maintenance: "Neōrion Maintenance"

 br_soldier_farmers_cattle_maintenance: "Stratiōtai Livestock Ktêma"
 br_soldier_farmers_wool_maintenance: "Stratiōtai Wool Ktêma"
 br_soldier_farmers_sturdy_crops_maintenance: "Stratiōtai Grain Ktêma"
 br_soldier_farmers_horses_maintenance: "Stratiōtai Horse Ktêma"

 br_stratiotikon_thema_cattle_maintenance: "Stratiōtai Livestock Ktêma"
 br_stratiotikon_thema_wool_maintenance: "Stratiōtai Wool Ktêma"
 br_stratiotikon_thema_sturdy_crops_maintenance: "Stratiōtai Grain Ktêma"
 br_stratiotikon_thema_horses_maintenance: "Stratiōtai Horse Ktêma"

 br_stratiotikon_thema_estate: "Stratiōtikon Théma"
 br_stratiotikon_thema_estate_desc: "A reformed military district in which soldier-farmers are formally integrated into an organized provincial command structure. The land is no longer merely frontier allotment, but a structured military institution bound to imperial service."

 br_kekhrismene_pronoia: "Kekhrisménē Prónoia"
 br_kekhrismene_pronoia_desc: "A sanctioned and formally confirmed pronoia grant, regulated under imperial authority. While still entrusted to noble holders, its military obligations and revenues are more strictly defined and supervised by the crown."

 br_varangian_camp: "Varangian Camp"
 br_varangian_camp_desc: "A fortified encampment housing the foreign warriors of the Varangian Guard. Bound by oath to the Emperor alone, these axe-bearing elites form the innermost shield of the imperial throne, serving as both palace guardians and shock infantry in war."

 br_varangian_barracks: "Varangian Barracks"
 br_varangian_barracks_desc: "A permanent and well-provisioned stronghold of the Varangian Guard. No longer a mere encampment, this institutionalized corps serves as an elite imperial regiment, fiercely loyal to the Basileus and feared across the battlefield for its discipline and ferocity."

 br_foederati_grant: "Foiderátōn Ktḗseis"
 br_foederati_grant_desc: "These lands have been granted to Foiderátoi tribes settled within the Empire's borders. In exchange for pasture, farmland, and a degree of local autonomy, they provide warriors to defend the frontier and bolster the Emperor's armies. Though valuable as a military reserve, such settlements preserve their distinct customs and slow the spread of Roman ways."

 br_tagmata_camp: "Tagmata Camp"
 br_tagmata_camp_desc: "A provincial encampment of the Tagmata, the professional regiments of the Empire. Drawn from loyal subjects and maintained under imperial authority, these troops provide a disciplined core to the field armies and reinforce order within the cities."

 br_pyrgoi: "Pyrgoi"
 br_pyrgoi_desc: "Chains of fortified watchtowers guard the frontiers, roads, and passes of the realm. These pyrgoi serve as observation posts, signal stations, and rallying points for local soldiers, extending the reach of imperial authority into even the most remote countryside."
 br_pyrgoi_maintenance: "Pyrgoi Garrison"

 br_kleisourai: "Kleisourai"
 br_kleisourai_desc: "Strategic mountain passes are sealed by fortified defenses known as kleisourai. Garrisons stationed in these narrow defiles control the approaches into the interior, forcing invaders to advance through deadly choke points where defenders can inflict heavy losses and halt entire armies."
 br_kleisourai_maintenance: "Kleisourai Garrison"

 br_bandits_building: "Rural Brigands" #Klephts
 br_bandits_building_desc: "In regions where imperial authority is weak, bands of brigands and outlaws gather in the hills and forests. Often drawn from impoverished peasants, deserters, and displaced villagers, these groups prey upon travelers and local settlements. While some villagers quietly support them as a form of resistance against distant authorities, their presence disrupts agriculture, trade, and the restoration of order."
 br_bandits_building_remove_price: "Remove Brigands "

 br_mount_athos_building: "Holy Mountain of Athos"
 br_mount_athos_building_desc: "The Holy Mountain of Athos stands as the greatest monastic center of the Orthodox world. For centuries its secluded monasteries have drawn monks from across the Roman lands and beyond, forming a spiritual republic devoted entirely to prayer, contemplation, and the preservation of sacred tradition. Though removed from worldly affairs, its spiritual authority carries immense influence among the faithful."

 br_agioi_apostoloi_building: "Church of the Holy Apostles"
 br_agioi_apostoloi_building_desc: "The venerable Church of the Holy Apostles is one of the most sacred shrines of Constantinople and the traditional resting place of Roman emperors. Raised in honor of the Twelve Apostles and rebuilt by the great emperors of the past, it stands as a symbol of the divine mission of the Basileía Romaíon. Within its halls imperial ceremony and sacred tradition intertwine, reinforcing the bond between throne and altar."
 br_agioi_apostoloi_building_maintenance: "Church of the Holy Apostles maintenance"

 br_apothekai_building: "Apothēkai"
 br_apothekai_building_desc: "Imperial storehouses known as apothēkai serve as logistical depots for the state. Here grain, equipment, and other supplies are gathered and distributed along the roads and ports of the realm, ensuring that garrisons remain provisioned and that imperial authority can be sustained even in distant provinces."

 br_stationes_building: "Stationes"
 br_stationes_building_desc: "Imperial road stations established along the highways of the realm. These posts house patrols, officials, and messengers who supervise trade, maintain order, and ensure the steady movement of goods and travelers along the empire’s roads."

 br_praitoria_building: "Praitoria"
 br_praitoria_building_desc: "Provincial headquarters from which imperial officials administer taxation, justice, and the enforcement of imperial law. Staffed by soldiers, clerks, and magistrates, these offices extend the authority of the throne into the cities and provinces of the realm."
 br_praitoria_building_maintenance: "Praitoria Administration"

 br_latin_trading_post: "Latin Fondaco"
 br_latin_trading_post_desc: "Merchant compounds maintained by Italian trading companies, serving as warehouses, residences, and commercial offices for Latin merchants operating in foreign ports."
 br_latin_trading_post_maintenance: "Fondaco Administration"

 br_latin_chapel: "Hetaireía Chapel"
 br_latin_chapel_desc: "$merchant_guild_chapel_desc$"
 br_indike_quarters: "Hetaireía Quarters"
 br_indike_quarters_desc: "$ori_portuguese_quarters_desc$"
