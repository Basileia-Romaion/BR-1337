### Romaiokratía Special statuses
 br_emperor: "Basileus and Autokratōr"
 br_emperor_desc: "The Basileus and Autokratōr of the Romans, enthroned within the [ShowBuildingTypeName('br_great_palace_building')], heir to the Caesars, and supreme ruler of the [GetUniqueInternationalOrganization('roman_world').GetName]. It is his sacred duty to uphold the order of the Basileía and safeguard the unity of the Roman world."

 domestikos_west: "Domestikos tēs Dyseōs"
 domestikos_west_desc: "The Domestikos of the West commands the imperial tagmata and field armies of the European provinces, entrusted with the defense of the western dominions and the execution of the Basileus' will."

 domestikos_east: "Domestikos tēs Anatolēs"
 domestikos_east_desc: "The Domestikos of the East commands the imperial tagmata and field armies of Anatolia and the eastern themes, entrusted with defending the Empire's ancient heartlands and carrying out the will of the Basileus."

 imperial_loyalist: "Basilikoi Hypēkooi"
 imperial_loyalist_desc: "From humble [ShowPolicyName('pronoia_system')]-holders to the governors of [ShowSubjectTypeName('br_thema_subject')] and katepanates, these loyal servants of the Basileía uphold the authority of the [ShowSpecialStatusName('br_emperor')], faithfully administering and defending the imperial order in the name of [ShowLocationName('constantinople')]."

 defiant_strategoi: "Autonomoi Strategoi"
 defiant_strategoi_desc: "From ambitious strategoi to entrenched dynatoi, these provincial rulers govern in the name of the [ShowSpecialStatusName('br_emperor')], yet heed his commands only when it serves their interests. As the reach of [ShowLocationName('constantinople')] weakens, their autonomy and influence continue to grow."

 external_member: "Symmachoi of the Oikoumenē"
 external_member_desc: "Peoples and rulers beyond the core of the [GetCountry('BYZ').GetFlavorRank], yet bound to the [ShowLawName('br_romaiokratia_law')] through diplomacy, alliance, and mutual interest. Though not counted among the Romaíoi, they participate in the wider [GetUniqueInternationalOrganization('roman_world').GetName], acknowledging the authority and influence of the imperial order."

 roman_world_bestow_domestikos_west: "Appoint Domestikos of the West"
 roman_world_bestow_domestikos_west_desc: "Grant the dignity of Domestikos of the West, entrusting the command of the Empire's western armies to a loyal servant of the Basileus."

 roman_world_rescind_domestikos_west: "Rescind the Domestikos of the West"
 roman_world_rescind_domestikos_west_desc: "Strip the current holder of the dignity of Domestikos of the West and return command of the western armies to the imperial court."

 roman_world_bestow_domestikos_east: "Appoint Domestikos of the East"
 roman_world_bestow_domestikos_east_desc: "Grant the dignity of Domestikos of the East, placing the imperial armies of Anatolia and the eastern themes under a trusted commander."
 roman_world_rescind_domestikos_east: "Rescind the Domestikos of the East"
 roman_world_rescind_domestikos_east_desc: "Strip the current holder of the dignity of Domestikos of the East and restore the command of the eastern armies to the Basileus."

 br_change_strategos: "Appoint Stratēgós"
 br_change_strategos_desc: "Remove the current Stratēgós and appoint a new governor from among the loyal dynasts of the Empire. The newly appointed ruler shall govern the [ShowSubjectTypeName('br_thema_subject')] in the name of the Basileus."

 br_allow_dynastic_inheritance: "Grant Dynastic Succession"
 br_allow_dynastic_inheritance_desc: "Permit the office of Stratēgós to pass hereditarily within the subjects dynasty. The [ShowSubjectTypeName('br_thema_subject')] shall remain loyal to the Empire, but its governance will become increasingly dynastic in nature."

 br_remove_dynastic_inheritance: "Restore Imperial Appointment"
 br_remove_dynastic_inheritance_desc: "Revoke hereditary succession within the [ShowSubjectTypeName('br_thema_subject')]. Upon the death of the current Stratēgós, a successor shall be selected according to imperial authority rather than family inheritance."

 br_restore_roman_status: "Restore Imperial Order"
 br_restore_roman_status_desc: "Those within the [GetUniqueInternationalOrganization('roman_world').GetName] who have drifted from their proper station may, through renewed recognition of the [ShowSpecialStatusName('br_emperor')] and the authority of [ShowLawName('br_romaiokratia_law')], be peacefully restored to their rightful place within the imperial order."

### Romaiokratía Laws
 br_romaiokratia_law: "Romaiokratía"
 br_romaiokratia_law_desc: "Romaiokratía defines the order through which the [ShowSpecialStatusName('br_emperor')] exercises $roman_authority$ throughout the [GetUniqueInternationalOrganization('roman_world').GetName]. Through its institutions, lands and rulers are bound by obligation, service, and loyalty, uniting the Roman world within a single imperial hierarchy."

 br_romaiokratia_weak_policy: "Imperial Primacy"
 br_romaiokratia_weak_policy_desc: "The $roman_authority$ of the [ShowSpecialStatusName('br_emperor')] is acknowledged in principle, yet little binds the members of the [GetUniqueInternationalOrganization('roman_world').GetName] beyond custom, tradition, and mutual interest. The Basileus commands prestige, though his influence remains limited."

 br_romaiokratia_low_policy: "Recognized Supremacy"
 br_romaiokratia_low_policy_desc: "The $roman_authority$ of the [ShowSpecialStatusName('br_emperor')] is formally recognized throughout the [GetUniqueInternationalOrganization('roman_world').GetName]. Though still largely autonomous, its members increasingly look to [ShowLocationName('constantinople')] for legitimacy, guidance, and arbitration."

 br_romaiokratia_medium_policy: "Imperial Arbitration"
 br_romaiokratia_medium_policy_desc: "The [ShowSpecialStatusName('br_emperor')] stands as the supreme arbiter of the [GetUniqueInternationalOrganization('roman_world').GetName], settling disputes between its members and exercising an increasingly active role in their governance. Imperial $roman_authority$ extends beyond recognition into direct oversight."

 br_romaiokratia_high_policy: "Imperial Ascendancy"
 br_romaiokratia_high_policy_desc: "The institutions of [ShowLawName('br_romaiokratia_law')] bind the [GetUniqueInternationalOrganization('roman_world').GetName] ever more closely to [ShowLocationName('constantinople')]. Administration, diplomacy, and $roman_authority$ increasingly flow through imperial institutions, strengthening unity beneath the Basileus."

 br_romaiokratia_annex_policy: "Imperial Universality"
 br_romaiokratia_annex_policy_desc: "The [GetUniqueInternationalOrganization('roman_world').GetName] stands united beneath the undisputed $roman_authority$ of the [ShowSpecialStatusName('br_emperor')]. Distinctions between subject and ally fade as all are incorporated into a single imperial order, securing lasting peace and Roman supremacy throughout the [GetUniqueInternationalOrganization('roman_world').GetName]."


