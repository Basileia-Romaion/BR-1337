 roman_authority_desc: "$roman_authority$ represents the recognized legitimacy and moral authority of the [GetUniqueInternationalOrganization('roman_world').GetLeaderTitle] within the [GetUniqueInternationalOrganization('roman_world').GetName].\n\nIt is sustained not by arms alone, but through [ShowLawName('br_romaiokratia_law')], ancient tradition, and the recognition of the primacy of [ShowLocationName('constantinople')].\n\nAs more [ShowSpecialStatusName('imperial_loyalist')] and [ShowSpecialStatusName('external_member')] acknowledge the imperial order, $roman_authority$ grows, enabling the [ShowSpecialStatusName('br_emperor')] to command obedience, issue decrees, and uphold Roman rule. When $roman_authority$ declines, the authority of the Empire loses its binding force, regardless of its military strength."

 roman_tribute: "Phóros"
 roman_tribute_price: "Phóros"
 roman_tribute_desc: "Phóros represents the regular payments and material contributions remitted to [ShowLocationName('constantinople')] by members of [GetUniqueInternationalOrganization('roman_world').GetName].\n\nIt reflects the fiscal obligations that sustain the imperial administration, court, and defenses of the empire.\n\nSteady Phóros ensures the effective functioning of Roman rule, while shortfalls strain the treasury and weaken the empire’s ability to project authority and maintain order."

