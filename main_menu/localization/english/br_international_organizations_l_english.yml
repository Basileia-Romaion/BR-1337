l_english:

 roman_world: "Oikoumenē"
 roman_world_desc: "The #bold Oikoumenē#! embodies the universal Roman claim to order and civilization under the [ShowSpecialStatusName('br_emperor')].\n\nFrom [ShowLocationName('constantinople')] flows an imperial order that binds diverse lands and peoples into a single political sphere.\n\nThrough the institutions of [ShowLawName('br_romaiokratia_law')], the Basileus extends $roman_authority$ across both [ShowSpecialStatusName('imperial_loyalist')] and [ShowSpecialStatusName('external_member')], preserving the unity and supremacy of the Roman world.\n\n#bold Diplomatic Actions:#!\n[ShowCountryInteractionName('br_restore_roman_status')]\n[ShowCountryInteractionName('br_change_strategos')]\n[ShowCountryInteractionName('br_allow_dynastic_inheritance')]\n[ShowCountryInteractionName('br_remove_dynastic_inheritance')]\n\n#bold Unique Subjects:#!\n[ShowSubjectTypeName('br_thema_subject')]\n[ShowSubjectTypeName('br_naval_thema_subject')]\n[ShowSubjectTypeName('br_stavropegion_subject')]\n[ShowSubjectTypeName('br_phorophoros_subject')]"

 game_concept_roman_authority_gc: "Auctoritas"
 game_concept_roman_authority_gc_desc: "Auctoritas represents the recognized legitimacy and moral $roman_authority$ of the [ShowSpecialStatusName('br_emperor')]. It is not enforced by arms alone, but granted through acknowledgment, tradition, and acceptance of Roman supremacy. As more realms and authorities recognize the imperial order, $roman_authority$ grows, enabling the Basileus to command obedience, enforce decrees, and uphold Roman rule. When $roman_authority$ wanes, imperial power loses its binding force, regardless of military strength."

