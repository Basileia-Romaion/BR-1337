 br_slavic_religion: "Slavicism"
 br_slavic_religion_ADJ: "Slavic"
 br_slavic_religion_desc: "The traditional religion of the Slavic peoples is a polytheistic faith centered upon the worship of gods associated with the forces of nature, warfare, fertility, and the household. Religious life is maintained through communal rituals, seasonal festivals, and reverence for sacred places, ancestors, and local spirits."
