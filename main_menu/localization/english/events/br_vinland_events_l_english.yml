l_english:

 br_vinland_event.1.title: "The Founding of Eiríksvágr"
 br_vinland_event.1.desc: "It was upon the shores of Belle Isle that our forefathers first made landfall in these distant lands. There they founded their first settlement, giving thanks to the gods for guiding their ships safely across the western ocean. Yet the old settlement lies far from the richest lands and greatest waterways of Vinland. Stadacona offers a far more promising home: fertile country, abundant waters, and a mighty river reaching deep into the lands beyond. Here shall we establish a city worthy of Vinland and our ancestors. In honor of Leif Eiríksson, son of Eiríkr the Red and the first of our people to lead the way to these shores, we shall name it Eiríksvágr. May Óðinn grant us wisdom, Þórr strength, and Freyr prosperity as we make this land our own."
 br_vinland_event.1.a: "Let Eiríksvágr rise, beneath the eyes of the gods!"

 northern_trade.1.title: "The Northern Trade"
 northern_trade.1.entry: "$northern_trade.1.title$"
 northern_trade.1.desc: "The Northern Trade is the humorous nickname for the rare days where old-world vessels find themselves on Vinland's shores. Typically an overzealous explorer or ships blown off course, rarely does a crew have the skill, supply, or dumb luck required to survive the voyage. As a result, these vessels are often no more than floating graveyards, warning us against looking back across the sea. But, rarely, these ships carry something or someone of great importance to our fledgling nation."
 northern_trade.1.a: "You'd think they'd stop looking for us!"

 northern_trade.2.title: "The Derelict"
 northern_trade.2.entry: "$northern_trade.2.title$"
 northern_trade.2.desc: "A few fisherman spotted a derelict ship floating just off the coast of Belle Isle. After boarding the ship, they found all but one member of the crew had died. We took in the survivor, who perished while raving about the end of days and divine punishments."
 northern_trade.2.a: "I'm sure that's nothing to worry about."

 northern_trade.3.title: "The General"
 northern_trade.3.entry: "$northern_trade.3.title$"
 northern_trade.3.desc: "For the first time in a century, an old-world vessel landed on our shores with crew still intact. A wealthy danish general looking for glory set sail across the ocean to search for new unspoiled lands. He found us instead. After a night of partying and drinking, we have decided to bring him into our court."
 northern_trade.3.a: "His skills and knowledge will be put to use."

 northern_trade.4.title: "Northern Refugees"
 northern_trade.4.entry: "$northern_trade.4.title$"
 northern_trade.4.desc: "Refugees from the north are fleeing to our country, claiming their gods have forsaken them."
 northern_trade.4.a: "Nowhere is safe from the black death."

 southern_trade.1.title: "The Southern Trade"
 southern_trade.1.entry: "$southern_trade.1.title$"
 southern_trade.1.desc: "A few upstart explorers have returned from the south. They brought two envoys with them from the two major nations in the south, each calling themselves the successors to the Roman Empire. They provide us with detailed maps of their territories."
 southern_trade.1.a: "New friends! Or enemies?"

 southern_trade.2.title: "The Northmen Reach Out"
 southern_trade.2.entry: "$southern_trade.2.title$"
 southern_trade.2.desc: "A small group of northern explorers reached our shores, wishing to trade. Stories of a seafaring people in the north have been spreading, but this is confirmation. We exchange maps with the explorers and send an envoy with them."
 southern_trade.2.a: "New friends! Or enemies?"

 southern_trade.3.title: "Sharing Ideas"
 southern_trade.3.entry: "$southern_trade.3.title$"
 southern_trade.3.desc: "A merchant returning from the south remarked that the Elysians have remarkably backward naval technology. He proposes we offer them our newest innovations so they may improve their harbors and better facilitate trade with us, for a price of course!"
 southern_trade.3.a: "Charge them 250 ducats."
 southern_trade.3.b: "Let's keep our secrets to ourselves."

 southern_trade.4.title: "The Northmen Reach Out"
 southern_trade.4.entry: "$southern_trade.4.title$"
 southern_trade.4.desc: "An envoy from the north reaches out, proposing to sell us plans for advanced harbors, ships, canals, docks, and other naval technology. We will be able to research these new naval technologies if we accept. He is charging a steep fee."
 southern_trade.4.a: "Pay the man, lets get to sailing!"
 southern_trade.4.b: "Absolutely not! (We will never have this opportunity again)"

 southern_trade.5.title: "The Southern Bounty"
 southern_trade.5.entry: "$southern_trade.5.title$"
 southern_trade.5.desc: "The southerners have paid us for our ideas."
 southern_trade.5.a: "We're rich!"