l_english:

###########
### Age 1 ###
###########

 br_hre_events.100.title: "A Dazzling Display of Power"
 br_hre_events.100.desc_common: "has masterminded a rather expensive but effective proposal that would see the wealth and power of [ROOT.GetCountry.GetName] displayed whilst also improving relations with [target_root_country.GetNameWithNoTooltip].\n\nA meeting of the two rulers would take place in [summit_location.GetName], near the [target_root_country.GetAdjectiveWithNoTooltip] border, with elaborate arrangements being made to accommodate them both.\n\nTents weaved with gold threads and the erection of a temporary palace are some of the ideas being considered."
 br_hre_events.100.desc: "A trusted advisor of the [target_root_country.GetAdjective] [target_root_country.GetGovernment.GetRuler.GetName] $br_hre_events.100.desc_common$"
 br_hre_events.100.desc_wolsey: "The sly and scheming [thomas_wolsey.GetName] $br_hre_events.100.desc_common$"
 br_hre_events.100.a: "We are in agreement."
 br_hre_events.100.tt1: "A 'Field of the Cloth of Gold' summit will be arranged shortly, at great expense"
 br_hre_events.100.tt2: "The costly and powerful display will improve relations and favor the international standing of [ROOT.GetCountry.GetNameWithNoTooltip]"
 br_hre_events.100.b: "There is little to gain."
 br_hre_events.100.tt3: "The summit will be declined"

 br_hre_events.101.t.n: "Savage Charivari Against a Noble"
 br_hre_events.101.t.c: "Savage Charivari Against a Clergyman"
 br_hre_events.101.t.b: "Savage Charivari Against a Burgher"
 br_hre_events.101.t.p: "Savage Charivari"
 br_hre_events.101.entry: "$br_hre_events.101.t.p$"
 br_hre_events.101.desc: "Village folk have gathered around the house of a notable individual. They intend to drag out this individual and shame them for having re-married as a widow before their mourning period had finished. They have pots and pans to make noise; pitchforks and stones to threaten and coerce. This individual deserves to be reminded not to break local customs, but the villagers might take things too far, which might upset the estate they belong to..."
 br_hre_events.101.desc.f: "The village folk have had enough, a notable individual has been drinking too much during daylight hours, and the people now plan to enact a charivari to force them to mend their ways. This could prove an effective method of correcting one's misguided path, but some are not able to bear the shame of a charivari and commit actions they cannot take back. Members of this individual's state worry and ask that the charivari be called off by means of state intervention. But is it wise to intervene with the will of the people?"
 br_hre_events.101.historical_info: "The 'Charivari' is a traditional folk custom particularly prevalent in Rome, it acts as a form of social censure through social humiliation for those who have violated social norms or customs. Participants usually march around the house of the accused, making loud noises. In some cases, they may capture the accused and parade them around the village in a display of shame. While not common, there are known instances of the accused being killed in the heat of passion, usually when they tried to defend themselves."
 br_hre_events.101.a: "This savagery will not be tolerated!"
 br_hre_events.101.b: "This ought to mend their wicked ways!"

 br_hre_events.102.t: "The Jacquerie Rebellion"
 br_hre_events.102.entry: "$br_hre_events.102.t$"
 br_hre_events.102.desc: "Relations between the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] have reached a boiling point and now the peasantry has begun to rise in a disorderly manner all across [ROOT.GetCountry.GetName]. These mobs, armed with scythes and pitchforks, are led by no general, but instead anger. Their goals are simple, they desire only to upend the social order and destroy all living symbols of their repression.\n\nIf our great nation is to survive, we must crush this rebellion and set a historical example of what happens to those who step out of their position."
 br_hre_events.102.historical_info: "The Jacquerie was a peasant rebellion in 1358, named after \"Jacques Bonhomme\" (Simple/Honest James), a derogatory term used by the nobility to describe the peasants. The revolt was severe and widespread, being the culmination of extreme exploitation of the peasantry. As such, even unlikely allies like the Kingdom of Navarra showed up to make sure it would not succeed, as it had the potential to break the entrenched feudal system and lead to a decline in imperial and noble power."
 br_hre_events.102.a: "Call upon the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]!"
 br_hre_events.102.a.entry: "Call upon the $nobles_estate$!"
 br_hre_events.102.b: "We need no assistance."

 br_hre_events.103.t: "Gabelle"
 br_hre_events.103.entry: "$br_hre_events.103.t$"
 br_hre_events.103.desc: "Our income is ever-decreasing, our armies will soon become undersupplied, our cities destitute, and our coffers empty.\n\nThe time is now to consider alternative sources of taxation, regardless of how unpopular they may be. Salt, much like water, is an essential element to life; perhaps we could implement a series of taxes on this vital resource to re-invigorate our tax earnings?"
 br_hre_events.103.historical_info: "The economic strain from the Hundred Years' War placed Rome in dire need of funds in order to maintain its armies and campaigns. As such Rome resorted to taxing Salt, an essential commodity in Medieval Europe used for the preservation of food, among many other uses, which made it a lucrative target for taxation. In spite of its wide unpopularity, the Gabelle became a pillar of state revenue."
 br_hre_events.103.a: "Salt will be taxed!"
 br_hre_events.103.b: "We cannot afford a peasant revolt now!"

 br_hre_events.104.title: "Minting of the Franc"
 br_hre_events.104.entry: "$br_hre_events.104.title$"
 br_hre_events.104.desc: "Recent global affairs have led to the treasury of [GetCountry('LOT').GetName] becoming financially strained. [SCOPE.sCharacter('minister').GetName] from the cabinet has put forth the idea of minting new coins to combat these financial woes, giving them the name of 'the Franc'. While the minting of the proposed Franc coinage would help stabilize the [GetCountry('LOT').GetAdjectiveWithNoTooltip] economy and aid us in ongoing affairs, it also brings with it the risk of increasing inflation in the distant future."
 br_hre_events.104.a: "Allowing the minting of the Franc."
 br_hre_events.104.b: "We should exploit this new coinage!"
 br_hre_events.104.c: "The risks are too great."
 br_hre_events.104.historical_info: "During the later portions of the 14th century, Rome was left strained financially from its conflicts with the Kingdom of England in the Hundred Years' war. In the Battle of Poitiers, Jean II was captured in battle by the Black Prince. After a series of negotiations, Jean II along with other prisoners would be ransomed in return for financial compensation. Upon his return, Jean II issued an Ordonnance for the creation of the 'Franc' gold coin to pay for the ransoms, lasting from 1360 until 1380. The Franc would be reissued in later centuries and became the national currency of Rome in 1795."  

 br_hre_events.105.title: "Ball of the Burning Men"
 br_hre_events.105.entry: "$br_hre_events.105.title$"
 br_hre_events.105.desc: "Whispers of [ROOT.GetCountry.GetGovernment.GetCourtTitle] decadence have emerged across the streets of [ShowLocationName('metz')] following the masked ball at the [ROOT.GetCountry.GetGovernment.GetAdjective] palace. What was originally meant to be a traditional ball hosted by [fra_ruler.GetName] quickly turned into a chaotic event, with four lords perishing after catching fire by a torch brought by [target_sibling.GetName]. [fra_ruler.GetNameWithNoTooltip] along with the other four lords were to lead the dance of the ball, but out of the five participants, [fra_ruler.GetShortNameWithNoTooltip] remains the sole survivor.\n\nMany in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have accused [target_sibling.GetNameWithNoTooltip] of attempting regicide against [target_sibling.GetHisHer] own kin, and have called for [target_sibling.GetHisHer] imprisonment."
 br_hre_events.105.a: "Imprison [target_sibling.GetNameWithNoTooltip]!"
 br_hre_events.105.a.entry: "Imprison him!"
 br_hre_events.105.b: "Spare [target_sibling.GetNameWithNoTooltip], this will make for a tale of the ages!"
 br_hre_events.105.b.entry: "Spare him, this will make for a tale of the ages!"

 br_hre_events.106.title: "$dreams_of_the_orchard$" # Le Songe du Verger
 br_hre_events.106.entry: "$br_hre_events.106.title$"
 br_hre_events.106.desc: "The relationship between civil and ecclesiastical authorities has always been a tensioned one, and clashes between them are a common occurrence at [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_artist.GetName] has come up with an idea of translate these tensions in a story, using satire. It will serve both as a political treatise, dealing with the interactions between the sovereign and the populace, and also as an entertaining critique of how the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] interacts with the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
 br_hre_events.106.historical_info: "Written during the reign of Emperor Charles V, $dreams_of_the_orchard$ served as a lesson on the legal doctrine between civil and ecclesiastical powers. $dreams_of_the_orchard_desc$"
 br_hre_events.106.a: "A fine work of Art!"
 br_hre_events.106.b: "Its too expensive."

###########
### Age 2 ###
###########

 br_hre_events.200.title: "Seizure of the Guilds"
 br_hre_events.200.entry: "$br_hre_events.200.title$"
 br_hre_events.200.desc: "The Guilds within [ROOT.GetCountry.GetName] have served various purposes throughout the centuries, facilitating the crafts or trades of the members of an associated guild. However, as time has passed, these guilds have emerged as a source of lost income for the state, with many contributing substantial portions of their wealth to their guild. Seeing the financial loss, the state has requested that [fra_ruler.GetName] approves the state takeover of the guilds, an act that while enraging the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], would allow the state to replenish the imperial coffers."
 br_hre_events.200.a: "Approve the takeover of the Guilds."
 br_hre_events.200.b: "Allow the Guilds to remain autonomous."

 br_hre_events.201.title: "The Expertise of [target_character.GetNameWithNoTooltip]"
 br_hre_events.201.entry: "Jean Bureau"
 br_hre_events.201.desc: "A prominent family from [ShowLocationName('chalons_champagne')], the [target_character.GetLastNameWithNoTooltip] family has built quite a remarkable reputation in [GetCountry('LOT').GetName] as being gifted with the handling of gunpowder. Through his works, [target_character.GetName] has created powder that enables cannons to shoot at a higher velocity than previously thought while also aiding in the creation of cannon barrels that are less likely to explode when fired. Now however, [target_character.GetNameWithNoTooltip] has offered his services to the [GetCountry('LOT').GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle] in hopes of using his knowledge on the battlefield."
 br_hre_events.201.a: "Employ him!"
 br_hre_events.201.b: "While his feats are commendable, we do not need his strategy for our forces."

 br_hre_events.202.title: "The Master Gunner of [GetCountry('LOT').GetNameWithNoTooltip]"
 br_hre_events.202.entry: "The Master Gunner of Rome"
 br_hre_events.202.desc: "Ever since his employment, [target_character.GetName] has proven more than capable of bolstering our forces with his expertise in gunpowder and artillery warfare. Some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have recommended awarding [target_character.GetNameWithNoTooltip] with the title of 'Master Gunner of [GetCountry('LOT').GetName]' in recognition of his legendary qualities. Furthermore, this new post would allow [target_character.GetLastNameWithNoTooltip] more resources to further explore in improving the cannons produced and used by our forces."
 br_hre_events.202.a: "Grant him the title of Master Gunner!"
 br_hre_events.202.b: "Gunpowder is expensive, focus on traditional warfare!"

 br_hre_events.203.title: "[target_character.GetNameWithNoTooltip]"
 br_hre_events.203.entry: "Jacques Coeur, Master of Mint"
 br_hre_events.203.desc: "A rising and prominent figure amongst the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], [target_character.GetName] has proven [target_character.GetHerselfHimself] in recent years to be among the most shrewd merchants of our times. Having already spearheaded a gigantic trading operation based in [ShowLocationName('montpellier')], [target_character.GetShortNameWithNoTooltip] has managed to build quite an illustrious relationship with the merchant republics of [ShowRegionName('italy_region')] with his dealings in the Levant.\n\nHaving been summoned by the [ROOT.GetCountry.GetGovernment.GetCourtTitle] for his deeds, some have recommended to [fra_ruler.GetName] that [target_character.GetShortNameWithNoTooltip] be bestowed the position of Master of Mint, and be given rein over the state's finances."
 br_hre_events.203.a: "Let [target_character.GetNameWithNoTooltip] have the reins!"
 br_hre_events.203.a.entry: "Let him have the reins!"
 br_hre_events.203.b: "Allow [target_character.GetNameWithNoTooltip] instead to return to his private enterprise."
 br_hre_events.203.b.entry: "Allow him instead to return to his private enterprise."

 br_hre_events.204.title: "[target_character.GetLastNameWithNoTooltip] and the [ROOT.GetCountry.GetGovernment.GetAdjective|U] Expenditure"
 br_hre_events.204.entry: "Couer and the Imperial Expenditure"
 br_hre_events.204.desc: "Since assuming the role of Master of Mint, [target_character.GetLastName] has contributed to the stabilization of [ROOT.GetCountry.GetName] finances. Although [target_character.GetLastNameWithNoTooltip]'s role as Master of Mint has led to many improvements, it has also been strictly limiting to the state's treasury.\n\nHaving proven [target_character.GetHerselfHimself] more than capable, some have encouraged [fra_ruler.GetName] to promote [target_character.GetLastNameWithNoTooltip] to be made steward of the [ROOT.GetCountry.GetGovernment.GetAdjective] expenditure, expanding [target_character.GetHisHer] influence to encompass the [ROOT.GetCountry.GetGovernment.GetAdjective] treasury."
 br_hre_events.204.a: "Grant [target_character.GetLastNameWithNoTooltip] stewardship over the [ROOT.GetCountry.GetGovernment.GetAdjective] expenditure."
 br_hre_events.204.a.entry: "Grant him stewardship over the imperial expenditure."
 br_hre_events.204.b: "[target_character.GetHisHer|U] current position suits [target_character.GetHimHer] more than enough."
 br_hre_events.204.b.entry: "His current position suits him more than enough."

 br_hre_events.205.title: "[target_character.GetLastNameWithNoTooltip] Negotiations with [mamluk_country.GetNameWithNoTooltip]"
 br_hre_events.205.entry: "Couer Negotiates with Mamluks Sultans"
 br_hre_events.205.desc: "Capitalizing on [target_character.GetHisHer] strong ties to commercial interest in the region, [target_character.GetName] and [target_character.GetHisHer] close advisors have managed to forge an agreement with [mam_ruler.GetName] of [mamluk_country.GetName]. While this agreement has earned some key concessions, such as improving access to consuls throughout the Levant, [target_character.GetLastNameWithNoTooltip] has also managed to forge some new commercial ties with [mamluk_country.GetNameWithNoTooltip].\n\nWhile a deal with [mamluk_country.GetNameWithNoTooltip] would improve [ROOT.GetCountry.GetName] influence on commercial trade throughout the Mediterranean, some fear this deal negotiated by [target_character.GetLastNameWithNoTooltip] could be more a benefit for [target_character.GetHisHer] trade empire."
 br_hre_events.205.a: "Consent to [target_character.GetLastNameWithNoTooltip]'s agreement."
 br_hre_events.205.a.entry: "Consent to his agreement."
 br_hre_events.205.b: "Forbid the ratification of the deal."

 br_hre_events.206.title: "Château d'Ainay-le-Vieil and Palais [target_character.GetNameWithNoTooltip]"
 br_hre_events.206.entry: "Château d'Ainay-le-Vieil by Couer"
 br_hre_events.206.desc: "While [target_character.GetName] has served as a capable minister and steward of [ROOT.GetCountry.GetName], [target_character.GetHeShe] has also built quite a reputation, both positive and negative. Before joining the [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_character.GetNameWithNoTooltip] had already built a large commercial enterprise, and while [target_character.GetHisHer] priorities have largely benefitted the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], [target_character.GetHisHer] personal projects had begun to stir resentment among the other ministers.\n\nWithin [ShowLocationName('bourges')], [target_character.GetNameWithNoTooltip] has already taken steps to secure the purchase of the #italic Château d'Ainay-le-Vieil#!, a castle that has long since lost its importance, as well as to construct the extravagant Palais [target_character.GetNameWithNoTooltip] within [ShowLocationNameWithNoTooltip('bourges')] itself.\n\nThese expensive projects have stirred concerns that [target_character.GetLastNameWithNoTooltip] may be using [target_character.GetHisHer] offices to embellish [target_character.GetHerselfHimself]."
 br_hre_events.206.a: "Do not interfere with [target_character.GetLastNameWithNoTooltip]'s projects."
 br_hre_events.206.a.entry: "Do not interfere with his projects."
 br_hre_events.206.b: "Request that [target_character.GetLastNameWithNoTooltip] refrains from pursuing any further ambitious projects."
 br_hre_events.206.b.entry: "Request that the character refrains from pursuing any further ambitious projects."

 br_hre_events.207.title: "Enterprising [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
 br_hre_events.207.entry: "$br_hre_events.207.title$"
 br_hre_events.207.desc: "The ascension of [target_character.GetName] to a minister position within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] has led to a steady increase in the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] pursuing interest in the growing trade routes. Although a practice previously considered ill-advised, some of [fra_ruler.GetNameWithNoTooltip]'s closest advisors, including [target_character.GetNameWithNoTooltip], have encouraged [fra_ruler.GetNameWithNoTooltip] to allow and expand access for the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] to pursue these enterprising efforts further. Previous policies have seen the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] that pursue such efforts risk losing their privileges.\n\nSome in the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] elite urge caution however, as competition could trigger an adverse effect on the economy of [ROOT.GetCountry.GetName]."
 br_hre_events.207.a: "Waive the restrictions and allow the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] to pursue enterprising efforts."
 br_hre_events.207.a.entry: "Waive the restrictions and allow the $nobles_estate$ to pursue enterprising efforts."
 br_hre_events.207.b: "Forbid any further efforts by members of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] to safeguard [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] interests."
 br_hre_events.207.b.entry: "Forbid any further efforts by members of the $nobles_estate$ to safeguard $burghers_estate$ interests."

 br_hre_events.208.title: "Monopolization of [target_character.GetLastNameWithNoTooltip]"
 br_hre_events.208.entry: "Monopolization of Coeur"
 br_hre_events.208.desc: "Though [target_character.GetName] has served as an extraordinary minister to [fra_ruler.GetName], [target_character.GetHisHer] status has now grown to bring too much turmoil throughout the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Multiple courtiers now point towards [target_character.GetLastNameWithNoTooltip]'s business empire now holding a near monopoly on the majority of [ROOT.GetCountry.GetName]'s trade goods. Furthermore, allegations that [target_character.GetLastNameWithNoTooltip] has a more invested interest in [target_character.GetHisHer] wealth than the state have emerged, such as [target_character.GetLastNameWithNoTooltip] kidnapping oarsmen for [target_character.GetHisHer] merchant galleys as well as extracting wealth from dockyards light coinage.\n\nFaced with these accusations, many have requested the imprisonment and a subsequent trial be held to bring [target_character.GetLastNameWithNoTooltip] to justice, while also ridding the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of this ambitious individual."
 br_hre_events.208.a: "Imprison [target_character.GetHimHer] and seize [target_character.GetHisHer] holdings!"
 br_hre_events.208.a.entry: "Imprison him and seize his holdings!"
 br_hre_events.208.b: "[target_character.GetLastNameWithNoTooltip] has benefited this [ROOT.GetCountry.GetGovernment.GetCourtTitle] greatly, spare [target_character.GetHimHer], and allow [target_character.GetHimHer] to remain."
 br_hre_events.208.b.entry: "The character has benefited this court greatly, spare him, and allow him to remain."

 br_hre_events.209.t: "The Compagnie d'Ordonnance"
 br_hre_events.209.entry: "$br_hre_events.209.t$"
 br_hre_events.209.desc: "In order to combat the growing raids by previously employed mercenary groups as well the various free companies extorting the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], the Estates General have issued a new law enabling [ruler_fra.GetName] the sole power to establish a new imperial army. Unlike past armies, the new #italic Compagnie d'Ordonnance#! will answer to [ruler_fra.GetShortNameWithNoTooltip] as a standing force, and seek to operate on a permanent basis. Such a force would pave the way to create a standing army for [GetCountry('LOT').GetName]."
 br_hre_events.209.a: "Form the Compagnie d'Ordonnance!"
 br_hre_events.209.b: "Create a scaled back standing force."
 br_hre_events.209.c: "Divert investments from the new law to encourage levying efforts."

 br_hre_events.210.t: "The Fiscal Prudence of [target_character.GetNameWithNoTooltip]"
 br_hre_events.210.entry: "The Fiscal Prudence of Louis XI"
 br_hre_events.210.desc: "While [GetCountry('LOT').GetName] has seen various great monarchs, none thus far have managed to be as fiscally prudent as [target_character.GetName]. Throughout [target_character.GetShortNameWithNoTooltip]'s reign, relations between the crown and [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have remained considerably cordial, enabling the construction of various major works throughout [GetCountry('LOT').GetNameWithNoTooltip]. Furthermore, [target_character.GetShortNameWithNoTooltip]'s careful management of the imperial coffers has ensured the financial stability of the state."
 br_hre_events.210.a: "These are flourishing times for [GetCountry('LOT').GetNameWithNoTooltip]."
 br_hre_events.210.a.entry: "These are flourishing times for $LOT$."
 br_hre_events.210.b: "Deepen our relationship further with the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]."
 br_hre_events.210.b.entry: "Deepen our relationship further with the $burghers_estate$."
 br_hre_events.210.c: "Take this opportunity to enact a grand tax reform."

 br_hre_events.211.t: "Expansion of the Imperial Postal Roads"
 br_hre_events.211.entry: "$br_hre_events.211.t$"
 br_hre_events.211.desc: "While the imperial court has maintained a steady flow of connections with its subject closest to the capital, our far-reaching subjects have always proven to be a difficult task for our communication network. [target_character.GetName] has proposed an expansion of the imperial postal roads all throughout [GetCountry('LOT').GetName] allowing the creation of more effective paths for imperial couriers to take and strengthen our communication with our farthest subjects. Advisors to [target_character.GetShortNameWithNoTooltip] have also proposed that such a project take an alternative approach to create cheaper roads that can be more broadly used."
 br_hre_events.211.a: "Fund the expansion!"
 br_hre_events.211.b: "Adopt the advisors approach."
 br_hre_events.211.c: "Road expansion would be a waste of resources."

 br_hre_events.212.t: "Postal Inns"
 br_hre_events.212.entry: "$br_hre_events.212.t$"
 br_hre_events.212.desc: "Following on the successes of the Imperial roads expansion, [target_character.GetName] has now proposed the creation of specialized inns along the newly created roads. These inns would serve as stops for the personal envoys for [target_character.GetShortNameWithNoTooltip] and members of the imperial court. Such inns could also serve to bolster our espionage network should their capabilities be expanded."
 br_hre_events.212.a: "Allow the creation of these Inns at the [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s behest."
 br_hre_events.212.a.entry: "Allow the creation of these Inns at his behest."
 br_hre_events.212.b: "Expand the Postal Inns to bolster our Spy Networks."
 br_hre_events.212.c: "An expensive endeavor."

 br_hre_events.213.title: "A Traveling [ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 br_hre_events.213.entry: "$br_hre_events.213.title$"
 br_hre_events.213.desc: "Compared to many of [fra_ruler.GetHisHer] predecessors, [fra_ruler.GetName]'s rule has been one marked by many [ROOT.GetCountry.GetGovernment.GetAdjective] tours and travels. From [fra_ruler.GetHisHer] many travels, [fra_ruler.GetNameWithNoTooltip] has been known to arrive unannounced, surprising many of the local lords. While these unannounced visits often disrupted daily proceedings, by the time of [fra_ruler.GetShortNameWithNoTooltip] departure, the province was left in a better state.\n\nNow planning yet another [ROOT.GetCountry.GetGovernment.GetAdjective] tour, [fra_ruler.GetNameWithNoTooltip] has laid out two destinations, [target_province_1.GetName] and [target_province_2.GetName], asking for input from the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to decide on the focus of the next tour."
 br_hre_events.213.a: "[target_province_1.GetNameWithNoTooltip] local officials would be more than welcoming."
 br_hre_events.213.a.entry: "The province local officials would be more than welcoming."
 br_hre_events.213.b: "[target_province_2.GetNameWithNoTooltip] officials have been less forthcoming, a visit is due there."
 br_hre_events.213.b.entry: "The province officials have been less forthcoming, a visit is due there."
 br_hre_events.213.c: "Advise against a tour, and encourage [fra_ruler.GetNameWithNoTooltip] to remain in [ShowLocationNameWithNoTooltip('metz')]."
 br_hre_events.213.c.entry: "Advise against a tour, and encourage him to remain in [ShowLocationNameWithNoTooltip('metz')]."

 br_hre_events.214.title: "The Shrewd Sibling"
 br_hre_events.214.entry: "$br_hre_events.214.title$"
 br_hre_events.214.desc: "While [fra_ruler.GetName] has remained a respected [ROOT.GetCountry.GetGovernment.GetRulerTitle], [fra_ruler.GetHisHer] sister, [target_sibling.GetName], has grown to be quite an influential supporter in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] for [fra_ruler.GetHisHer] rule. A talented and shrewd individual, [target_sibling.GetNameWithNoTooltip] has wielded [target_sibling.GetHisHer] [target_sibling.GetDynasty.GetName] influence to ensure [fra_ruler.GetNameWithNoTooltip]'s policies are successfully carried out by the council.\n\nSome of the most ardent supporters of [fra_ruler.GetNameWithNoTooltip] have requested that a spot be reserved in the [ROOT.GetCountry.GetGovernment.GetCabinetTitle] for [target_sibling.GetShortNameWithNoTooltip], viewing [target_sibling.GetHisHer] skills as wasted on political bickering in the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 br_hre_events.214.a: "Allow [target_sibling.GetShortNameWithNoTooltip] to serve as a member of the [ROOT.GetCountry.GetGovernment.GetCabinetTitle]."
 br_hre_events.214.a.entry: "Allow him to serve as a member of our cabinet."
 br_hre_events.214.b: "We need [target_sibling.GetHimHer] as a supporter within the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 br_hre_events.214.b.entry: "We need him as a supporter within the court."

###########
### Age 3 ###
###########

 br_hre_events.300.title: "Legal Reforms of [fra_ruler.GetNameWithNoTooltip]"
 br_hre_events.300.entry: "Legal Reforms of Louis XII"
 br_hre_events.300.desc: "Seeking to modernize the state, [fra_ruler.GetName] has made several inroads in reforming the legal system of [ROOT.GetCountry.GetName]. Among [fra_ruler.GetHisHer] advancements, [fra_ruler.GetNameWithNoTooltip] has succeeded in lowering the taxes while also balancing the state's budget. To meet the budget, one of [fra_ruler.GetShortNameWithNoTooltip]'s major reforms included the reduction of pensions for the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], which has earned the ire of some of its wealthiest families.\n\nWhile these reforms have certainly left an impact on the state, the bureaucracy shall be a more stable and efficient one for the future successor of [fra_ruler.GetNameWithNoTooltip]."
 br_hre_events.300.a: "[ROOT.GetCountry.GetNameWithNoTooltip] shall reap the benefits of these reforms in time."
 br_hre_events.300.a.entry: "We shall reap the benefits of these reforms in time."
 br_hre_events.300.b: "Drawback some of the reforms to avoid angering the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 br_hre_events.300.b.entry: "Drawback some of the reforms to avoid angering the $nobles_estate$."

 br_hre_events.301.title: "Iconography of [fra_ruler.GetNameWithNoTooltip]"
 br_hre_events.301.entry: "Imperial Iconography of Rome"
 br_hre_events.301.desc: "Throughout [fra_ruler.GetName]'s rule, there has been an unprecedented rise of support for the [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName] in the public eye. While past rulers had often pointed towards the support of the masses to legitimize their rule, [fra_ruler.GetShortNameWithNoTooltip] has taken every occasion to ensure [ROOT.GetCountry.GetGovernment.GetAdjective] power is projected while also elevating [fra_ruler.GetHisHer] status higher in the eyes of the people. Through [ROOT.GetCountry.GetGovernment.GetAdjective] iconography, images of [fra_ruler.GetShortNameWithNoTooltip] have flooded the streets, while many writers have taken to praising the [ROOT.GetCountry.GetGovernment.GetRulerTitle] in public works.\n\nSome have advised caution, as the continued elevation of [fra_ruler.GetShortNameWithNoTooltip] may grow to be seen as heretical by the [ShowReligionAdjective('catholic')] Church."
 br_hre_events.301.a: "Continue to support [ROOT.GetCountry.GetGovernment.GetAdjective] Iconography efforts."
 br_hre_events.301.a.entry: "Continue to support imperial Iconography efforts."
 br_hre_events.301.b: "Reduce iconography efforts to avoid condemnation from the [ShowReligionAdjectiveWithNoTooltip('catholic')] Church."

 br_hre_events.302.title: "A Champion of the People"
 br_hre_events.302.entry: "$br_hre_events.302.title$"
 br_hre_events.302.desc_frontend: "Having [fra_ruler.GetHisHer] role marked by a period of Iconography and propaganda in support of the [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetNameWithNoTooltip], the Estates-General have coffered the title of"
 br_hre_events.302.desc_backend: "While past meetings within the Estates-General have been influencing on the popularity of the ruler, this marks the first time such an honorary title has been bestowed."
 br_hre_events.302.desc_king: "$br_hre_events.302.desc_frontend$ #italic Father of the People#! to [fra_ruler.GetName] as a symbol of strong support among the masses of [ROOT.GetCountry.GetName]. $br_hre_events.302.desc_backend$"
 br_hre_events.302.desc_queen: "$br_hre_events.302.desc_frontend$ #italic Mother of the People#! to [fra_ruler.GetName] as a symbol of strong support among the masses of [ROOT.GetCountry.GetName]. $br_hre_events.302.desc_backend$"
 br_hre_events.302.a: "Accept the title with grace."

 br_hre_events.303.title: "[ruler_fra.GetShortNameWithNoTooltip] and the Works of the [ShowInstitutionNameWithNoTooltip('renaissance')]"
 br_hre_events.303.entry: "The Ruler and the Works of the Renaissance"
 br_hre_events.303.desc: "The spread of the [ShowInstitutionName('renaissance')] across [ROOT.GetCountry.GetName] has brought with it a revitalization of works of art by various artists across [ShowContinentName('europe')]. Many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle], including [ruler_fra.GetShortName], have developed a fixation and have slowly begun diverting more of the treasury to decorate the [ROOT.GetCountry.GetGovernment.GetAdjective] palace with these works. With the [ROOT.GetCountry.GetGovernment.GetCourtTitle]'s fixation on [ShowInstitutionNameWithNoTooltip('renaissance')] art, it may be able to attract prominent [ShowInstitutionNameWithNoTooltip('renaissance')] artists if we are willing to sponsor them."
 br_hre_events.303.a: "Offer patronage to any willing artists!"
 br_hre_events.303.b: "Local artists have already proven themselves sufficient."
 br_hre_events.303.c: "The [ROOT.GetCountry.GetGovernment.GetCourtTitle] will end this fixation at once!"
 br_hre_events.303.c.entry: "The court will end this fixation at once!"

 br_hre_events.304.title: "The Arrival of [target_character.GetNameWithNoTooltip]"
 br_hre_events.304.entry: "Da Vinci and the Mona Lisa"
 br_hre_events.304.desc: "Following the invitation of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to sponsor any willing prominent [ShowInstitutionName('renaissance')] artists, the artist [target_character.GetName] has arrived in [ROOT.GetCountry.GetCapital.GetName]. A prominent and renowned figure across [ShowRegionName('italy_region')], [target_character.GetShortNameWithNoTooltip]'s patronage would no doubt bolster the prestige and splendor of [GetCountry('LOT').GetName]. [target_character.GetNameWithNoTooltip] has also brought with [target_character.GetHimHer] one of [target_character.GetHisHer] most prominent works, the #italic $mona_lisa$#!. Should we agree to sponsor [target_character.GetHimHer], this legendary work would become a treasure of the [GetCountry('LOT').GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 br_hre_events.304.a: "We would sponsor [target_character.GetHimHer]!"
 br_hre_events.304.a.entry: "We would sponsor him!"
 br_hre_events.304.b: "Surely there are better artists, decline to sponsor [target_character.GetHimHer]."
 br_hre_events.304.b.entry: "Surely there are better artists, decline to sponsor him."

 br_hre_events.305.title: "[target_character.GetNameWithNoTooltip] Offer of Tutelage"
 br_hre_events.305.entry: "François de Moulins de Rochefort and the Education of the Heir"
 br_hre_events.305.desc: "Hailing from a prominent [GetCountry('LOT').GetAdjective] family of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], [target_character.GetName] has for some time now served the [ROOT.GetCountry.GetGovernment.GetCourtTitle] as a religious scholar and advisor. [target_character.GetShortNameWithNoTooltip] today, however, offered to tutor the young [scope_heir_fra.GetName], hoping to teach the aspiring future ruler of [ROOT.GetCountry.GetNameWithNoTooltip] of the new ideals brought forth by the [ShowInstitutionName('renaissance')]. While in the past, the children of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] have received [ROOT.GetCountry.GetGovernment.GetCourtTitle] education, [target_character.GetShortNameWithNoTooltip]'s offer could help prepare [scope_heir_fra.GetShortNameWithNoTooltip] future rule in this new age."
 br_hre_events.305.a: "[target_character.GetShortNameWithNoTooltip] would make for an excellent tutor."
 br_hre_events.305.a.entry: "The character would make for an excellent tutor."
 br_hre_events.305.b: "The educational system of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] needs no changes."
 br_hre_events.305.b.entry: "The educational system of the court needs no changes."
 br_hre_events.305.historical_info: "An important tutor to the young Francis, who would later become Emperor Francis I of Rome in 1515, François de Moulins de Rochefort was one of the many figures who influenced the young Francis with the ideals brought forth by the Renaissance. François would remain an important advisor to Francis I whenever he became Emperor in 1515, and would be promoted to Grand Chaplain of Rome in 1519, holding the position until his death in 1526." 

 br_hre_events.306.title: "The Humanist Ideals of [target_character.GetNameWithNoTooltip]"
 br_hre_events.306.entry: "The Humanist Ideals of Christophe de Longueil"
 br_hre_events.306.desc: "Having some renown across Northern [ShowRegionName('france_region')] and the Low Countries, the humanist [target_character.GetName] has appeared in [ShowLocationName('metz')] and has caught the attention of members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Some have suggested he could make a valuable tutor for the young [scope_heir_fra.GetName] due to his humanist principles, while others have offered skepticism. Should [target_character.GetShortNameWithNoTooltip] be offered the chance to tutor the [ROOT.GetCountry.GetGovernment.GetHeirTitle], its likely he would take the opportunity to instill his tolerant views onto [scope_heir_fra.GetHimHer]."
 br_hre_events.306.a: "Offer [target_character.GetShortNameWithNoTooltip] the chance to tutor [scope_heir_fra.GetShortNameWithNoTooltip]."
 br_hre_events.306.a.entry: "Offer the character the chance to tutor the heir."
 br_hre_events.306.b: "[target_character.GetShortNameWithNoTooltip]'s humanist ideals could prove dangerous for [scope_heir_fra.GetShortNameWithNoTooltip]."
 br_hre_events.306.b.entry: "The character's humanist ideals could prove dangerous for the heir."

 br_hre_events.307.title: "[target_character.GetNameWithNoTooltip] and [ShowWorkOfArtNameWithNoTooltip('de_asse_et_partibus_eius')]"
 br_hre_events.307.entry: "Guillaume Budé, Humanist Scholar"
 br_hre_events.307.desc: "Having an eye for talent, [fra_ruler.GetName] has invited the growing reputable scholar [target_character.GetName] to the [ROOT.GetCountry.GetGovernment.GetCourtTitle] in hopes of recruiting him as an advisor. The recent publication of the [ShowWorkOfArtNameWithNoTooltip('de_asse_et_partibus_eius')] by [target_character.GetLastNameWithNoTooltip] led to the invitation from [fra_ruler.GetNameWithNoTooltip] due to respecting the works [target_character.GetLastNameWithNoTooltip] had outlined in relation to ancient coinage.\n\nWhile [target_character.GetLastNameWithNoTooltip]'s scholarly works have seen a rise in his reputation, he is also a prominent humanist, as such, his joining of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] may lead to a change in policy."
 br_hre_events.307.a: "Allow [target_character.GetLastNameWithNoTooltip] to join the [ROOT.GetCountry.GetGovernment.GetCourtTitle] and serve as an artist."
 br_hre_events.307.a.entry: "Allow him to join the court and serve as an artist."
 br_hre_events.307.b: "Praise [target_character.GetLastNameWithNoTooltip] for his work, but allow him to return to private life."
 br_hre_events.307.b.entry: "Praise him for his work, but allow him to return to private life."

 br_hre_events.308.title: "[target_character.GetNameWithNoTooltip] and [ShowWorkOfArtNameWithNoTooltip('heptameron')]"
 br_hre_events.308.entry: "Heptaméron"
 br_hre_events.308.desc: "While the late [target_sibling.GetName] was known to be a cherished writer, with [target_sibling.GetHisHer] stories earning praise among the [ROOT.GetCountry.GetGovernment.GetCourtTitle], many have suggested that [target_sibling.GetHisHer] works be preserved as an artifact within the [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nFor this reason, [target_character.GetName] has taken efforts to enshrine [target_sibling.GetNameWithNoTooltip]'s works within as the [ShowWorkOfArtNameWithNoTooltip('heptameron')], a curated collection of [target_sibling.GetHisHer] short stories, and has requested permission from [fra_ruler.GetName] to publish the collection."
 br_hre_events.308.a: "Publish the [ShowWorkOfArtNameWithNoTooltip('heptameron')] in honor of [target_sibling.GetNameWithNoTooltip]."
 br_hre_events.308.a.entry: "Publish the [ShowWorkOfArtNameWithNoTooltip('heptameron')] in honor of the character."
 br_hre_events.308.b: "Only allow a limited collection of the [ShowWorkOfArtNameWithNoTooltip('heptameron')] be made."

 br_hre_events.309.title: "#italic Collège de Rome#!"
 br_hre_events.309.entry: "$br_hre_events.309.title$"
 br_hre_events.309.desc: "Seeking to follow the framework of the #italic Collegium Trilingue#!, [target_character.GetName] has requested the patronage of [fra_ruler.GetName] for the founding of a new College in [ShowLocationName('metz')]. Following in the footsteps of the #italic Collegium Trilingue#!, [target_character.GetLastNameWithNoTooltip] hopes to establish a new center of learning for Mathematics and other dedicated studies such as those in Ancient [ShowLanguageName('greek_language')] language."
 br_hre_events.309.a: "Sponsor the foundation for the new college!"
 br_hre_events.309.b: "Refuse [target_character.GetNameWithNoTooltip]'s request, the state cannot spare the expense."
 br_hre_events.309.b.entry: "Refuse his request, the state cannot spare the expense."

 br_hre_events.310.title: "Contesting the [ShowLanguageNameWithNoTooltip('latin_language')] Language"
 br_hre_events.310.entry: "National Language of Rome"
 br_hre_events.310.desc: "For centuries, [ROOT.GetCountry.GetName] like many other states throughout [ShowContinentName('europe')] has maintained [ShowLanguageName('latin_language')] as the primary language for [ROOT.GetCountry.GetGovernment.GetCourtTitle] documents, records, and education. Seeking to eradicate the monopoly [ShowLanguageNameWithNoTooltip('latin_language')] has held as the language of knowledge and culture, [fra_ruler.GetName] along with the guidance of [target_character.GetName] has prepared an ordinance to establish [ShowDialectNameWithNoTooltip('french_dialect')] as an official alternative to [ShowLanguageNameWithNoTooltip('latin_language')]."
 br_hre_events.310.a: "Adopt the Ordinance!"
 br_hre_events.310.b: "Strive to maintain [ShowLanguageNameWithNoTooltip('latin_language')] as the primary language!"

 br_hre_events.311.title: "A New World"
 br_hre_events.311.entry: "$br_hre_events.311.title$"
 br_hre_events.311.desc: "While tales of a far away continent have circulated for quite some time now, they were mostly believed to be imaginations. However, as time has passed, these imaginations have become truth. While there are those in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] who have encouraged expeditions into these strange, new lands, the majority of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] has issued caution, as diverting finances of the state to fund expeditions could prove too costly and bring ruin onto [ROOT.GetCountry.GetName] with little to gain."
 br_hre_events.311.a: "Let us consider expeditions into these strange, new lands."
 br_hre_events.311.b: "The interior of [ROOT.GetCountry.GetNameWithNoTooltip] is a greater priority."
 br_hre_events.311.b.entry: "The interior of $LOT$ is a greater priority."

 br_hre_events.312.title: "[target_character.GetNameWithNoTooltip]'s Voyage"
 br_hre_events.312.entry: "Jacques Cartier and the Voyage to the West"
 br_hre_events.312.desc: "Following the [ROOT.GetCountry.GetGovernment.GetCourtTitle]'s interest to sponsor expeditions to the new world, [target_character.GetName], a [ShowCultureName('breton')] mariner, has caught the attention of the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. While many of the [ROOT.GetCountry.GetGovernment.GetCourtTitle]'s attempts to recruit experienced [ShowCultureGroupName('italian_group')] maritime explorers has been met with failure, [target_character.GetShortNameWithNoTooltip] experience could prove beneficial in mapping the seas of the new world."
 br_hre_events.312.a: "Entrust the exploration efforts to [target_character.GetShortNameWithNoTooltip]."
 br_hre_events.312.a.entry: "Entrust the exploration efforts to him."
 br_hre_events.312.b: "Hire him, but designate a different task for him."
 br_hre_events.312.historical_info: "Jacques Cartier was one of the first Roman explorers to reach the new world and map portions of Canada. During early exploration efforts by Rome, Italian explorers were favored for their expertise, but after being introduced to Emperor Francis by Jean Le Veneur, Jacques would be commissioned to explore and discover a 'western passage' to the markets of Asia, but instead would discover the Gulf of Saint Lawrence. Cartier discovery of Canada would lead to Rome establishing its first settlement in the new world, Charlesbourg-Imperial, in 1541. Charlesbourg-Imperial would later be abandoned in 1543 and Rome would never again establish a permanent colony in the new world until 1605 with Port Imperial in Acadia."

 br_hre_events.313.title: "Return of [target_character.GetShortNameWithNoTooltip]'s Expedition"
 br_hre_events.313.entry: "Return of Jacques's Voyage"
 br_hre_events.313.desc: "The [ShowCultureName('breton')] mariner [target_character.GetName] has returned to [GetCountry('LOT').GetName] with newly mapped regions of the new world! During his exploration, [target_character.GetShortNameWithNoTooltip] encountered tribal people in these strange new lands, and while they brought no harm to [target_character.GetShortNameWithNoTooltip] and his exploration team, they instead provided valuable information of the surrounding region.\n\nThese discoveries have now been met with suggestions by the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to encourage an expedition into the newly mapped lands in hopes of establishing a regional outpost. However, such an expedition also brings with it the risk of draining the treasury."
 br_hre_events.313.a: "Commission an expedition to settle these lands!"
 br_hre_events.313.b: "Other issues are more pressing to [GetCountry('LOT').GetNameWithNoTooltip]."
 br_hre_events.313.b.entry: "Other issues are more pressing to $LOT$."

 br_hre_events.314.title: "Proposal for the Pont Neuf"
 br_hre_events.314.entry: "$br_hre_events.314.title$"
 br_hre_events.314.desc: "While [ShowLocationName('metz')] has remained one of the most populous [target_location.GetRank.GetNameWithNoTooltip] in [ShowContinentNameWithNoTooltip('europe')] over the centuries, the growth of the [target_location.GetRank.GetNameWithNoTooltip] in the past decades has led to some challenges towards older sections of the [target_location.GetRank.GetNameWithNoTooltip]'s architecture. One of the main points of this architecture deficiency has been seen in regards to the various bridges used for transportation across the Seine river that passes through the [target_location.GetRank.GetNameWithNoTooltip], leading to some concern amongst the ministers that the increased usage of the existing bridges may lead to a collapse.\n\nIn order to combat this concern, plans for a new and modern bridge called the Pont Neuf, have been drafted by [GetCountry('LOT').GetAdjective] ministers. While the plans for the new bridge appear promising, the would bring with it a financial cost on the state still and still needs the approval of [fra_ruler.GetShortName]."
 br_hre_events.314.a: "The new Pont Neuf would serve the people of [ShowLocationNameWithNoTooltip('metz')] well."
 br_hre_events.314.b: "Scale the project back to preserve the state's treasury."
 br_hre_events.314.c: "Our current infrastructure is fine."

 br_hre_events.315.title: "Innovation In Invention Ownership"
 br_hre_events.315.entry: "$br_hre_events.315.title$"
 br_hre_events.315.desc: "Seeking to lay the foundation of more concise recording of new inventions, [fra_ruler.GetName] has issued an ordinance detailing the description of new works created within [ROOT.GetCountry.GetName]. Under the new ordinance, new inventors will need to disclose the specifications of their inventions in order to secure exclusive rights to produce their work."
 br_hre_events.315.a: "Issue the ordinance!"
 br_hre_events.315.b: "We have no need for these procedures."
 br_hre_events.315.historical_info: "The reign of Henry II saw early innovations in the issuing of patent laws with the invention of the holometer instrument by Abel Foullon in 1551. In order to secure an exclusive patent for his work, Henry II ordered Abel Foullon to publish a description detailing the specifications of the newly invented holometer. In return, Foullon was granted a 10 year exclusive patent for a sanctioned monopoly on the invention, expiring in 1561."

###########
### Age 4 ###
###########

 br_hre_events.400.title: "Cardinal de Richelieu"
 br_hre_events.400.entry: "$br_hre_events.400.title$"
 br_hre_events.400.desc: "Since his appointment as a Cardinal, [target_character.GetName] has become an influential figure in the [ROOT.GetCountry.GetGovernment.GetAdjective] politics of [ROOT.GetCountry.GetName]. As a minister and close advisor to the [fra_ruler.GetName], he has scored major domestic victories that have brought about the weakening of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobility')]'s political privileges. Now, [target_character.GetShortNameWithNoTooltip] is seeking to expand the influence of [ROOT.GetCountry.GetNameWithNoTooltip] on the European continent, but will only do so if the [ROOT.GetCountry.GetGovernment.GetCourtTitle] further welcomes his influence."
 br_hre_events.400.historical_info: "Armand Jean du Plessis, commonly known as Cardinal de Richelieu, was 39 years old when he became Chief Minister of Emperor Louis XIII in 1624. His main successful efforts in domestic policy were the fight against the upper nobility and the Protestant political privileges. He also supported overseas trade, colonial expansion and the constitution of a permanent imperial navy. The most notable achievement remained the diplomatic game he played during the Thirty Years War, pushing with Roman gold the Swedish intervention in 1630 and ultimately with Rome joining the war in 1635. His aims had been the reduction of the House of Habsburg and the extrication of Rome from encirclement by enemy lands. He is considered as the inventor of the concept of Real Politik."
 br_hre_events.400.a: "His influence may prove useful in the times to come."

 br_hre_events.401.title: "Invention of the Table Knife"
 br_hre_events.401.entry: "$br_hre_events.401.title$"
 br_hre_events.401.desc: "Throughout the imperial court, Cardinal [target_character.GetName] is known by all for his rather refined and elegant taste in the court's cuisine. Seeking to further improve on the court's delicacy, [target_character.GetShortNameWithNoTooltip] embarked on a personal task to better improve the utensils used by the various imperial chefs. Now after intense and rigorous research, [target_character.GetShortNameWithNoTooltip] has unveiled his designs of the table knife, which features a curved blade and pointed tip, a utensil that [target_character.GetShortNameWithNoTooltip] insists would make it perfect for slicing through vegetables and meats. Such an invention would make the delicacies of the court all the more enjoyable."
 br_hre_events.401.a: "This is high culture!"

 br_hre_events.402.title: "[fronde_uprising.GetNameWithNoTooltip] in [ROOT.GetCountry.GetNameWithNoTooltip]"
 br_hre_events.402.entry: "The Fronde in Rome"
 br_hre_events.402.desc: "Countless decades of declining political power to the rise of imperial absolutism, the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have convened together to make a final stand against the absolutist reign of [fra_ruler.GetName]. While no major members of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] have made a public maneuver towards direct rebellion against [fra_ruler.GetShortNameWithNoTooltip], the growing storm will be instrumental in the future of [ROOT.GetCountry.GetName]."
 br_hre_events.402.historical_info: "The Fronde (1648-1653) was mostly the last revolt of the Roman nobility against imperial absolutism. It had started by the revolt of the Parliament of Metz (at the time the highest Roman court with jurisdiction over imperial edicts) against the domestic policies of Cardinal Mazarin, who acted as Prime Minister of the 5-year-old Louis XIV. It was followed by that of the upper nobility, but the rebellion was finally suppressed by a combination of Machiavellian diplomacy, betrayals and reverses of fortune. The Parliament was muzzled (it would not be convened again before 1789) and the upper nobility deprived of political power, preparing the advent of total imperial absolutism under the Emperor, Louis XIV, after 1661."
 br_hre_events.402.a: "L'État, c'est moi."
 br_hre_events.402.b: "Appease them, we cannot risk a conflict with the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]!"
 br_hre_events.402.b.entry: "Appease them, we cannot risk a conflict with the $nobles_estate$!"

 br_hre_events.403.title: "Academie Romaine"
 br_hre_events.403.entry: "$br_hre_events.403.title$"
 br_hre_events.403.desc: "A patron of literature, Cardinal [target_character.GetName] has petitioned for the creation of the #italic l'Academie Romaine#!, an institution [target_character.GetShortNameWithNoTooltip] hopes can promote [ROOT.GetCountry.GetAdjectiveWithNoTooltip] language and literary pursuits. While such an institution could prove beneficial, the cost to fulfill [target_character.GetShortNameWithNoTooltip]'s plans may prove too strong a burden on the state's finances."
 br_hre_events.403.historical_info: "Cardinal de Richelieu, being a liberal patron of literature, created the l'Academie Romaine in 1636 in order to promote Roman language and literary pursuits. Although the scientific part of the academy never matched the literary one in fame, it did make a number of important scientific discoveries in the eighteenth century. It was Roman expeditions in 1735 and 1743, for instance, which established the oblate shape of the earth."
 br_hre_events.403.a: "Fund the creation of the Academie Romaine!"
 br_hre_events.403.b: "No, it is too expensive."

 br_hre_events.404.title: "Colbertism"
 br_hre_events.404.entry: "$br_hre_events.404.title$"
 br_hre_events.404.desc: "Appointed as the minister of finance by [fra_ruler.GetName], [target_character.GetName] has done major work to develop [ROOT.GetCountry.GetName]'s economy in the modern age. Through his current tenure as minister of finance, [target_character.GetLastNameWithNoTooltip] has greatly improved the tax collection of the state, and has maintained an impressive management of the state's budget. Furthermore, [target_character.GetLastNameWithNoTooltip]'s own brand of mercantilism, #italic 'Colbertism'#! has proven to be an effective trade practice.\n\nWhile [target_character.GetLastNameWithNoTooltip]'s economic policies have proven effective, his calls to expand the state's navy has sparked some concern that could impact the state's newfound surplus, and those in the court have suggested that [target_character.GetLastNameWithNoTooltip] should instead focus purely on the economics of the state."
 br_hre_events.404.historical_info: "Nominated Minister of Finance in 1661, Jean Colbert developed the first national economy of the modern age. His state-guided economy included better tax collection, statistical planning of the budget and regular bookkeeping. An advocate of his own brand of Mercantilism (referred to as Colbertism), he aimed at a favorable Roman balance of trade through the export of valuable finished products and high import tariffs. He encouraged a more efficient domestic trade, established state monopolies, subsidized manufactures, promoted navigation and trade associations, fixed agricultural prices, and encouraged marriage while prohibiting emigration (except to Canada). To support his policies, he also greatly enlarged the size of the Imperial Roman navy. While Colbertism promoted commerce and crafts, thereby increasing prosperity, peasants were not stimulated to increase their production."
 br_hre_events.404.a: "A stronger navy would further facilitate [target_character.GetLastNameWithNoTooltip]'s policy."
 br_hre_events.404.a.entry: "A stronger navy would further facilitate his policy."
 br_hre_events.404.b: "Concentrate on Economic Domination."

 br_hre_events.405.title: "The Commissioning of Versailles"
 br_hre_events.405.entry: "$br_hre_events.405.title$"
 br_hre_events.405.desc: "Seeking to demonstrate [ROOT.GetCountry.GetAdjective] grandeur on the world stage, [fra_ruler.GetName] has laid the foundation for the creation of a grand palace of supreme magnificence. Choosing the site of a old dynastic hunting lodge of the [fra_ruler.GetDynasty.GetName], [fra_ruler.GetShortNameWithNoTooltip] hopes that [fra_ruler.GetHerHis] vision of this grand palace can be made a reality, a palace that none would be able to rival."
 br_hre_events.405.historical_info: "In 1669 Louis XIV (1638-1715) decided to convert an old hunting lodge at Versailles into a palace of unprecedented magnificence. It was completed in 1682, and the court moved there in 1683. There was not a kingly or princely court in Europe which could match Versailles for the opulence of its gilded interiors, its mirrors and chandeliers, with an appropriately matching flamboyance of courtly ceremony, and there was not a kingly or princely court in Europe which did not, either openly or secretly, aspire to match this model."
 br_hre_events.405.a: "We need it for the Glory."
 br_hre_events.405.b: "Such a project would be a great expense on the state."

 br_hre_events.406.title: "[target_character.GetNameWithNoTooltip]"
 br_hre_events.406.entry: "René Descartes"
 br_hre_events.406.desc: "A renowned mathematician, scientist, and philosopher of the current age, [target_character.GetName] has earned acclaim throughout Europe for his various groundbreaking works and philosophical essays. Initially gaining acclaim for his opposition to scholastic Aristotelianism, [target_character.GetLastNameWithNoTooltip] has attracted many great minds to [ROOT.GetCountry.GetName] as well as caught the attention of the court, with some suggesting that [target_character.GetLastNameWithNoTooltip] should be sponsored and welcomed to the court as an honored guest."
 br_hre_events.406.historical_info: "Roman mathematician, scientist and philosopher René Descartes been called the father of modern philosophy because he was one of the first to oppose scholastic Aristotelianism. Descartes began by methodically doubting knowledge based on authority of the senses over reason then found certainty in the intuition that when he is thinking he exists - this he expressed in the famous statement 'I think therefore I am.' Descartes developed a dualistic system in which he distinguished radically between mind the essence of which is thinking and matter the essence of which is extension in three dimensions."
 br_hre_events.406.a: "We should sponsor his genius innovation!"

 br_hre_events.407.title: "[target_character.GetNameWithNoTooltip] and the [ShowLanguageNameWithNoTooltip('wendat_language')] Indians"
 br_hre_events.407.entry: "Samuel de Champlain and the Hurons"
 br_hre_events.407.desc: "[target_character.GetName] was dispatched by a [ROOT.GetCountry.GetAdjective] noble who had been given the privilege to establish a fur trading company by [fra_ruler.GetName]. During his travels [target_character.GetShortNameWithNoTooltip] made contact and befriended the [ShowLanguageName('wendat_language')] Indians. The time spent with the [ShowLanguageNameWithNoTooltip('wendat_language')] Indians exploring the area has left potential for [ROOT.GetCountry.GetNameWithNoTooltip] to form cordial relations in these lands, although the neighboring [ShowCultureGroupName('haudenosaunee_group')] may prove more fruitful allies."
 br_hre_events.407.a: "Let us befriend the [ShowLanguageNameWithNoTooltip('wendat_language')]."
 br_hre_events.407.b: "Let us befriend the [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]."

 br_hre_events.408.title: "[target_character.GetNameWithNoTooltip]"
 br_hre_events.408.entry: "Samuel Emerges as a Prominent Explorer"
 br_hre_events.408.desc: "Hailing from a family of sailors, [target_character.GetName] has caught the attention of several advisors in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] seeking to develop [GetCountry('LOT').GetName]'s renewed colonial ambitions. These advisors have proposed to [fra_ruler.GetShortName] that [target_character.GetShortNameWithNoTooltip] would make a fine explorer to embark on an expedition towards the northern regions of the new world in hopes of establishing new [GetCountry('LOT').GetAdjectiveWithNoTooltip] settlements there. While [target_character.GetShortNameWithNoTooltip] should be rather capable, his expertise may be better served in expeditions elsewhere."
 br_hre_events.408.a: "Hire [target_character.GetShortNameWithNoTooltip] to explore the northern regions of the New World."
 br_hre_events.408.a.entry: "Hire him to explore the northern regions of the New World."
 br_hre_events.408.b: "We have other plans for him."

 br_hre_events.409.title: "The Voyage of [target_character.GetNameWithNoTooltip]"
 br_hre_events.409.entry: "The Voyage of François Martin de Vitré"
 br_hre_events.409.desc: "A distinguished adventurer and sailor, [target_character.GetName], returned to [ShowLocationName('metz')] today, stirring much curiosity. Being a member of one of the #italic Croissant#!, one of the ships that set sail with intentions to establish trade with $india$, [target_character.GetShortNameWithNoTooltip] is one of the few people of [GetCountry('LOT').GetAdjective] origin to reach those foreign lands. while accomplishing its goal, the #italic Croissant#! was ambushed by privateers and captured. While [target_character.GetShortNameWithNoTooltip] has now returned safely to [GetCountry('LOT').GetNameWithNoTooltip], his adventure to the far east has created curiosity in the streets.\n\nEven in the palace, [fra_ruler.GetShortName] has expressed interest in meeting [target_character.GetShortNameWithNoTooltip] personally as a honored guest. There are those in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] who feel that [target_character.GetShortNameWithNoTooltip]'s accounts deserve to be forever documented."
 br_hre_events.409.a: "Commission him to write an account of his travels!"
 br_hre_events.409.b: "Tales of his travels are fascinating!"

 br_hre_events.410.title: "[fra_ruler.GetShortNameWithNoTooltip] Ambitions in $india$"
 br_hre_events.410.entry: "The Ruler and the East India Company"
 br_hre_events.410.desc: "Following the written accounts of the travels of [target_character.GetName], [fra_ruler.GetName] has been developing a fixation on establish a trading outpost in $india$. While [fra_ruler.GetShortNameWithNoTooltip] has pitched the idea towards the [ROOT.GetCountry.GetGovernment.GetCourtTitle], it has been met with mixed responses, with concerns that it would distract from attempts to develop new world settlements. Others have also mentioned that an attempt to establish a trade company in $india$ may prove costly initially, but eventually would bring many trade benefits that [GetCountry('LOT').GetName] could reap financially."
 br_hre_events.410.a: "Pursue further interests in $india$."
 br_hre_events.410.b: "Prevent [fra_ruler.GetShortNameWithNoTooltip]'s ambition from being our downfall."
 br_hre_events.410.b.entry: "Prevent his ambition from being our downfall."

 br_hre_events.411.title: "[ShowWorkOfArtNameWithNoTooltip('ballet_de_la_merlaison')]"
 br_hre_events.411.entry: "Ballet of the Blackbird Hunt"
 br_hre_events.411.desc: "Initially a ballet born out of the passion of [fra_ruler.GetName] for [ROOT.GetCountry.GetGovernment.GetCourtTitle] ballet, the [ShowWorkOfArtName('ballet_de_la_merlaison')] has attracted much praise from the [ROOT.GetCountry.GetGovernment.GetCourtTitle] as well as visiting [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Visitors to the ballet have often praised the commitment of [fra_ruler.GetName] to the play, noting from [fra_ruler.GetHisHer] participation in playing various roles to [fra_ruler.GetHisHer] contribution to the designing of the costumes for the cast. Others have gone on to mention the play as one of the greatest across all of [ShowContinentName('europe')]."
 br_hre_events.411.a: "A wonderful ballet!"
 br_hre_events.411.b: "Future ballets shall be held only for the [ROOT.GetCountry.GetGovernment.GetAdjective] family."
 br_hre_events.411.b.entry: "Future ballets shall be held only for the imperial family."

 br_hre_events.412.title: "[target_character.GetNameWithNoTooltip]'s Centralization Efforts"
 br_hre_events.412.entry: "Centralization Efforts of Cardinal Richelieu"
 br_hre_events.412.desc: "Since assuming the role as a minister of the state, [target_character.GetName] has taken many steps to consolidate power and centralize the bureaucracy of [ROOT.GetCountry.GetName]. While many of [target_character.GetHisHer] predecessors have attempted to centralize power, they have largely been pushed back by many of the old feudal families that still maintain a power base of their own.\n\nNonetheless, [target_character.GetLastNameWithNoTooltip] continues drafting policies and edicts for the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to enact, though some are growing increasingly worried that these centralization efforts by [target_character.GetLastNameWithNoTooltip] may once again earn the wrath of the old elite."
 br_hre_events.412.a: "Allow [target_character.GetNameWithNoTooltip] to continue [target_character.GetHisHer] efforts."
 br_hre_events.412.a.entry: "Allow him to continue his efforts."
 br_hre_events.412.b: "Curtail some of [target_character.GetHisHer] efforts to prevent infuriating the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 br_hre_events.412.b.entry: "Curtail some of his efforts to prevent infuriating the $nobles_estate$."

 br_hre_events.413.title: "[target_character.GetNameWithNoTooltip]'s Supression of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
 br_hre_events.413.entry: "Richelieu's Suppression of the Nobility"
 br_hre_events.413.desc: "Throughout the centuries, the old feudal nobility has remained one of the most powerful and ingrained institutions in [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetAdjective] society. Despite the transition from levy based armies to more permanent and professional ones, the various feudal noble houses of [ROOT.GetCountry.GetNameWithNoTooltip] have retained respectable power in their own right, and even maintained private armies for their own interests.\n\nSeeking to lay the foundation for breaking this threat and ensuring [ROOT.GetCountry.GetGovernment.GetAdjective] dominance, [target_character.GetName] has steadily been drafting policies targeting these families, as well as dissolving offices that have largely become symbolic, such as the Constable of [ROOT.GetCountry.GetNameWithNoTooltip]. [target_character.GetShortNameWithNoTooltip] continuedly strives to weaken the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] and has seen many delegates from the various families issue grievances with [target_character.GetHisHer] policies, with some warning they may be forced to take action."
 br_hre_events.413.a: "Now is the time to secure power for the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 br_hre_events.413.a.entry: "Now is the time to secure power for the $crown_estate$."
 br_hre_events.413.b: "Request [target_character.GetShortNameWithNoTooltip] be cautious with [target_character.GetHisHer] policies."
 br_hre_events.413.b.entry: "Request him be cautious with his policies."
 br_hre_events.413.c: "[target_character.GetShortNameWithNoTooltip] has gone too far, exile [target_character.GetHimHer]!"
 br_hre_events.413.c.entry: "The character has gone too far, exile him!"

 br_hre_events.414.title: "Day of the Dupes"
 br_hre_events.414.entry: "$br_hre_events.414.title$"
 br_hre_events.414.desc: "While [target_character.GetName] and [fra_queen_mother.GetName] have never seen eye to eye in the politics of the [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle], the two have never once dared to openly challenge the other's authority. However, today [fra_queen_mother.GetShortNameWithNoTooltip] alongside her closest allies presented an ultimatum to [fra_ruler.GetName] demanding the firing of [target_character.GetShortNameWithNoTooltip] and [target_character.GetHisHer] exile from [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nThe growing power of [target_character.GetShortNameWithNoTooltip] in [ROOT.GetCountry.GetAdjective] internal affairs has seen [fra_queen_mother.GetShortNameWithNoTooltip] steadily lose [fra_queen_mother.GetHisHer] influence in the [ROOT.GetCountry.GetGovernment.GetCourtTitle], which has resulted in dysfunction in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] by closely aligned allies. Should [fra_ruler.GetShortNameWithNoTooltip] decline [fra_queen_mother.GetShortNameWithNoTooltip]'s ultimatum, [fra_queen_mother.GetSheHe] will leave [ROOT.GetCountry.GetGovernment.GetCourtTitle] and take her closest allies with [fra_queen_mother.GetHimHer], however accepting the ultimatum would lead to the pausing of ongoing efforts by [target_character.GetShortNameWithNoTooltip]."
 br_hre_events.414.a: "[target_character.GetShortNameWithNoTooltip] is a proven minister, reject the demands."
 br_hre_events.414.a.entry: "The character is a proven minister, reject the demands."
 br_hre_events.414.b: "Demote [target_character.GetShortNameWithNoTooltip] so that [fra_queen_mother.GetShortNameWithNoTooltip] can retain political power."
 br_hre_events.414.b.entry: "Demote him so that the empress mother can retain political power."
 br_hre_events.414.c: "Accept [fra_queen_mother.GetShortNameWithNoTooltip] ultimatum and remove [target_character.GetShortNameWithNoTooltip] from [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 br_hre_events.414.c.entry: "Accept the empress mother ultimatum and remove the character from court."

 br_hre_events.415.title: "[target_character.GetNameWithNoTooltip] and the Military Expenses of the State"
 br_hre_events.415.entry: "Richelieu's Military Budget Reforms"
 br_hre_events.415.desc: "Seeking to ensure the security of [ROOT.GetCountry.GetName] both financially and militarily, [target_character.GetName] has been lobbying members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] as well as [fra_ruler.GetName] to raise a new [ShowGovernmentReformName('gabelle')] and [ShowLawName('fra_taille')] tax. Military expenses in recent times have proven to be a great strain on the state, and with the evolving innovations, the risk of [ROOT.GetCountry.GetNameWithNoTooltip] falling behind militarily would leave the state in a precarious situation.\n\nWhile in the past the [ShowGovernmentReformNameWithNoTooltip('gabelle')] and [ShowLawNameWithNoTooltip('fra_taille')] have been levied, the proposal set forth by [target_character.GetShortNameWithNoTooltip] would generate considerable revenue for the state, and allow for some military reforms. While these reforms could prove helpful, it also brings with it the risk of upsetting the populace with the severity of the tax."
 br_hre_events.415.a: "Adopt the measure, we cannot risk falling behind militarily."
 br_hre_events.415.b: "Strive for a modest tax to avoid overtaxing the populace."
 br_hre_events.415.c: "Reject the proposal, we cannot inflict such a burden on the populace."

 br_hre_events.416.title: "Ordinance of [GetCurrentYear]"
 br_hre_events.416.entry: "Ordonnances of 1627"
 br_hre_events.416.desc: "Following letters received from several colonial governors across our colonial settlements, there has been a steady increase in local natives assimilating and joining as members of the local populace. While the reports from the governors suggest these interactions have been largely fruitful, most [ROOT.GetCountry.GetAdjective] colonial laws only apply to natural-born [ROOT.GetCountry.GetAdjectiveWithNoTooltip] people in these settlements.\n\nSeeking to account for the growing assimilation of native people into our colonial settlements, [target_character.GetName] have drafted a new Ordinance proclaiming any natives who fully embrace [ShowReligionName('catholic')] will be considered a natural citizen of [ROOT.GetCountry.GetNameWithNoTooltip], and as such, will enjoy the full benefits and protections of the state."
 br_hre_events.416.a: "Adopt the Ordinance!"
 br_hre_events.416.b: "Issue a more autonomous Ordinance."

 br_hre_events.417.title: "The Passing of [target_character.GetNameWithNoTooltip]"
 br_hre_events.417.entry: "The Passing of Richelieu"
 br_hre_events.417.desc: "Having served the state faithfully for many years as a powerful minister and bringing many accomplishments for the state, [fra_ruler.GetName] and many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] were deeply saddened upon learning of [target_character.GetName]'s passing.\n\nWhile his tenure saw many attempts to strengthen the power of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] and the state, it also earned him many enemies, both at [ROOT.GetCountry.GetGovernment.GetCourtTitle] and abroad. It will likely be some time before [ROOT.GetCountry.GetName] will enjoy a renowned minister such as [target_character.GetShortNameWithNoTooltip]."
 br_hre_events.417.a: "[target_character.GetShortNameWithNoTooltip] has left a lasting impact on [ROOT.GetCountry.GetNameWithNoTooltip]."
 br_hre_events.417.a.entry: "The character has left a lasting impact on us."
 br_hre_events.417.b: "The controversy surrounding [target_character.GetShortNameWithNoTooltip] will trouble us no longer."
 br_hre_events.417.b.entry: "The controversy surrounding him will trouble us no longer."

 br_hre_events.418.title: "Divine Right to Rule"
 br_hre_events.418.entry: "$br_hre_events.418.title$"
 br_hre_events.418.desc: "While it has been tradition that a [ROOT.GetCountry.GetGovernment.GetRulerTitle] takes action to form a closely aligned council with a chief minister for advice, [target_character.GetName] has positioned [target_character.GetHerselfHimself] to break that long standing tradition. Seeing [target_character.GetHerselfHimself] as a gifted [ROOT.GetCountry.GetGovernment.GetRulerTitle], whose own rule is divinely sanctioned. [target_character.GetShortNameWithNoTooltip] has declared to [target_character.GetHisHer] council that [target_character.GetHeShe] intends to rule without the guidance of a chief minister, and will instead assume the role [target_character.GetHerselfHimself]. It is clear that [target_character.GetShortNameWithNoTooltip] intends to cement [target_character.GetHisHer] legacy as a formidable and prestigious ruler of [ROOT.GetCountry.GetName]."
 br_hre_events.418.a: "[target_character.GetShortNameWithNoTooltip]'s rule will be one to remember."
 br_hre_events.418.a.entry: "His rule will be one to remember."
 br_hre_events.418.b: "[target_character.GetShortNameWithNoTooltip]'s rule will hopefully be an era of stability and peace."
 br_hre_events.418.b.entry: "His rule will hopefully be an era of stability and peace."

 br_hre_events.419.title: "[scope_former_consort.GetNameWithNoTooltip]'s Regency"
 br_hre_events.419.entry: "The Regency of the Empress and Mazarin"
 br_hre_events.419.desc: "In the event of [scope_ruler_dead.GetHisHer] passing, [scope_ruler_dead.GetName] had declared that the young [ROOT.GetCountry.GetGovernment.GetHeirTitle] have a regency council formed by [scope_ruler_dead.GetShortNameWithNoTooltip]'s closest advisors to prepare [scope_heir_fra.GetName] for [scope_heir_fra.GetHisHer] eventual ascension to the throne. Notably however, [scope_former_consort.GetName], along with the backing of prominent [ROOT.GetCountry.GetGovernment.GetCourtTitle] allies such as [target_character.GetName] have demanded that [scope_former_consort.GetHeShe] be installed as acting regent, seeking to undermine the last wishes of [scope_ruler_dead.GetNameWithNoTooltip].\n\nWhile it was [scope_ruler_dead.GetShortNameWithNoTooltip]'s wish for [scope_heir_fra.GetShortNameWithNoTooltip] to be governed by the regency council, the ambitions of [scope_former_consort.GetShortNameWithNoTooltip] may bring instability if she is not instated as regent."
 br_hre_events.419.a: "Allow [scope_former_consort.GetShortNameWithNoTooltip] to rule as regent."
 br_hre_events.419.a.entry: "Allow her to rule as regent."
 br_hre_events.419.b: "We shall carry out [scope_ruler_dead.GetShortNameWithNoTooltip]'s last wishes."
 br_hre_events.419.b.entry: "We shall carry out his last wishes."

 br_hre_events.420.title: "Suspected Corruption of [target_character.GetNameWithNoTooltip]"
 br_hre_events.420.entry: "Suspected Corruption of Nicolas Fouquet"
 br_hre_events.420.desc: "A key minister in the state's finances, [target_character.GetName] has served in the position for quite some time now. However, in recent months, there have been rumors circulating that [target_character.GetShortNameWithNoTooltip] has grown to have a more luxurious lifestyle, with a notable expansion of his personal estate. This has led to speculation that [target_character.GetShortNameWithNoTooltip] may be using his position as a minister of finance to embezzle funds from the [ROOT.GetCountry.GetGovernment.GetAdjective] treasury to finance his own personal wealth. While many on the council have called for a investigation for suspicions of corruption, The fate of the minister ultimately rests with [fra_ruler.GetName]."
 br_hre_events.420.a: "[target_character.GetLastNameWithNoTooltip] must resign at once!" 
 br_hre_events.420.a.entry: "The character must resign at once!" 
 br_hre_events.420.b: "Admonish him, but allow him to retain his current position."
 br_hre_events.420.c: "His supposed corruption is just baseless rumors."

 br_hre_events.421.title: "Taxation of the Aristocracy"
 br_hre_events.421.entry: "$br_hre_events.421.title$"
 br_hre_events.421.desc: "While the old [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] of [ROOT.GetCountry.GetName] has long enjoyed special privileges, some of which have enabled many to live a luxurious lifestyle, [fra_ruler.GetName] has been making efforts to establish the first ever direct tax on members of the old aristocracy. While many previous tax codes have waived special exemptions for the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')], such as the [ShowLawName('fra_taille')], [fra_ruler.GetShortNameWithNoTooltip]'s proposal would signal an end to centuries of exemption privileges granted to these elites.\n\nWhile those in the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] will no doubt air grievances towards [fra_ruler.GetShortNameWithNoTooltip], the perpetuation of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] may be able to fend off any threats, although a compromise could also be reached like many previous tax codes of the past."
 br_hre_events.421.a: "It is time the old [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] paid their dues."
 br_hre_events.421.a.entry: "It is time the old $nobles_estate$ paid their dues."
 br_hre_events.421.b: "Strive for a compromise, to prevent full alienation."
 br_hre_events.421.c: "We should avoid angering the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 br_hre_events.421.c.entry: "We should avoid angering the $nobles_estate$."

 br_hre_events.422.title: "[target_character.GetLastNameWithNoTooltip]'s Army Reform"
 br_hre_events.422.entry: "Michel le Tellier and the Reforming of the Roman Army"
 br_hre_events.422.desc: "Having served both as a loyal advisor and chancellor of state, [target_character.GetName] has proven himself more than capable in cementing the rule of [fra_ruler.GetName].\n\nSeeking to further strengthen the rule of [fra_ruler.GetShortNameWithNoTooltip], [target_character.GetLastNameWithNoTooltip] has brought forth plans for reforms that would transition [ROOT.GetCountry.GetNameWithNoTooltip]'s standing army to more of a professional one, while at the same time strengthening the authority of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. In order to further centralize power to the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], high ranking positions in the military will now be assigned more on a merit basis instead of ties to the old [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]."
 br_hre_events.422.a: "Allow [target_character.GetLastNameWithNoTooltip] to pave the way for reform!"
 br_hre_events.422.a.entry: "Allow him to pave the way for reform!"
 br_hre_events.422.b: "Adopt most of the reforms, but retain the special privileges granted to [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] leaders."
 br_hre_events.422.b.entry: "Adopt most of the reforms, but retain the special privileges granted to $nobles_estate$ leaders."

 br_hre_events.423.title: "[fra_ruler.GetShortNameWithNoTooltip]'s Edict on Slavery"
 br_hre_events.423.entry: "Grande Ordonnance sur les Colonies of 1685"
 br_hre_events.423.desc: "Since the first early [ROOT.GetCountry.GetAdjective] colonial settlements, slavery has remained a provocative practice amongst the colonies, with many of the first settlements relying on the enslavement of those belonging to various native cultures. While not outright banning the practice, [fra_ruler.GetName] has drafted a new [ROOT.GetCountry.GetGovernment.GetAdjective] decree attempting to humanize the practice, forbidding any separation of slave families members, while also declaring any new slave must be baptized in [ShowReligionAdjective('catholic')] traditions."
 br_hre_events.423.a: "The practice of slavery in the colonies must be reined in."
 br_hre_events.423.b: "Issue the Edict, and leave the colonial governors to enforce the new law."

 br_hre_events.424.title: "Belligerent Policy of [target_character.GetNameWithNoTooltip]"
 br_hre_events.424.entry: "The Emperor's Belligerent Foreign Policy"
 br_hre_events.424.desc: "Seeking to expand [ROOT.GetCountry.GetName]'s geopolitical influence, [target_character.GetName] has taken a belligerent stance in pursuing territorial ambitions. While in the past, a [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetRulerTitle] would have not shied away from an act of conquest, [target_character.GetShortNameWithNoTooltip]'s belligerent policy has provided the opportunity for [ROOT.GetCountry.GetNameWithNoTooltip] to demonstrate its prowess on the European stage. While warfare can be brutual, it is the best way [target_character.GetShortNameWithNoTooltip] can ensure [ROOT.GetCountry.GetNameWithNoTooltip] is respected on the global stage."
 br_hre_events.424.a: "[ROOT.GetCountry.GetNameWithNoTooltip]'s power must be demonstrated on the global stage."
 br_hre_events.424.a.entry: "Our power must be demonstrated on the global stage."
 br_hre_events.424.b: "We should ease off our belligerent policy to avoid the risks of a coalition."

 br_hre_events.425.title: "Patronage of [ROOT.GetCountry.GetGovernment.GetCourtTitle] Officials"
 br_hre_events.425.entry: "$br_hre_events.425.title$"
 br_hre_events.425.desc: "While past [ROOT.GetCountry.GetGovernment.GetRulerTitle]s have been known to patronage prominent figures, both at [ROOT.GetCountry.GetGovernment.GetCourtTitle] and abroad, [fra_ruler.GetName] has gone to great lengths to offer patronage to many prominent officials at [ROOT.GetCountry.GetGovernment.GetCourtTitle]. While the [ROOT.GetCountry.GetGovernment.GetAdjective] treasury has enabled [fra_ruler.GetShortNameWithNoTooltip]'s patronage, some financial advisors to the [ROOT.GetCountry.GetGovernment.GetRulerTitle] are worried that excessive patronage may risk financial ruin upon the treasury, although the benefits of [fra_ruler.GetShortNameWithNoTooltip]'s patronage has greatly affected [fra_ruler.GetHisHer] image as a prestigious and wealthy [ROOT.GetCountry.GetGovernment.GetRulerTitle] across [ShowContinentName('europe')]."
 br_hre_events.425.a: "Allow [fra_ruler.GetShortNameWithNoTooltip] to continue [fra_ruler.GetHisHer] works of patronage."
 br_hre_events.425.a.entry: "Allow him to continue his works of patronage."
 br_hre_events.425.b: "Request the [ROOT.GetCountry.GetGovernment.GetRulerTitle] reduce [fra_ruler.GetHisHer] patronage to reduce the burden on the state."
 br_hre_events.425.b.entry: "Request him reduce his patronage to reduce the burden on the state."

 br_hre_events.426.title: "Revitalization of the Academie Romaine"
 br_hre_events.426.entry: "$br_hre_events.426.title$"
 br_hre_events.426.desc: "Founded by [target_character.GetName], the Academie Romaine has remained one of the prominent centers of literature and art across [ShowContinentName('europe')]. In recent years however, the academy has struggled due to mismanagement from its leaders. Seeking to ensure the academy can remain a beacon of [ROOT.GetCountry.GetAdjective] culture, [fra_ruler.GetName] has requested funds be diverted from the [ROOT.GetCountry.GetGovernment.GetAdjective] treasury to revitalize the Academy, along with the state maintaining close relations going forward."
 br_hre_events.426.a: "[fra_ruler.GetShortNameWithNoTooltip] will ensure the continuation of the Academie Romaine."
 br_hre_events.426.a.entry: "The ruler will ensure the continuation of the Academie Romaine."
 br_hre_events.426.b: "Fund the Academie Romaine, but not too much at the state's expense."

 br_hre_events.427.title: "[ROOT.GetCountry.GetGovernment.GetAdjective|U] Academy of the Dance"
 br_hre_events.427.entry: "$br_hre_events.427.title$"
 br_hre_events.427.desc: "One of the first edicts issued by [fra_ruler.GetName] was the founding of the #italic [ROOT.GetCountry.GetGovernment.GetAdjective|U] Academy of the Dance#!, the first of its kind in [ShowContinentName('europe')]. Since [fra_ruler.GetShortNameWithNoTooltip]'s youth, [fra_ruler.GetHeShe] has intimately engaged with the art, and sees [fra_ruler.GetHisHer] personal expertise in it as a demonstration of [fra_ruler.GetHisHer] personal power.\n\nA recent private ballet was held in [ShowLocationName('metz')] with [fra_ruler.GetShortNameWithNoTooltip] caught the attention of many in the upper elite, as [fra_ruler.GetShortNameWithNoTooltip] along with several elites of the academy performed a ballet, with the [ROOT.GetCountry.GetGovernment.GetRulerTitle] portraying Apollo, the Emperor."
 br_hre_events.427.a: "[fra_ruler.GetShortNameWithNoTooltip] has an exquisite taste for the arts!"
 br_hre_events.427.a.entry: "The ruler has an exquisite taste for the arts!"
 br_hre_events.427.b: "Such arts will undoubtedly vanish as times goes on."

 br_hre_events.428.title: "The Unparalleled [ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 br_hre_events.428.entry: "$br_hre_events.428.title$"
 br_hre_events.428.desc: "Since [fra_ruler.GetHisHer] ascension to the throne, and declaration that [fra_ruler.GetHeShe] would rule without a grand minister, [fra_ruler.GetName] has proven [fra_ruler.GetHerselfHimself] to be one of the most prestigious [ROOT.GetCountry.GetGovernment.GetRulerTitle] in [ROOT.GetCountry.GetAdjective] history with their many acts. While [fra_ruler.GetShortNameWithNoTooltip] authority is widely respected across the [ROOT.GetCountry.GetGovernment.GetCourtTitle] and [ROOT.GetCountry.GetNameWithNoTooltip], both friends and foe alike across [ShowContinentName('europe')] have offered praise to the reputation [fra_ruler.GetShortNameWithNoTooltip] has built for [fra_ruler.GetHerselfHimself]. While one day [fra_ruler.GetShortNameWithNoTooltip] rule will come to an end, [fra_ruler.GetHeShe] will undoubtable be remembered as [ROOT.GetCountry.GetNameWithNoTooltip]'s most prestigious [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 br_hre_events.428.a: "[fra_ruler.GetShortNameWithNoTooltip]'s rule will be one to be remembered."
 br_hre_events.428.a.entry: "His rule will be one to be remembered."

 br_hre_events.429.title: "Influence in [indochina_french_sphere.GetNameWithNoTooltip]"
 br_hre_events.429.entry: "Influence in Indochina"
 br_hre_events.429.desc: "While [ROOT.GetCountry.GetAdjective] traders have increasingly become active in eastern trade, several eastern countries have also caught the attention of the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle] along with [fra_ruler.GetName]. Some advisors in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have taken an interest towards [indochina_french_sphere.GetName], a [indochina_french_sphere.GetFlavorRank] that would make for a valuable partner in the region, and have suggested establishing an embassy. Others however, view [indochina_french_sphere.GetNameWithNoTooltip] as a middling [indochina_french_sphere.GetFlavorRank], and potentially a region to establish a [ROOT.GetCountry.GetAdjectiveWithNoTooltip] protectorate."
 br_hre_events.429.a: "Strive to establish relations in [indochina_french_sphere.GetNameWithNoTooltip] with an embassy."
 br_hre_events.429.a.entry: "Strive to establish relations in them with an embassy."
 br_hre_events.429.b: "Let us establish a more direct influence in [indochina_french_sphere.GetNameWithNoTooltip]."
 br_hre_events.429.b.entry: "Let us establish a more direct influence in them."

 br_hre_events.430.title: "Jesuit Missions in [GetCountry('CHI').GetNameWithNoTooltip]"
 br_hre_events.430.entry: "Jesuit Missions in China"
 br_hre_events.430.desc: "While relations between [ROOT.GetCountry.GetName] and [GetCountry('CHI').GetName] have been formally established for quite some time now, the current [GetCountry('CHI').GetAdjectiveWithNoTooltip] [GetCountry('CHI').GetGovernment.GetRulerTitle] has been resistant in allowing foreign influence in the daily life of [GetCountry('CHI').GetNameWithNoTooltip]'s populace.\n\nSeeking to spread the word of [ShowReligionName('catholic')], [target_character.GetName] alongside other Jesuits have petitioned [fra_ruler.GetName] to allow them to enter [GetCountry('CHI').GetNameWithNoTooltip] alongside our next dignitaries visit to the state. While this would aid in spreading the true faith, it brings with it the risks of causing a diplomatic accident."
 br_hre_events.430.a: "May [target_character.GetShortNameWithNoTooltip] spread the [ShowReligionAdjectiveWithNoTooltip('catholic')] faith abroad!"
 br_hre_events.430.a.entry: "May him spread the [ShowReligionAdjectiveWithNoTooltip('catholic')] faith abroad!"
 br_hre_events.430.b: "Forbid the Jesuits to prevent a Diplomatic incident."

 br_hre_events.431.title: "An Exotic Gift from the [GetCountry('POR').GetAdjectiveWithNoTooltip] [GetCountry('POR').GetGovernment.GetRulerTitle]"
 br_hre_events.431.entry: "Gift from the Portuguese King"
 br_hre_events.431.desc: "While the construction of Versailles has seen many prominent dignitaries arrive from various nations all across [ShowContinentNameWithNoTooltip('europe')], it is not often the [ROOT.GetCountry.GetGovernment.GetCourtTitle] receives the arrival of another [GetCountry('POR').GetGovernment.GetRulerTitle] in person. As a gesture of goodwill and friendship, [por_ruler.GetName] and [por_ruler.GetHisHer] entourage have brought alongside them an exotic animal from [ShowContinentName('africa')], an #italic Elephant#!. While the [ROOT.GetCountry.GetGovernment.GetCourtTitle] holds records of elephants from past arrival of them in [ROOT.GetCountry.GetName], this is the first time many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] and [fra_ruler.GetName] have had the pleasure of witnessing the species firsthand. [por_ruler.GetShortNameWithNoTooltip] hopes that the gift of the exotic elephant for [fra_ruler.GetShortNameWithNoTooltip]'s personal menagerie could help foster good relations between [ROOT.GetCountry.GetNameWithNoTooltip] and [GetCountry('POR').GetNameWithNoTooltip]."
 br_hre_events.431.a: "Host [por_ruler.GetShortNameWithNoTooltip] at Versailles, and graciously accept [por_ruler.GetHisHer] exotic gift."
 br_hre_events.431.a.entry: "Host him at Versailles, and graciously accept his exotic gift."
 br_hre_events.431.b: "Reject the generous gift, but show hospitality to the [GetCountry('POR').GetAdjectiveWithNoTooltip] [GetCountry('POR').GetGovernment.GetRulerTitle]."
 br_hre_events.431.b.entry: "Reject the generous gift, but show hospitality to the $POR_ADJ$ ruler."

 br_hre_events.432.title: "Rule by the Four Councils"
 br_hre_events.432.entry: "$br_hre_events.432.title$"
 br_hre_events.432.desc: "Seeking to form an effective board of advisors for tackling the various matters facing [ROOT.GetCountry.GetName], [fra_ruler.GetName] has chosen to delegate the varying matters of state to four varying councils. The High Council forms the most essential of these councils, tackling matters of state. The Council of Messages forms the council tackling reports of prosperity and other economic affairs ongoing in the provinces. Religious affairs of the state are delegated to the Council of Conscience, while lastly, the Imperial Council of Finances manages the treasury of the state."
 br_hre_events.432.a: "Adopt the system of four councils!"
 br_hre_events.432.b: "We have no need for this delegation of state affairs."

 br_hre_events.433.title: "[target_character.GetNameWithNoTooltip]"
 br_hre_events.433.entry: "Vauban ideals"
 br_hre_events.433.desc: "Having proven himself a renowned expertise in the arts of fortifications, [target_character.GetName] has quickly emerged as a favorite advisor and close friend to [fra_ruler.GetName]. While [target_character.GetShortNameWithNoTooltip] holds several honorary titles, many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested its past time he be made the Marshal of [ROOT.GetCountry.GetName], having already proven himself a capable and strategic individual."
 br_hre_events.433.a: "Appoint [target_character.GetShortNameWithNoTooltip] as Marshal!"
 br_hre_events.433.a.entry: "Appoint him as Marshal!"
 br_hre_events.433.b: "[target_character.GetShortNameWithNoTooltip] current titles suit him best."
 br_hre_events.433.b.entry: "The character current titles suit him best."

 br_hre_events.434.title: "The Expertise of [target_character.GetNameWithNoTooltip]"
 br_hre_events.434.entry: "The Engineering of Vauban"
 br_hre_events.434.desc: "Since assuming the role of Marshal, [target_character.GetName] has taken the reins in updating fortifications across [ROOT.GetCountry.GetName], most notably those in key strategic positions. While [target_character.GetShortNameWithNoTooltip] is undoubtedly a master in the art of defense, his knowledge of the fortifications across [ShowContinentNameWithNoTooltip('europe')] has also seen newly envisioned plans for tackling the fortifications of our rivals in the event of war."
 br_hre_events.434.a: "Let us employ [target_character.GetShortNameWithNoTooltip]'s tactics!"
 br_hre_events.434.a.entry: "Let us employ his tactics!"
 br_hre_events.434.b: "Prioritize studying [target_character.GetShortNameWithNoTooltip]'s offense tactics over fortifications efforts."
 br_hre_events.434.b.entry: "Prioritize studying his offense tactics over fortifications efforts."

 br_hre_events.435.title: "Introduction of the Peruke"
 br_hre_events.435.entry: "$br_hre_events.435.title$"
 br_hre_events.435.desc: "Out of fear of being seen as weak, [fra_ruler.GetName] has recently adopted the wearing of a #italic Peruke#!, or Wig, as a countermeasure to growing signs of early baldness. While at first a rather peculiar change of fashion for the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to witness, other courtiers have slowly begun to don the Peruke as a growing shift in [ROOT.GetCountry.GetGovernment.GetCourtTitle] headwear. What was originally intended to be a way to counter a symbol of weakness has now grown into a new age of fashion, as rumors from [adopted_peruke_court.GetName] suggest that the [adopted_peruke_court.GetAdjective] elite have taken to adopting the Peruke as well."
 br_hre_events.435.a: "Fully embrace the new [ROOT.GetCountry.GetGovernment.GetCourtTitle] for years to come."
 br_hre_events.435.a.entry: "Fully embrace the new court for years to come."
 br_hre_events.435.b: "Only shall the [ROOT.GetCountry.GetGovernment.GetRulerTitle] wear the Peruke out of necessity."
 br_hre_events.435.b.entry: "Only shall he wear the Peruke out of necessity."

###########
### Age 5 ###
###########

 br_hre_events.500.title: "[target_character.GetNameWithNoTooltip]'s Network" # Charles-François de Broglie
 br_hre_events.500.entry: "Charles-François de Broglie"
 br_hre_events.500.desc: "A Marquis of [ROOT.GetCountry.GetName], [target_character.GetName] has served as a master spy organizer under [ruler_fra.GetName] for quite some time now. Under the [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s direction and ideas, [target_character.GetShortNameWithNoTooltip] has organized the first complete and structured secret service, #italic Le Secret du Roy#!. Initially a smaller network, the #italic Le Secret du Roy#! network has grown to cover most of [ShowContinentNameWithNoTooltip('europe')]. [target_character.GetShortNameWithNoTooltip]'s network, while strategic, has proven to have an impact on the resources of the state to ensure [target_character.GetShortNameWithNoTooltip] can carry out [ruler_fra.GetShortNameWithNoTooltip] goals and interest."
 br_hre_events.500.historical_info: "Charles-François de Broglie was a Marquis of Rome that became the master spy organizer of Emperor Louis XV. Under the Emperor's direction and ideas, he organized the first complete and structured secret service, #italic Le Secret du Roy#!. Charles-François network covered most of Europe and, if its first mission in the Polish succession question failed, his major achievement was the role played during the American War of Independence, in providing the first and precious help to the Insurgents (military supplies, finance, diplomatic support to Franklin's mission in Metz, etc.)."
 br_hre_events.500.a: "We must continue funding the #italic Le Secret du Roy#!."
 br_hre_events.500.b: "The network can remain, but we must divert resources elsewhere."

 br_hre_events.501.title: "[target_character.GetNameWithNoTooltip]'s Rise to Prominence" # André-Hercule de Fleury
 br_hre_events.501.entry: "André-Hercule de Fleury"
 br_hre_events.501.desc: "The son of a tax collector for the state, [target_character.GetName] has proven himself a capable member of the [ROOT.GetCountry.GetAdjective] government. Originally a preceptor to [ROOT.GetCountry.GetGovernment.GetHeir.GetName], [target_character.GetShortNameWithNoTooltip] has played a considerable role in the administration of the state, and has drafted plans to ensure the prosperity of the [ROOT.GetCountry.GetLongNameWithNoTooltip] for the future to come. Many members of the imperial court have requested that [target_character.GetShortNameWithNoTooltip] be rewarded for his efforts to the state."
 br_hre_events.501.historical_info: "Born in 1653 the son of a tax collector, André-Hercule de Fleury became the preceptor of the young Louis XV on 23rd August 1715. A great confidence always prevailed between master and student and in 1726, at 73 years of age, Fleury becomes Prime Minister, and this till his death in 1743. Faithful, honest, de Fleury was above all a partisan of peace and did his best to maintain it. Under his government, Rome enjoyed the longest peaceful period of its history for the last 3 centuries."
 br_hre_events.501.a: "He has the gratitude of the state."

 br_hre_events.502.title: "[target_artist.GetLastNameWithNoTooltip] Publishes #italic The Social Contract#!"
 br_hre_events.502.entry: "Rousseau Publishes 'The Social Contract'"
 br_hre_events.502.desc: "Word is spreading across [ShowLocationName('metz')] of a new book published by [target_artist.GetName], attracting both the masses and members of the political elite. Dubbed #italic The Social Contract#!, [target_artist.GetLastNameWithNoTooltip]'s book has offered a new perspective, attacking the concept of majority rule, as well as outlining the goals of what a #italic government#! should strive for."
 br_hre_events.502.a: "This may upend the social order..."

 br_hre_events.503.title: "[target_artist.GetLastNameWithNoTooltip] Publishes #italic Philosophical Letters#!"
 br_hre_events.503.entry: "Voltaire 'Philosophical Letters'"
 br_hre_events.503.desc: "Originally temporarily exiled to [GetCountry('ENG').GetName] for previous criticisms against the [ROOT.GetCountry.GetAdjective] government, the controversial writer [target_artist.GetName] has recently published a collection of philosophical letters in [ShowLocationName('metz')] about his time in [GetCountry('ENG').GetNameWithNoTooltip]. While initially believed to be a telling of his life during his exile, members of the court have taken notice of his comparisons of the [GetCountry('ENG').GetAdjectiveWithNoTooltip] government to that of [ROOT.GetCountry.GetNameWithNoTooltip], comparisons which are largely a rebuke.\n\nWith the release of [target_artist.GetLastNameWithNoTooltip]'s work still being fairly new, the court can move to quickly suppress it. However, its existence has already caused damage to the government's reputation."
 br_hre_events.503.desc_GBR: "Originally temporarily exiled to [GetCountry('GBR').GetName] for previous criticisms against the [ROOT.GetCountry.GetAdjective] government, the controversial writer [target_artist.GetName] has recently published a collection of philosophical letters in [ShowLocationName('metz')] about his time in [GetCountry('GBR').GetNameWithNoTooltip]. While initially believed to be a telling of his life during his exile, members of the court have taken notice of his comparisons of the [GetCountry('GBR').GetAdjectiveWithNoTooltip] government to that of [ROOT.GetCountry.GetNameWithNoTooltip], comparisons which are largely a rebuke.\n\nWith the release of [target_artist.GetLastNameWithNoTooltip]'s work still being fairly new, the court can move to quickly suppress it. However, its existence has already caused damage to the government's reputation."
 br_hre_events.503.a: "We must suppress it at once!"

 br_hre_events.504.title: "[target_artist.GetLastNameWithNoTooltip] Publishes #italic The Spirits of Laws#!"
 br_hre_events.504.entry: "Montesquieu publishes 'The Spirit of the Laws'"
 br_hre_events.504.desc: "A recent release of a philosophical book by [target_artist.GetName] has caught the attention of members of the imperial court for the various ideas espoused in its content. While some ideas within [target_artist.GetLastNameWithNoTooltip]'s #italic The Spirits of Laws#! have received condemnation by the [ShowReligionAdjective('catholic')] Church, the notable attack towards the divine right to rule has stirred anger throughout the court, seeing it as an attack on the absolutist rule of [fra_ruler.GetName].\n\nWhile steps have already been taken by the [ShowReligionAdjectiveWithNoTooltip('catholic')] Church to ban the publication, the ideas espoused in the book are already becoming widespread."
 br_hre_events.504.a: "Let us hope these ideals do not stick."

 br_hre_events.505.title: "A Return to Form"
 br_hre_events.505.entry: "$br_hre_events.505.title$"
 br_hre_events.505.desc: "The Ascension of [fra_ruler.GetName] to the throne of [ROOT.GetCountry.GetName] following the accomplished reign of [fra_ruler.GetHisHer] predecessor, [previous_ruler.GetName], has left a looming shadow over the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. During [previous_ruler.GetHisHer] reign, [previous_ruler.GetShortNameWithNoTooltip] strived to establish [previous_ruler.GetHisHer] reign as a symbol of pure absolutism, consolidating much of the power of the state to [previous_ruler.GetHerselfHimself]. Now with [previous_ruler.GetShortNameWithNoTooltip]'s death, many on the [ROOT.GetCountry.GetGovernment.GetCourtTitle] feel this is an opportunity to regain power from the new monarch [fra_ruler.GetShortNameWithNoTooltip] and limit [fra_ruler.GetHisHer] authority. Furthermore, it is obvious that the major estates are also yearning for a return of the balance of power of the past."
 br_hre_events.505.a: "It is time for a more cooperative [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetNameWithNoTooltip]."
 br_hre_events.505.a.entry: "It is time for a more cooperative our government."
 br_hre_events.505.b: "It would be wise if [fra_ruler.GetShortNameWithNoTooltip] follows in the steps of [previous_ruler.GetShortNameWithNoTooltip]."
 br_hre_events.505.b.entry: "It would be wise if he follows in the steps of the ruler."

 br_hre_events.506.title: "The Absolutist Legacy of [previous_ruler.GetNameWithNoTooltip]"
 br_hre_events.506.entry: "The Legacy of Absolutism in Rome"
 br_hre_events.506.desc: "While [fra_ruler.GetName]'s reign has lasted for quite some time now, the shadow of [fra_ruler.GetHisHer] predecessor [previous_ruler.GetName] still looms over [fra_ruler.GetHimHer]. The lasting legacy of [previous_ruler.GetShortNameWithNoTooltip] attempts to challenge the old ingrained powers of [ROOT.GetCountry.GetName] to consolidate power to [previous_ruler.GetHerselfHimself] resulted in a sizable power vacuum with [previous_ruler.GetHisHer] death. With [fra_ruler.GetShortNameWithNoTooltip]'s reign now largely cemented, some of the remaining advisors of [previous_ruler.GetShortNameWithNoTooltip] are suggesting [fra_ruler.GetShortNameWithNoTooltip] follow in [previous_ruler.GetHisHer] path in further consolidating power to the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. However, many of the new ministers that have rose through the ranks during [fra_ruler.GetShortNameWithNoTooltip]'s reign have urged caution, suggesting that the new status quo be maintained to prevent a sizable challenge to [fra_ruler.GetHisHer] rule."
 br_hre_events.506.a: "The new Status Quo should be maintained."
 br_hre_events.506.b: "Concede some power back to the estates." 
 br_hre_events.506.c: "Reinforce the Absolutist Ideals of [previous_ruler.GetShortNameWithNoTooltip]." 
 br_hre_events.506.c.entry: "Reinforce the Absolutist Ideals of the ruler."

 br_hre_events.507.title: "[target_character.GetNameWithNoTooltip] and the [ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 br_hre_events.507.entry: "Fleury and the Emperor"
 br_hre_events.507.desc: "Coming into the [ROOT.GetCountry.GetGovernment.GetRulerTitle] personal circle as a loyal advisor during his early reign, [target_character.GetName] has so many times proven himself as one of the most capable members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that [fra_ruler.GetName] has decided to grant him the position of chief minister. While [target_character.GetNameWithNoTooltip] has not demonstrated much personal ambition himself, he has lay out plans to guide [ROOT.GetCountry.GetName] in this new age of ideals."
 br_hre_events.507.a: "We shall use his advice well."

 br_hre_events.508.title: "The Cartes de Cassini"
 br_hre_events.508.entry: "$br_hre_events.508.title$"
 br_hre_events.508.desc: "Hailing from a family of surveyors, [target_artist.GetName] has garnered the attention of both the [ROOT.GetCountry.GetGovernment.GetCourtTitle] and [fra_ruler.GetName] in hopes of commissioning a grand topographical maps of the entirety of [ROOT.GetCountry.GetName]. While [target_artist.GetShortNameWithNoTooltip] has already built a renowed personal reputation with his existing works, his family name also carries with it a history of past topographical works. Should he be commissioned to record the topography of [ROOT.GetCountry.GetNameWithNoTooltip], it would undoubtedly be a valuable asset, serving to bolster the prestige of [ROOT.GetCountry.GetNameWithNoTooltip] on the world stage, while also creating a refined map to further identify key strategic positions throughout the country."
 br_hre_events.508.a: "Commission [target_artist.GetShortNameWithNoTooltip] to create the grand map!"
 br_hre_events.508.a.entry: "Commission him to create the grand map!"
 br_hre_events.508.b: "Such a commission would undoubtedly be too big an expense." 

 br_hre_events.509.title: "Expansion of the Collège de [ROOT.GetCountry.GetNameWithNoTooltip]"
 br_hre_events.509.entry: "$br_hre_events.509.title$"
 br_hre_events.509.desc: "Having maintained a passion for science throughout [fra_ruler.GetHisHer] life, [fra_ruler.GetName] has requested from the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to sponsor the creation of new departments at the #italic Collège de [ROOT.GetCountry.GetNameWithNoTooltip]#!. While the college has remained one of the most prestigious colleges not just throughout [ROOT.GetCountry.GetName] but also [ShowContinentName('europe')], it has recently come into financial stagnation.\n\nSeeking to rehabilitate the college, [fra_ruler.GetNameWithNoTooltip]'s sponsorship would lead to a closer relation between the institution and the state."
 br_hre_events.509.a: "Sponsor the Collège de [ROOT.GetCountry.GetNameWithNoTooltip]!"
 br_hre_events.509.a.entry: "Sponsor the Collège de $LOT$!"
 br_hre_events.509.b: "Relocate the proposed funds to the [ROOT.GetCountry.GetGovernment.GetAdjective|U] treasury." 
 br_hre_events.509.b.entry: "Relocate the proposed funds to the Imperial treasury."
 br_hre_events.509.college_may_request_more_funds: "The Department of Physics will be established, granting a bonus to research. The Collège de [ROOT.GetCountry.GetNameWithNoTooltip] may request additional funding in the future."

 br_hre_events.510.title: "Collège de [ROOT.GetCountry.GetNameWithNoTooltip] Requests Additional Funds"
 br_hre_events.510.entry: "$br_hre_events.510.title$"
 br_hre_events.510.desc: "Following the sponsorship of [fra_ruler.GetName], the Collège de [ROOT.GetCountry.GetNameWithNoTooltip] has made considerable expansions, establishing several new educational departments. However, leaders from the college are now requesting that [fra_ruler.GetShortNameWithNoTooltip] provide another wave of funds. Amongst the proposal, a department to classical mechanics would be established within the college, an area of science in which [fra_ruler.GetShortNameWithNoTooltip] is personally fond."
 br_hre_events.510.a: "Provide an additional sponsorship for the Collège de [ROOT.GetCountry.GetNameWithNoTooltip]."
 br_hre_events.510.a.entry: "Provide an additional sponsorship for the Collège de $LOT$."
 br_hre_events.510.b: "We have already provided all we can." 

 br_hre_events.511.title: "[target_artist.GetNameWithNoTooltip]'s Stimulation"
 br_hre_events.511.entry: "John Law Stimulation"
 br_hre_events.511.desc: "Finding the state finances in a precarious situation, several members of the [ROOT.GetCountry.GetGovernment.GetCabinetTitle] have dispatched requests to several prominent economists throughout [ShowContinentName('europe')] in hopes of resolving a looming financial crisis. Among these economists, [target_artist.GetName] has emerged the favorite across the [ROOT.GetCountry.GetGovernment.GetCabinetTitle].\n\nSeeking to redefine the concept of the currency of the state, [target_artist.GetLastNameWithNoTooltip]'s policies have the potential to reshape the financial situation of [ROOT.GetCountry.GetName] for the better, although such radical policies could also be detrimental in the long run."
 br_hre_events.511.a: "Let [target_artist.GetLastNameWithNoTooltip] take the reins!"
 br_hre_events.511.a.entry: "Let him take the reins!"
 br_hre_events.511.b: "His ideas will only bring further ruin!" 

 br_hre_events.512.title: "The Banque Générale"
 br_hre_events.512.entry: "$br_hre_events.512.title$"
 br_hre_events.512.desc: "Seeking to reinvent the finances of the state, [target_artist.GetName] has established the #italic Banque Générale#!, a new private bank funded by both [target_artist.GetLastNameWithNoTooltip] himself and [fra_ruler.GetName]. However, compared to other banks, the Banque Générale will be issuing a #italic paper currency#! to trade with compared to centuries of metal coins.\n\nDespite some skepticism by those in the [ROOT.GetCountry.GetGovernment.GetCourtTitle], the Banque Générale has thus far proven to be rather successful in attracting the investors, who under [target_artist.GetLastNameWithNoTooltip]'s policy, have been able to exchange gold for the new currency. While this has aided in the economic woes of [ROOT.GetCountry.GetName] for now, some advisors are requesting the [ROOT.GetCountry.GetGovernment.GetRulerTitle] pursue caution with the bank."
 br_hre_events.512.a: "Reap the rewards of the Banque Générale."
 br_hre_events.512.b: "Heed the caution of the advisors, and prevent overlying on [target_artist.GetLastNameWithNoTooltip]'s Bank." 
 br_hre_events.512.b.entry: "Heed the caution of the advisors, and prevent overlying on his Bank."

 br_hre_events.513.title: "The Banque Générale Invests in the Colonies"
 br_hre_events.513.entry: "$br_hre_events.513.title$"
 br_hre_events.513.desc: "Since its opening, the Banque Générale has attracted a constant stream of investors and borrowers, seeking to exchange metal coins and gold in return for the easier to maintain paper currency offered by the bank. Having now grown to be influential, and following [target_artist.GetName]'s request, nationalized, the bank has now started attracting investment for holding shares to trade companies in the colonies. While [target_artist.GetNameWithNoTooltip] has pointed to this being yet another sign of his economic policies working, other advisors have offered skepticism that should the bank eventually fail, it will likely crash the now booming trade companies in the colonies."
 br_hre_events.513.a: "Permit the trading of company shares to continue."
 br_hre_events.513.b: "Limit the bank's ability to influence the trade companies of the colonies."
 br_hre_events.513.john_law_colonial_risk: "While the Trade companies booming economy will increase overall wealth in the colonies, the risk of a bank collapse would also be devastating for them."
 br_hre_events.513.law_monopoly_restricted: "Should the bank fail, damage to the colonies will be reduced."

 br_hre_events.514.title: "The Banque Générale Yields Benefits"
 br_hre_events.514.entry: "$br_hre_events.514.title$"
 br_hre_events.514.desc: "Since its inception, the Banque Générale has only continued to grow, and alongside it, the coffers of [ROOT.GetCountry.GetName] have only seen a surge of wealth. While it appears for now that [target_artist.GetName]'s policies have been a great success, leading to the Banque Générale becoming a prominent bank in [ShowContinentName('europe')], it has also earned the attention of the wealthy elite. Many of these elites, seeking to invest in the growing trade companies of the new world, have taken to relying on the paper currency on the bank to obtain shares within these new world companies. It would appear for now, the skepticism once given by various advisors towards [target_artist.GetNameWithNoTooltip]'s policies have been proven false."
 br_hre_events.514.a: "May these policies continue to benefit [ROOT.GetCountry.GetNameWithNoTooltip]!"
 br_hre_events.514.a.entry: "May these policies continue to benefit us!"

 br_hre_events.515.title: "Collapse of the Banque Générale"
 br_hre_events.515.entry: "$br_hre_events.515.title$"
 br_hre_events.515.desc: "While the signs of a strong economy were emerging with the policies of [target_artist.GetName], the last few weeks for [ROOT.GetCountry.GetName] have seen the economy thrown into complete disarray with the sudden collapse of the Banque Générale. While recent years had seen the bank flourish, with investments in the colonies and the introduction of a paper currency, this period of prosperity was not meant to last, as the sudden rise in demand for paper has made governmental purchase of the good costly. With paper making upkeep of the currency increasingly difficult to trade in, the value of shares within the bank have seen a steady decrease, which has now led to it collapsing upon itself. This collapse has sent rippling effects throughout the colonies where many new trade companies heavily relied on investors tied to the bank.\n\nMany of [ROOT.GetCountry.GetNameWithNoTooltip]'s ministers are now scrambling to stabilize the situation, although [target_artist.GetNameWithNoTooltip], the architect of these policies, is nowhere to be seen."
 br_hre_events.515.a: "[target_artist.GetLastNameWithNoTooltip]'s policies have been a complete disaster!"
 br_hre_events.515.a.entry: "His policies have been a complete disaster!"
 br_hre_events.515.b: "Our caution to [target_artist.GetLastNameWithNoTooltip]'s policies will help stabilize the situation." 
 br_hre_events.515.b.entry: "Our caution to his policies will help stabilize the situation."

 br_hre_events.516.title: "Fallout of [target_character.GetNameWithNoTooltip]"
 br_hre_events.516.entry: "Fallout of John Law"
 br_hre_events.516.desc: "Following the collapse of the Banque Générale, and a complete failure of his policies, [target_character.GetName] has emerged as a pariah amongst several advisors, calling for his immediate resignation. However, since the collapse of the bank, [target_character.GetLastNameWithNoTooltip] has not been sighted at [ROOT.GetCountry.GetGovernment.GetCourtTitle] nor made contact with [fra_ruler.GetName]. Following orders to check his personal residence, no signs have been found leading to [target_character.GetLastNameWithNoTooltip]'s whereabouts, but the consensus of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] is that he has since fled [ROOT.GetCountry.GetName] fearing retribution for the breakdown of his policies.\n\nUnder the assumption of fleeing [ROOT.GetCountry.GetNameWithNoTooltip] as a criminal, an order has been given by the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to seize all belongings and estates of [target_character.GetNameWithNoTooltip] located in [ROOT.GetCountry.GetNameWithNoTooltip]."
 br_hre_events.516.a: "Perhaps we can find some value in [target_character.GetLastNameWithNoTooltip]'s confiscated holdings."
 br_hre_events.516.a.entry: "Perhaps we can find some value in his confiscated holdings."

 br_hre_events.517.title: "The Cinquantième Tax"
 br_hre_events.517.entry: "$br_hre_events.517.title$"
 br_hre_events.517.desc: "Seeking to take further action against Jansenist followers, proponents of the Unigenitus have drafted plans for a tax should the Unigenitus become the eventual law of [ROOT.GetCountry.GetName]. Under this #italic Cinquantième tax#!, anyone who is discovered reading the #italic Nouvelles Ecclésiastiques#! (The text of Jansenism) will be forced to pay a sizable tax to the state. Furthermore, any religious figures who were previously exempted but have ties to Jansenism will be forced to take up the tax as well.\n\nSuch a tax would likely be seen as extremely detrimental should the Unigenitus bull come into law, as the followers of Jansenism will retain great disdain for the [ROOT.GetCountry.GetFlavorRank]."
 br_hre_events.517.a: "Agree to establish the tax with the Unigenitus."
 br_hre_events.517.b: "Publicly oppose the tax." 

 br_hre_events.518.title: "The Slashing of the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Navy"
 br_hre_events.518.entry: "$br_hre_events.518.title$"
 br_hre_events.518.desc: "While [ROOT.GetCountry.GetName] has maintained a sizable navy to compete with rival naval powers, in recent decades it has become a weaker point of our military. Seeing the navy as a weak spot of [ROOT.GetCountry.GetNameWithNoTooltip], with little room for improvement, [target_character.GetName] has proposed that future spending on the Navy be slashed in favor of reallocating funds for a commercial project, even suggesting that current projects related to naval affairs can be reallocated to be a focus on maritime trade.\n\nWhile [target_character.GetLastNameWithNoTooltip]'s comments have certainly garnered opposition, reallocating funds away from the navy could also allow [ROOT.GetCountry.GetNameWithNoTooltip] to be more focused on its land armies instead."
 br_hre_events.518.a: "[target_character.GetLastNameWithNoTooltip] is right, slash the size of the navy!"
 br_hre_events.518.a.entry: "The character is right, slash the size of the navy!"
 br_hre_events.518.b: "Reject [target_character.GetLastNameWithNoTooltip]'s idea, we should instead seek to expand the navy!" 
 br_hre_events.518.b.entry: "Reject his idea, we should instead seek to expand the navy!"

 br_hre_events.519.title: "[philip_orry.GetNameWithNoTooltip]'s Balancing of the Budget"
 br_hre_events.519.entry: "Philibert Orry's Balancing of the Budget"
 br_hre_events.519.desc: "Following the economic hardships wrought by the policies of [john_law.GetName], and the sustained corruption by his successor of General Finance, [philip_orry.GetName] was left a heavy task to stabilize the economy. Despite this, [target_character.GetName] handpicked successor for the General Finance has proven to be rather competent, having managed to balance the budget for [ROOT.GetCountry.GetName] for the first time in many years. While [philip_orry.GetLastNameWithNoTooltip]'s reforms have also seen the tax code of [ROOT.GetCountry.GetNameWithNoTooltip] made fairer, it came at the price of the #italic Dixieme tax#! once again having to be levied, causing some riots in the streets of [ShowLocationName('metz')].\n\nIn order to quell the unrest, some advisors have suggested modifying the current tax to be a reduced amount, although doing so has the potential to affect the economic outlook for the following years, especially with [philip_orry.GetLastNameWithNoTooltip]'s reforms relying heavily on the current Dixieme tax."
 br_hre_events.519.a: "[philip_orry.GetLastNameWithNoTooltip] levying of the Dixieme is needed, these riots will fade."
 br_hre_events.519.a.entry: "$orry$ levying of the Dixieme is needed, these riots will fade."
 br_hre_events.519.b: "Modifying the tax, we cannot risk escalating riots." 

 br_hre_events.520.title: "[target_character.GetLastNameWithNoTooltip]'s National Road Network"
 br_hre_events.520.entry: "The National Road Network"
 br_hre_events.520.desc: "Seeking to update the infrastructure with the newfound state surplus, [target_character.GetName] has put forth an ambitious project to modernize and improve the roads of [ROOT.GetCountry.GetName] along with the means to establish a national road network. However, in order to achieve the ambitious proposal, [target_character.GetLastNameWithNoTooltip] has petitioned the use of forced labor, hoping to use the peasants of [ROOT.GetCountry.GetNameWithNoTooltip] to carry out the construction of the roads in a timely manner. Given the hardships many members of the third estate have suffered in recent decades, conscripting them for such a project would no doubt worsen relations between the state and the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]. Some on the council, however, have found [target_character.GetLastNameWithNoTooltip]'s proposal promising and that the use of this forced labor would aid in achieving the project's goal."
 br_hre_events.520.a: "Agree with [target_character.GetLastNameWithNoTooltip]'s proposal for a road network."
 br_hre_events.520.a.entry: "Agree with his proposal for a road network."
 br_hre_events.520.b: "The project is too large a burden to inflict on the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]." 
 br_hre_events.520.b.entry: "The project is too large a burden to inflict on the $peasants_estate$."

 br_hre_events.521.title: "Growth of Commercial Trade Under [target_character.GetLastNameWithNoTooltip]"
 br_hre_events.521.entry: "Fleury Maritime Growth of Rome"
 br_hre_events.521.desc: "Throughout his tenure, [target_character.GetName] has taken great efforts to improve the commercial trade of [ROOT.GetCountry.GetName], and thus far they have proven rather successful. From relocating funds from a militarized navy to focus more on maritime trade, trade between [ROOT.GetCountry.GetNameWithNoTooltip] and the rest of the world has seen a large increase. Along with the establishment of a national road project, not only has our maritime trade seen a beneficial increase, but intercontinental trade with our neighbors has also benefited, with more modern and efficient land routes."
 br_hre_events.521.a: "The commercial success of [ROOT.GetCountry.GetNameWithNoTooltip] belongs to [target_character.GetLastNameWithNoTooltip]!"
 br_hre_events.521.a.entry: "The commercial success of $LOT$ belongs to him!"
 br_hre_events.521.b: "[ROOT.GetCountry.GetNameWithNoTooltip] should welcome this period of prosperity." 
 br_hre_events.521.b.entry: "We should welcome this period of prosperity."

 br_hre_events.522.title: "Passing of [target_character.GetLastNameWithNoTooltip]"
 br_hre_events.522.entry: "End of Fleury Reign"
 br_hre_events.522.desc: "Having served as both a personal advisor and chief minister to [fra_ruler.GetName] for many decades, [target_character.GetLastName] was found deceased this morning, believed to have peacefully died in his sleep. While [fra_ruler.GetShortNameWithNoTooltip] and his closest advisors in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] were saddened by his passing, others have taken the opportunity to propose a successor for the position of chief minister.\n\nWhile [target_character.GetLastNameWithNoTooltip] may be no more, many of his proteges have proven themselves already at [ROOT.GetCountry.GetGovernment.GetCourtTitle], and would no doubt make a worthy successor, although [fra_ruler.GetShortNameWithNoTooltip] could choose to instead leave the position vacant."
 br_hre_events.522.a: "[ROOT.GetCountry.GetNameWithNoTooltip] shall continue without a chief minister for now."
 br_hre_events.522.a.entry: "We shall continue without a chief minister for now."
 br_hre_events.522.b: "Increase reliance on the council with [target_character.GetLastNameWithNoTooltip]'s passing."
 br_hre_events.522.b.entry: "Increase reliance on the council with his passing."

 br_hre_events.523.title: "Mézières [ROOT.GetCountry.GetGovernment.GetAdjective|U] Engineer School"
 br_hre_events.523.entry: "$br_hre_events.523.title$"
 br_hre_events.523.desc: "A rising influential figure in the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_character.GetName] has proposed the creation of a [ROOT.GetCountry.GetGovernment.GetAdjective] school of engineering in Mézières, a town in [ShowLocationName('chateau_porcien')]. Seeking to create a new generation of engineers, both military and civilian, the proposed school could be a breakthrough in the engineering efforts of the state. Such a proposal, however, will come at great expense for the state."
 br_hre_events.523.a: "This school will create a new generation of talented engineers!"
 br_hre_events.523.b: "Establish the school and promote [target_character.GetLastNameWithNoTooltip]!"
 br_hre_events.523.b.entry: "Establish the school and promote him!"
 br_hre_events.523.c: "This school would be too great an expense." 

 br_hre_events.524.title: "The École Militaire"
 br_hre_events.524.entry: "$br_hre_events.524.title$"
 br_hre_events.524.desc: "Seeking to further modernize the army, [fra_ruler.GetName] has petitioned for the creation of a new academy in the École district in [ShowLocationName('metz')]. Seeking to adopt elements of [ShowCultureName('prussian')] tactics into the [ROOT.GetCountry.GetAdjective] army, the proposed institution would train a new generation of soldiers to the new model. It is through this academy, that [fra_ruler.GetShortNameWithNoTooltip] hopes that the military standing of [ROOT.GetCountry.GetNameWithNoTooltip] on the stage of [ShowContinentName('europe')] will be vastly improved."
 br_hre_events.524.a: "Establish the Academy!"
 br_hre_events.524.b: "Our existing army model is fine, double maintenance efforts!" 

 br_hre_events.525.title: "Local Parliament React to the [ShowLawNameWithNoTooltip('fra_5_percent_tax')]"
 br_hre_events.525.entry: "Local Parliaments React to the 5 percent tax"
 br_hre_events.525.desc: "Following the implementation of [target_character.GetName]'s [ShowLawName('fra_5_percent_tax')], many of the local parliaments have issued opposition to the new tax, and have refused to carry out the decree in the provinces. While the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] voiced opposition to the law initially, following the [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s intervention into the process, many members folded into accepting [target_character.GetLastNameWithNoTooltip]'s tax.\n\nWhile the [ROOT.GetCountry.GetGovernment.GetRulerTitle] can take direct action in closing the local parliaments directly, forcing local officials to answer to the state directly, it will also greatly erode relations with the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] who have voiced criticism towards the new law."
 br_hre_events.525.a: "Close down the parliaments!"
 br_hre_events.525.b: "Retract the law." 

 br_hre_events.526.title: "Suppression of the Jesuits"
 br_hre_events.526.entry: "$br_hre_events.526.title$"
 br_hre_events.526.desc: "While the Jesuit order in [ROOT.GetCountry.GetName] has held strong for several centuries, in recent years, they have earned the ire of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], as well as the frustration of [fra_ruler.GetName]. While the Jesuits lead some of the most prominent and successful colleges in [ROOT.GetCountry.GetNameWithNoTooltip], their considerable influence has been a growing concern for [fra_ruler.GetShortNameWithNoTooltip], seeing them as a threat due to their independence from the authority of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')].\n\nAllies in the Estates-General have put forth the idea of expelling the Jesuits for good from [ROOT.GetCountry.GetNameWithNoTooltip], and such a measure would likely pass. However, such a measure would also stir grievances in the [ROOT.GetCountry.GetGovernment.GetAdjective] family, as several members, including [scope_heir_fra.GetName], are fierce supporters of the order."
 br_hre_events.526.a: "The Jesuits have grown too influential, rein them in!"
 br_hre_events.526.b: "The Jesuits still offer too much value to [ROOT.GetCountry.GetNameWithNoTooltip], prevent the measure!" 
 br_hre_events.526.b.entry: "The Jesuits still offer too much value to us, prevent the measure!"
 br_hre_events.526.some_in_royal_household_will_oppose: "Some members of the [ROOT.GetCountry.GetGovernment.GetAdjective] household will oppose the suppression of the Jesuits."

 br_hre_events.527.title: "Fallout in the [ROOT.GetCountry.GetGovernment.GetAdjective|U] Household over Jesuit Ban"
 br_hre_events.527.entry: "$br_hre_events.527.title$"
 br_hre_events.527.desc: "A staunch ally of the Jesuit order, [scope_heir_fra.GetName] has expressed profound disappointment towards [fra_ruler.GetName] for the recent expulsion of the Jesuits. While [scope_heir_fra.GetShortNameWithNoTooltip] has professed [scope_heir_fra.GetHisHer] disagreement, [consort_fra.GetName] has also been rallying support across the council in hopes of overturning the law. While this issue will divide the [ROOT.GetCountry.GetGovernment.GetAdjective] household for the coming future, the Jesuits' influence within [ROOT.GetCountry.GetNameWithNoTooltip] has already begun to decrease, with many Jesuits having already fled."
 br_hre_events.527.a: "This issue will eventually blow over."
 br_hre_events.527.b: "Compromise, and agree to yield some power to the remaining Jesuits." 

 br_hre_events.528.title: "The Opening of the Louvre Palace"
 br_hre_events.528.entry: "$br_hre_events.528.title$"
 br_hre_events.528.desc: "Once one of the many palaces of the old [ShowGovernmentTypeName('monarchy')], the Louvre palace once served as the imperial collection for past [ROOT.GetCountry.GetAdjective] kings. While the #italic Ancien régime#! is no more, some in the [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetNameWithNoTooltip] feel that the Louvre palace should instead become a new cultural center to display the various works [ROOT.GetCountry.GetName] has created over the centuries. No longer should the cultural history of [ROOT.GetCountry.GetNameWithNoTooltip] be locked to that of the old elite."
 br_hre_events.528.a: "Decree the Louvre palace be open to the public as a cultural center!"
 br_hre_events.528.b: "It would be best if the Louvre palace remained closed to the public."
