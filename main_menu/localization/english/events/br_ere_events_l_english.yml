 br_ere_events.1.title: "The Empire in Peril"
 br_ere_events.1.entry: "$br_ere_events.1.title$"
 br_ere_events.1.desc: "Once the [GetCountry('BYZ').GetFlavorRank] stood unrivaled. From the mountains of Armenia to the shores of the Adriatic, all trembled before the majesty of the Roman Empire. Those days are now but a fading memory.\n\nThe Empire has fractured under the weight of corruption, ambition, and neglect. Across the provinces, the [ShowSubjectTypeName('br_thema_subject')] no longer heed the commands of [ShowLocationName('constantinople')]. [ShowSpecialStatusName('defiant_strategoi')] and [ShowEstatePrivilegeName('br_dynatoi_magnates')] rule their lands as petty lords, while the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and [ShowPolicyName('pronoia_system')] holders enrich themselves as imperial authority fades beyond the [ShowBuildingTypeName('theodosian_walls')].\n\nEven now, the Basileus grows weak and infirm. Physicians whisper that his days are numbered, and that the purple will soon pass to a child whose talents are... uncertain. When the Emperor dies, rival claimants and ambitious generals will surely descend upon the throne.\n\nYet the Roman Empire has endured darker trials than these. If the rebellious provinces can be brought again beneath the imperial eagle, if the authority of the throne is restored and the themes returned to obedience, then the Empire may yet rise again. The dream of a united [GetUniqueInternationalOrganization('roman_world').GetName] has not yet died."
 br_ere_events.1.a: "The Empire Shall Rise Again"
 br_ere_events.1.att: "The Basileía stands on the brink. Only a handful of Strategoi remain loyal, while factions within the Empire prepare to rise in open revolt."

 br_indikes_events.1.title: "The Founding of the Hetaireía Indikēs"
 br_indikes_events.1.desc: "With imperial sanction and merchant capital, plans long discussed in the halls of power are set into motion. The Hetaireía Indikēs is proclaimed, a chartered association charged with opening and securing the sea routes to the riches of the East. From select ports, ships are fitted out and crews assembled, bound for distant markets where Roman banners have rarely flown. Trade, profit, and influence now sail together into the Indian Ocean."
 br_indikes_events.1.a: "Let the fleets be launched"

 br_indikes_events.2.title: "Subjugation of Hetaireía Indikēs"
 br_indikes_events.2.desc: "With control of the Suez, the opportunity arises to assert dominance over the traders of Hetaireía Indikēs. This move could expand influence and secure crucial trade routes in the East."
 br_indikes_events.2.a: "Subjugate Hetaireía Indikēs and make it a trade company subject."
 br_indikes_events.2.b: "Leave Hetaireía Indikēs independent for now."

 br_country_startup.1.title: "A Fleet Takes Shape"
 br_country_startup.1.desc: "With authority secured and the harbors prepared, the foundations of the realm’s naval strength are laid. Ships are commissioned at the capital, crews gathered from the coast, and banners raised above newly launched hulls. Though modest in number, this fleet marks the beginning of our presence upon the seas and the promise of power yet to come."
 br_country_startup.1.a: "To the oars and sails"

 br_ere_succession_crisis.1.title: "The Question of Succession"
 br_ere_succession_crisis.1.desc: "The death of the Emperor has cast a long shadow over the Empire. With no undisputed heir to command universal loyalty, the great houses whisper, governors hesitate, and oaths once sworn grow uncertain. From the capital to the provinces, power is weighed anew, and those who sense weakness move quickly to secure their own advantage. The unity of the [GetUniqueInternationalOrganization('roman_world').GetName] now hangs upon the resolution of the succession."
 br_ere_succession_crisis.1.a: "The bonds of loyalty are tested"

 br_country_startup.2.title: "Raising the Host"
 br_country_startup.2.desc: "With sovereignty secured, the foundations of military power must be laid at once. Infantry are mustered from loyal households, cavalry assembled from trusted retainers, and auxiliary forces organized to support the core host. Though modest in size, this army represents the first assertion of authority and the promise of defense in the years ahead."
 br_country_startup.2.a: "The banners are raised."

 br_ere_events.3.title: "The Reordering of the Themes"
 br_ere_events.3.desc: "Now that the authority of [ShowLocationName('constantinople')] has been restored—if only in form—the ordering of the provinces must be set aright.\n\nThroughout the Empire, the themes lie divided among strategoi, pronoia holders, and grasping [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], each clinging to his privileges and jealous of imperial command. Such disorder weakens the Roman state, yet it has long served to deny any one man the power to rival the throne.\n\nIn the Sacred Palace, counsel is divided. Some urge that the provinces be brought once more into proper obedience, their holders reduced and bound directly to the will of the Basileus, that the ancient order of the Empire might be restored. Others speak for a sterner remedy: that the lands be gathered into great commands and entrusted to men of strength, capable of defending the realm in these perilous times—though such men may in time forget their place.\n\nThus must the Basileus decide: shall the Empire be governed by many who are weak, or a few who are strong?"

 br_ere_events.3.a: "Bind them to the Purple."
 #br_ere_events.3.att: "All loyal themes and pronoia will be reduced to direct vassals of the Basileus."

 br_ere_events.3.b: "Entrust Them to the Great Houses."
 #br_ere_events.3.btt: "The Empire will be reorganized into powerful regional commands under a few great governors."

 br_ere_events.3.att: "All Greek themata and pronoia in the Balkans and Anatolia will become direct vassals of the Basileus."
 br_ere_events.3.btt: "The Empire will be reorganized into a few large regional vassals. Several minor states will be annexed into stronger governors, who will become vassals or marches."

 br_ere_events.5.title: "The Death of [GetCharacter('byz_andronikos_iii_palaiologos').GetName]"
 br_ere_events.5.entry: "$br_ere_events.5.title$"
 br_ere_events.5.desc: "With the passing of [GetCharacter('byz_andronikos_iii_palaiologos').GetName], the [ROOT.GetCountry.GetFlavorRank] is cast into mourning. Though his reign was scarred by civil discord, courtly intrigue, and the gradual waning of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] $roman_authority$ throughout the [GetUniqueInternationalOrganization('roman_world').GetName], he shall nevertheless be remembered as a restorer of imperial dignity and defender of the Roman realm against its many foes.\n\nAcross [ShowLocationName('constantinople')], solemn processions draped in black silk wind through the colonnaded avenues toward the [ShowBuildingTypeName('br_agioi_apostoloi_building')], where the Basileus is to be entombed among the emperors of old. Beneath the shadow of [ShowBuildingTypeName('br_hagia_sophia_building')], the people gather in forums, harbors, and taverns alike, speaking in hushed tones of omens, succession, and the uncertain fate of the Empire.\n\nAs embassies, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], and provincial governors dispatch lavish funerary offerings to the Queen of Cities, a single question weighs heavily upon the hearts of all Romans; what destiny now awaits the Basileia Romaion and her people?"
 br_ere_events.5.a: "May God preserve the Empire"

 br_ere_events.6.title: "The Coronation of the New Basileus"
 br_ere_events.6.entry: "$br_ere_events.6.title$"
 br_ere_events.6.desc: "The new [ROOT.GetCountry.GetGovernment.GetRulerTitle], having ascended the imperial throne, is crowned amidst sacred ceremony beneath the radiant mosaics of [ShowBuildingTypeName('br_hagia_sophia_building')]. Incense fills the great cathedral as the Patriarch bestows the imperial diadem upon the sovereign, while the gathered court proclaims his reign before God and the Roman people.\n\nFrom distant courts and subject realms come envoys bearing silks, relics, spices, and gilded treasures, each seeking favor within the halls of the [ShowBuildingTypeName('br_great_palace_building')]. Yet within the capital, hope mingles with quiet suspicion as senators, generals, eunuchs, and bureaucrats weigh the character of the Empire’s new master.\n\nAcross the provinces, governors and magnates renew their oaths with cautious reverence, for the strength of the [ROOT.GetCountry.GetName] now rests upon the wisdom and resolve of an untested ruler. All eyes turn toward [ShowLocationName('constantinople')], awaiting the first decrees of the new Basileus, for within them may lie either the restoration of Roman glory or the seeds of future calamity."
 br_ere_events.6.a: "Long live the [ShowSpecialStatusName('br_emperor')]!"

