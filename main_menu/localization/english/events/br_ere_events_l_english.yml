 DEATH_REASON_DEATH_REASON_killed_by_varangians: "Killed by Varangians"
 br_ere_events.1.title: "The Empire in Peril"
 br_ere_events.1.entry: "$br_ere_events.1.title$"
 br_ere_events.1.desc: "Once the [GetCountry('BYZ').GetFlavorRank] stood unrivaled. From the mountains of Armenia to the shores of the Adriatic, all trembled before the majesty of the Roman Empire. Those days are now but a fading memory.\n\nThe Empire has fractured under the weight of corruption, ambition, and neglect. Across the provinces, the [ShowSubjectTypeName('br_thema_subject')] no longer heed the commands of [ShowLocationName('constantinople')]. [ShowSpecialStatusName('defiant_strategoi')] and [ShowEstatePrivilegeName('br_dynatoi_magnates')] rule their lands as petty lords, while the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and [ShowPolicyName('pronoia_system')] holders enrich themselves as imperial authority fades beyond the [ShowBuildingTypeName('theodosian_walls')].\n\nEven now, the Basileus grows weak and infirm. Physicians whisper that his days are numbered, and that the purple will soon pass to a child whose talents are... uncertain. When the Emperor dies, rival claimants and ambitious generals will surely descend upon the throne.\n\nYet the Roman Empire has endured darker trials than these. If the rebellious provinces can be brought again beneath the imperial eagle, if the authority of the throne is restored and the themes returned to obedience, then the Empire may yet rise again. The dream of a united [GetUniqueInternationalOrganization('roman_world').GetName] has not yet died."
 br_ere_events.1.a: "The Emperor still lives not all hope is lost."
 br_ere_events.1.att: "The Basileía stands on the brink. Only a handful of Strategoi remain loyal, while factions within the Empire prepare to rise in open revolt."
 br_ere_events.1.entry: "$br_ere_events.1.title$"

 br_ere_events.3.title: "The Reordering of the Themes"
 br_ere_events.3.desc: "Now that the authority of [ShowLocationName('constantinople')] has been restored—if only in form—the ordering of the provinces must be set aright.\n\nThroughout the Empire, the themes lie divided among strategoi, pronoia holders, and grasping [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], each clinging to his privileges and jealous of imperial command. Such disorder weakens the Roman state, yet it has long served to deny any one man the power to rival the throne.\n\nIn the Sacred Palace, counsel is divided. Some urge that the provinces be brought once more into proper obedience, their holders reduced and bound directly to the will of the Basileus, that the ancient order of the Empire might be restored. Others speak for a sterner remedy: that the lands be gathered into great commands and entrusted to men of strength, capable of defending the realm in these perilous times—though such men may in time forget their place.\n\nThus must the Basileus decide: shall the Empire be governed by many who are weak, or a few who are strong?"
 br_ere_events.3.a: "Bind them to the Purple."
 #br_ere_events.3.att: "All loyal themes and pronoia will be reduced to direct vassals of the Basileus."
 br_ere_events.3.b: "Entrust Them to the Great Houses."
 #br_ere_events.3.btt: "The Empire will be reorganized into powerful regional commands under a few great governors."
 br_ere_events.3.att: "All Greek themata and pronoia in the Balkans and Anatolia will become direct vassals of the Basileus."
 br_ere_events.3.btt: "The Empire will be reorganized into a few large regional vassals. Several minor states will be annexed into stronger governors, who will become vassals or marches."

 br_ere_events.5.title: "The Death of [GetCharacter('byz_andronikos_iii_palaiologos').GetName]"
 br_ere_events.5.entry: "$br_ere_events.5.title$"
 br_ere_events.5.desc: "With the passing of [GetCharacter('byz_andronikos_iii_palaiologos').GetName], the [ROOT.GetCountry.GetFlavorRank] is cast into mourning. Though his reign was scarred by civil discord, courtly intrigue, and the gradual waning of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] $roman_authority$ throughout the [GetUniqueInternationalOrganization('roman_world').GetName], he shall nevertheless be remembered as a restorer of imperial dignity and defender of the Roman realm against its many foes.\n\nAcross [ShowLocationName('constantinople')], solemn processions draped in black silk wind through the colonnaded avenues toward the [ShowBuildingTypeName('br_agioi_apostoloi_building')], where the Basileus is to be entombed among the emperors of old. Beneath the shadow of [ShowBuildingTypeName('br_hagia_sophia_building')], the people gather in forums, harbors, and taverns alike, speaking in hushed tones of omens, succession, and the uncertain fate of the Empire.\n\nAs embassies, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], and provincial governors dispatch lavish funerary offerings to the Queen of Cities, a single question weighs heavily upon the hearts of all Romans; what destiny now awaits the Basileia Romaion and her people?"
 br_ere_events.5.a: "May God preserve the Empire"

 br_ere_events.6.title: "The Coronation of the New Basileus"
 br_ere_events.6.entry: "$br_ere_events.6.title$"
 br_ere_events.6.desc: "The new [ROOT.GetCountry.GetGovernment.GetRulerTitle], having ascended the imperial throne, is crowned amidst sacred ceremony beneath the radiant mosaics of [ShowBuildingTypeName('br_hagia_sophia_building')]. Incense fills the great cathedral as the Patriarch bestows the imperial diadem upon the sovereign, while the gathered court proclaims his reign before God and the Roman people.\n\nFrom distant courts and subject realms come envoys bearing silks, relics, spices, and gilded treasures, each seeking favor within the halls of the [ShowBuildingTypeName('br_great_palace_building')]. Yet within the capital, hope mingles with quiet suspicion as senators, generals, eunuchs, and bureaucrats weigh the character of the Empire’s new master.\n\nAcross the provinces, governors and magnates renew their oaths with cautious reverence, for the strength of the [ROOT.GetCountry.GetName] now rests upon the wisdom and resolve of an untested ruler. All eyes turn toward [ShowLocationName('constantinople')], awaiting the first decrees of the new Basileus, for within them may lie either the restoration of Roman glory or the seeds of future calamity."
 br_ere_events.6.a: "Long live the [ShowSpecialStatusName('br_emperor')]!"

 ### The Ascendancy of the Dynatoi ###
 br_ere_events.7.title: "The Ascendancy of the Dynatoi"
 br_ere_events.7.entry: "$br_ere_events.7.title$"
 br_ere_events.7.desc: "The great aristocratic houses of the Empire have grown immensely powerful through grants of land, court influence, and military patronage. Many among the Dynatoi now regard themselves less as servants of the Basileus and more as hereditary magnates whose privileges are beyond challenge. Ministers warn that unless their ambitions are curbed, the authority of Constantinople may steadily erode."
 br_ere_events.7.a: "The aristocracy remains the pillar of the Empire."
 br_ere_events.7.b: "Attempt to balance their influence carefully."
 br_ere_events.7.c: "Revoke their privileges and restore imperial authority."

 ### The Legacy of the Akritai ###
 br_ere_events.8.title: "The Legacy of the Akritai"
 br_ere_events.8.entry: "$br_ere_events.8.title$"
 br_ere_events.8.desc: "The frontier warriors of the Empire, the Akritai, have long defended the borders of Rhomania through discipline, local knowledge, and martial tradition. Following years of exhausting warfare, many commanders argue that the Empire must reform its military institutions to preserve the strength of the thematic armies. Others instead favor naval expansion or a more cautious approach."
 br_ere_events.8.a: "Reform and strengthen the frontier armies."
 br_ere_events.8.b: "Maintain the current order."
 br_ere_events.8.c: "The future of the Empire lies at sea."

 ### The Military Academy of Constantinople ###
 br_ere_events.9.title: "The Military Academy of Constantinople"
 br_ere_events.9.entry: "$br_ere_events.9.title$"
 br_ere_events.9.desc: "Imperial strategoi and scholars have proposed the establishment of a grand military academy within Constantinople itself. Such an institution would gather the finest tacticians, engineers, and officers of the Empire to codify the art of war and train future commanders in the Roman military tradition. Others argue instead for reforming the thematic system directly, expanding the obligations of military landholders."
 br_ere_events.9.a: "Found the Imperial Military Academy."
 br_ere_events.9.b: "Reform and expand the thematic system instead."

 ### Reforming the Themata ###
 br_ere_events.10.title: "Reforming the Themata"
 br_ere_events.10.entry: "$br_ere_events.10.title$"
 br_ere_events.10.desc: "The old thematic system that once secured the Empire’s frontiers has increasingly come under strain. Some officials advocate sweeping reforms to centralize military obligations and strengthen imperial authority over the provinces, while others warn that excessive interference may provoke unrest among local elites and frontier communities."
 br_ere_events.10.a: "Expand and reform the thematic system."
 br_ere_events.10.b: "Preserve the traditional provincial order."

 ### Expansion of the Imperial Shipyards ###
 br_ere_events.11.title: "Expansion of the Imperial Shipyards"
 br_ere_events.11.entry: "$br_ere_events.11.title$"
 br_ere_events.11.desc: "The shipyards of Constantinople have long stood among the greatest naval facilities in the world, supplying the fleets that guard the Bosporus and project Roman power across the seas. Admirals and merchants alike now petition the court for further expansion and modernization, arguing that mastery of the sea will determine the Empire’s future."
 br_ere_events.11.a: "Expand and modernize the imperial dockyards."
 br_ere_events.11.b: "Increase naval construction without major expansion."
 br_ere_events.11.c: "Our strength lies upon the land, not the sea."

 ### Armenian Rebellion ###
 br_ere_events.100.title: "The Armenian Revolt"
 br_ere_events.100.entry: "$br_ere_events.100.title$"
 br_ere_events.100.desc: "Discontent has spread among the Miaphysite Armenians of Anatolia, where resentment against imperial governors and religious oversight has steadily deepened. Local clergy and scholars denounce the encroachment of Constantinople upon their ancient traditions, while whispers of rebellion echo through the highlands. Armed bands now gather beneath banners of defiance, threatening to ignite all of eastern Anatolia."
 br_ere_events.100.a: "The Armenians rise in open revolt!"
 br_ere_events.100.b: "Attempt to reconcile the provinces."
 celali_uprising_joining: "Miaphysite populations across Anatolia will rally behind the Armenian uprising."
 celal_available.tt: "The revolt will be suppressed before it can fully erupt."

 ### Tunisian Revolt ###
 br_ere_events.101.title: "Unrest in Tunis"
 br_ere_events.101.entry: "$br_ere_events.101.title$"
 br_ere_events.101.desc: "The Sunni populations of Ifriqiya have grown increasingly resentful of imperial centralization and the expanding authority of Constantinople. Provincial notables condemn the erosion of local autonomy, while veterans and tribal leaders speak openly of resistance. Reports from Tunis suggest that the situation may soon spiral into outright rebellion."
 br_ere_events.101.a: "The unrest spreads throughout Tunis."
 br_ere_events.101.b: "Grant concessions to the local elites."
 tunisian_uprising: "Sunni populations throughout Tunis will grow deeply dissatisfied."

 ### Tripolitanian Revolt ###
 br_ere_events.102.title: "The Tribes of Tripolitania"
 br_ere_events.102.entry: "$br_ere_events.102.title$"
 br_ere_events.102.desc: "The distant provinces of Tripolitania remain difficult to govern. Tribal confederations and Sunni notables alike resent the demands of Constantinople, viewing imperial rule as both distant and oppressive. Armed raiders and dissidents have begun to gather in the countryside, threatening the fragile peace of the region."
 br_ere_events.102.a: "Tighten imperial authority."
 br_ere_events.102.b: "The region erupts into disorder."
 tripolitan_uprising: "Sunni populations across Tripolitania will become severely discontented."

 ### Egyptian Revolt ###
 br_ere_events.103.title: "Discontent Along the Nile"
 br_ere_events.103.entry: "$br_ere_events.103.title$"
 br_ere_events.103.desc: "Egypt remains one of the richest yet most volatile provinces of the Empire. Sunni scholars, local magnates, and the common people alike increasingly resent imperial taxation and foreign administration. Rumors of unrest spread from Alexandria to Cairo, and many fear that Egypt may once again become the center of a great rebellion."
 br_ere_events.103.a: "Suppress the unrest with force."
 br_ere_events.103.b: "The Egyptians must be pacified."
 br_ere_events.103.c: "Placate the local elites."
 egyptian_uprising: "The Sunni populations of Egypt will become dangerously rebellious."
 egyptian_discontent: "The people of Egypt will remain discontent, though open revolt may yet be avoided."

 ### Anatolian Brigands ###
 br_ere_events.104.title: "Anatolian Brigands"
 br_ere_events.104.entry: "$br_ere_events.104.title$"
 br_ere_events.104.desc: "Banditry and lawlessness have spread across the Anatolian countryside. Displaced peasants, deserters, and opportunistic warlords prey upon isolated settlements while imperial authority weakens beyond the major cities. Unless decisive measures are taken, the brigands may evolve into a far greater threat."
 br_ere_events.104.a: "Mobilize the thematic militias."
 br_ere_events.104.c: "Crush them without mercy."
 br_ere_events.104.d: "We can endure this nuisance."
 anatolian_brigands_maybe_more_problems.tt: "This may only be the beginning of wider unrest in Anatolia."
 anatolian_brigands_no_more_problems.tt: "Harsh measures may restore order, though resentment will linger."
 anatolian_brigands_certainly_more_problems.tt: "Ignoring the brigands will almost certainly worsen the situation."

 ### Disarming Anatolia ###
 br_ere_events.105.title: "Disarming Anatolia"
 br_ere_events.105.desc: "Imperial officials argue that the countryside must be pacified through force and disarmament, yet many peasants regard these measures as tyranny. Villages resist confiscation efforts, and rumors spread that entire districts may rise against the state if the policy continues."
 br_ere_events.105.a: "Disarm the countryside by force."
 br_ere_events.105.b: "Offer compensation and limited concessions."
 br_ere_events.105.c: "Allow local militias to police the region."
 rebellion_dies_down_tt: "The unrest gradually fades before erupting into open revolt."

 ### The Power of Printing ###
 br_ere_events.106.title: "The Power of Printing"
 br_ere_events.106.entry: "$br_ere_events.106.title$"
 br_ere_events.106.desc: "The spread of the printing press has transformed intellectual life throughout the Empire. Books, pamphlets, and theological treatises circulate with unprecedented speed, empowering scholars and merchants while alarming traditional authorities. Many hail this new age of learning, though the clergy warn that unchecked printing may undermine faith and order alike."
 br_ere_events.106.a: "Encourage the spread of learning."
 br_ere_events.106.b: "Printing must remain carefully controlled."

 ### The Grievance of Scribes ###
 br_ere_events.107.title: "The Grievance of the Scribes"
 br_ere_events.107.desc: "The rapid spread of printing has displaced countless scribes, copyists, and traditional scholars whose livelihoods once depended upon the laborious reproduction of manuscripts. Many denounce the presses as vulgar machines that cheapen knowledge and undermine ancient customs. Their anger now threatens to spill into unrest."
 br_ere_events.107.a: "Restrict the presses and restore order."
 br_ere_events.107.b: "Progress cannot be halted."

 ### Bulgarian Grievances ###
 br_ere_events.108.title: "The Grievances of Bulgaria"
 br_ere_events.108.entry: "$br_ere_events.108.title$"
 br_ere_events.108.desc: "In the Bulgarian provinces, resentment against imperial authority has steadily intensified. Greek settlers and administrators are increasingly viewed as instruments of domination, while Bulgarian communities accuse Constantinople of exploitation and neglect. Violent clashes have erupted in several towns, raising fears of a broader uprising."
 br_ere_events.108.a: "Crush the agitators."
 br_ere_events.108.b: "Reassert tighter imperial administration."
 br_ere_events.108.c: "Attempt to calm the situation."

 ### Bulgarian Massacre ###
 br_ere_events.109.title: "The Bulgarian Massacre"
 br_ere_events.109.desc: "Mob violence has erupted against Bulgarian communities within the Empire. Inflamed by fear, vengeance, and years of ethnic tension, armed crowds have attacked Bulgarian quarters in several cities. Reports of killings and expulsions spread rapidly, threatening to deepen divisions throughout the Balkans."
 br_ere_events.109.a: "Permit reprisals against the Bulgarians."
 br_ere_events.109.b: "Restore order before matters worsen."

 ### Serbian Uprising ###
 br_ere_events.110.title: "The Serbian Uprising"
 br_ere_events.110.entry: "$br_ere_events.110.title$"
 br_ere_events.110.desc: "Serbian resistance has erupted across the central Balkans. Local nobles, clergy, and villagers alike denounce imperial taxation and administration, rallying beneath banners of rebellion. Armed insurgents now gather in Toplica, Šumadija, and Braničevo, threatening to ignite a wider revolt throughout the region."
 br_ere_events.110.a: "The Serbs rise against us!"
 br_ere_events.110.b: "Contain the uprising through military occupation."
 tur_all_of_specified_locations_join_rebellion_tt: "The populations of the affected Serbian provinces will rally behind the uprising."
 tur_all_specified_locations_lose_control: "Imperial control in the affected Serbian provinces will collapse."

 ### The Matter of the Nile ###
 br_ere_events.200.title: "The Matter of the Nile"
 br_ere_events.200.entry: "$br_ere_events.200.title$"
 br_ere_events.200.desc: "The fertile lands of Egypt remain among the greatest treasures of the Empire, yet the Nile demands constant labor and investment to sustain its prosperity. Imperial officials propose ambitious irrigation and flood-control works to increase agricultural output and enrich the treasury, though many local Egyptians resent further interference from Constantinople. The question before the court is whether the Nile shall primarily serve imperial ambition or the well-being of Egypt itself."
 br_ere_events.200.a: "Expand the Nile works for the glory of the Empire."
 br_ere_events.200.b: "Prioritize the prosperity of the Egyptian people."
 egyptians_displeased_tooltip: "The Egyptian population will resent the increased imperial exploitation of the Nile."
 egyptians_pleased_tooltip: "The Egyptian population will welcome the Empire’s support and investment."

 ### The Art of Italy ###
 br_ere_events.201.title: "The Art of Italy"
 br_ere_events.201.entry: "$br_ere_events.201.title$"
 br_ere_events.201.desc: "The flourishing courts and republics of Italy have become renowned throughout the world for their painters, sculptors, and architects. Though the Empire possesses its own ancient artistic traditions, many within Constantinople admire the innovations emerging from the Latin West. Foreign artists now seek patronage abroad, and some among the court propose inviting Italian masters to adorn the Empire with their talents."
 br_ere_events.201.a: "Invite the Italian artist to our court."
 br_ere_events.201.b: "Roman art requires no foreign influence."

 DEATH_REASON_killed_by_varangians: "[CHARACTER.GetSheHe|U] was murdered by the Varangian guard."
 STATIC_MODIFIER_NAME_varangian_custodianship: "Varangian Custodianship"
 varangian_revolt: "Varangian Revolt"
 varangian_revolt_country: "Varangian State"
 varangian_revolt_country_adjective: "Varangian"

 br_ere_events.2000.title: "The Reforms of [ambitious_ruler.GetName]"
 br_ere_events.2000.entry: "$br_ere_events.2000.title$"
 br_ere_events.2000.desc: "Perceiving that the authority of the Basileus is no longer as absolute as it once was, [ambitious_ruler.GetName] grows increasingly restless. [ambitious_ruler.GetSheHe|U] laments the rising influence of powerful magnates, entrenched court officials, and provincial strategoi, all of whom now rival the throne in power and prestige.\n\nDetermined to restore the primacy of imperial authority, [ambitious_ruler.GetSheHe] seeks to enact sweeping reforms to strengthen the hand of the Basileus and reassert control over the Empire. Yet such measures threaten the delicate balance of the court and provinces alike, and many who benefit from the current order will not yield their power lightly."
 #br_ere_events.2000.historical_info: ""
 br_ere_events.2000.a: "The Basileus must reclaim his authority."
 br_ere_events.2000.b: "Let [ambitious_ruler.GetHerHim] temper ambition with prudence."
 br_ere_events.2000.c: "The Empire cannot risk such upheaval."
 br_ere_events.2000.entry: "$br_ere_events.2000.title$"

 br_ere_events.2001.title: "The Wrath of the Varangians"
 br_ere_events.2001.desc: "The reforms of [ambitious_ruler.GetName] have not gone unanswered. In seeking to curb entrenched power and restore imperial authority, [ambitious_ruler.GetSheHe] has alarmed those who stand as guardians of the established order.\n\nThe Varangian Guard, long sworn to defend the Basileus yet deeply tied to the balance of power within the Empire, now seethe with anger. Rumors spread that [ambitious_ruler.GetSheHe] intends to diminish their influence—or worse, replace them entirely. Allies among the nobility and court have already begun to whisper of action.\n\nUnless decisive steps are taken, the fate of the Basileus may soon be decided not in council, but in blood."
 #br_ere_events.2001.historical_info: ""
 br_ere_events.2001.a: "If they demand blood, let it be given."
 br_ere_events.2001.b: "We will not bow to armed insolence."




 br_ere_disaster_events.1.title: "The Curse of [GetCountry('BYZ').GetNameWithNoTooltip]"
 br_ere_disaster_events.1.desc: "Dire days have befallen the realm! The curse of [GetCharacter('target_character').GetName] has taken hold of our Empire. Within the halls of the Palace, courtiers and counsellors whisper that an age is drawing to its end, and that the fortunes of the Roman realm are descending into a dark and perilous hour..."
 br_ere_disaster_events.1.a: "This cannot be the end, not thus..."

 br_ere_disaster_events.2.title: "A New Era for [GetCountry('BYZ').GetNameWithNoTooltip]"
 br_ere_disaster_events.2.desc: "Once more the heavens above our great realm shine with the light of hope and a new dawn. Though we have endured grievous troubles and the dark counsel of superstition, the Empire has weathered the storm. Our people have prevailed, and the Roman realm rises once more, strengthened by the trials it has endured!"
 br_ere_disaster_events.2.a: "United and strengthened, we march onward."

 br_ere_disaster_events.3.title: "Demands for Autonomy"
 br_ere_disaster_events.3.desc: "The weakening of the imperial administration has emboldened many voices to challenge the authority of the throne. The latest petitions for representation and local autonomy have arisen from [target_province.GetName]. Word has spread that imperial authority has waned, and they now come before us bearing arms, making outrageous demands, and speaking of some foreign notion they call freedom."
 br_ere_disaster_events.3.a: "Let them have their desire."
 br_ere_disaster_events.3.b: "Let them learn the Roman remedy of the whip!"

 br_ere_disaster_events.4.title: "Neighbors as Vultures"
 br_ere_disaster_events.4.desc: "The scheming courtiers of [target_country.GetName] have lost no time in plotting to descend upon our lands at the first scent of imperial weakness. Like vultures circling a wounded lion, they prepare to carve away the dominions of Rome. Such insolence cannot go unanswered; we must remind them why the [GetCountry('BYZ').GetLongName] remains a power to be feared."
 br_ere_disaster_events.4.a: "Let them dare!"

 br_ere_disaster_events.5.title: "Peasant Uprising"
 br_ere_disaster_events.5.desc: "The waning authority of the throne in these troubled days has emboldened the peasantry throughout the realm to demand relief from the burdens of the countryside at the expense of the imperial court. The peasant leaders of [target_location.GetName] have pressed their demands beneath the threat of widespread ruin and disorder!"
 br_ere_disaster_events.5.a: "We do not bargain with peasants!"
 br_ere_disaster_events.5.b: "Surely some accord may yet be reached?"

 br_ere_disaster_events.6.title: "Province Declares Independence!"
 br_ere_disaster_events.6.desc: "The grasping shadows of [target_location.GetName] have dared to bare their claws against the authority of the throne. In a grotesque imitation of imperial dignity, they have proclaimed themselves separate from the crown and have even raised their eyes toward the throne of Rome!"
 br_ere_disaster_events.6.a: "Their remains shall fertilize the fields of the Empire!"
 br_ere_disaster_events.6.b: "Leave them to their folly..."

 br_people_of_target_province_will_declare_war_on_us_tt: "The people of [target_province.GetNameWithNoTooltip] will declare [war|e] upon us!"
 
 br_ere_disaster_events.7.title: "Local Dynatoi Defy the Throne"
 br_ere_disaster_events.7.desc: "The regional dynatoi of [target_location.GetName] have begun to conduct themselves as though they were sovereign, disregarding imperial decrees and ruling their lands without heed to the authority of the throne. Emboldened by the weakness of the central administration, others may soon follow their example. Unless we act decisively, the Empire may be rent asunder by ever greater fragmentation."
 br_ere_disaster_events.7.a: "We have greater matters to attend to."
 br_ere_disaster_events.7.b: "Reassert the authority of the throne over [target_location.GetNameWithNoTooltip]."

 br_ere_disaster_events.8.title: "Courtier Accused of Treason"
 br_ere_disaster_events.8.desc: "One of our most trusted counsellors, [target_character.GetName], has fallen under grave suspicion. [target_character.GetSheHe|U] is accused of accepting foreign coin in exchange for secrets concerning our $rank_empire_byzantine$. Though no certain proof has yet been uncovered, the accusation alone has stirred unease within the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. To disregard the matter may leave a traitor free to strike from within our own ranks; yet haste may see a faithful servant condemned unjustly."
 br_ere_disaster_events.8.a: "Cast [target_character.GetHerHim] from the Palace at once!"
 br_ere_disaster_events.8.b: "It is surely but a whisper of slander..."

 br_ere_disaster_events.9.title: "Mutineers in the Army"
 br_ere_disaster_events.9.desc: "The spirit of our armies falters as unpaid soldiers murmur and officers struggle to preserve order. With their pay delayed and the chain of command weakened by each passing day, those who once stood as a pillar of Roman strength may instead become a sword turned against the Empire."
 br_ere_disaster_events.9.a: "Pay the soldiers their due."
 br_ere_disaster_events.9.b: "The treasury cannot bear the burden."
 br_ere_disaster_events.9.c: "Crush this mutiny before it spreads!"

 br_ere_disaster_events.10.title: "A Rebellious Subject"
 br_ere_disaster_events.10.desc: "Rumors have reached the capital that the dynatoi of [subject_target.GetName] grow ever more defiant. It is said that they conspire in secret, testing the limits of their allegiance to the throne. Though no open rebellion has yet been proclaimed, our trusted informants report that their [subject_target.GetGovernment.GetCourtTitle] resounds with whispers of independence."
 br_ere_disaster_events.10.a: "Appease them with concessions."
 br_ere_disaster_events.10.b: "For now, our hands are bound."

 br_ere_disaster_events.11.title: "Unpaid Garrison"
 br_ere_disaster_events.11.desc: "The soldiers stationed at our garrison in [target_location.GetName] grow mutinous, accusing the local governors of neglecting the defenses and withholding their rightful pay. These men, entrusted with the defense of a fortress guarding the whole of [target_area.GetName], see little reason to remain faithful to a crown that cannot provide for those who bear its arms."
 br_ere_disaster_events.11.a: "Pay their wages without delay!"
 br_ere_disaster_events.11.b: "Compel the local dynatoi to pay them."
 br_ere_disaster_events.11.c: "The treasury can spare no nomisma."

 br_ere_disaster_events.12.title: "Feuding Estates"
 br_ere_disaster_events.12.desc: "The weakening of imperial authority in recent years has emboldened the estates of the $rank_empire_byzantine$, each contending for greater influence over the diminished [GetEstateName('crown_estate')]. Long-simmering rivalries have now erupted into open hostility, and maintaining our neutrality grows ever more difficult. If we risk turning both factions against the throne, we may yet secure the loyalty of one by sacrificing what remains of unity within the realm."
 br_ere_disaster_events.12.a: "We shall stand with the [first_estate.GetNameWithNoTooltip]."
 br_ere_disaster_events.12.b: "We shall defend the interests of the [second_estate.GetNameWithNoTooltip]."
 br_ere_disaster_events.12.c: "Let the throne take no side in this quarrel."

 #bul_restore_the_realms_unity: "Restore the Unity of the Realm"
 #bul_restore_the_realms_unity_desc: "Lands that were once an integral part of the [GetCountry('BYZ').GetFlavorRank] have slipped from the grasp of the throne and no longer acknowledge its authority. If the Empire is to endure this twilight, these wayward lands must be restored to the Roman fold. By force, if need be..."
 #bul_reassert_our_authority: "Reassert the Authority of the Throne"
 #bul_reassert_our_authority_desc: "The internal weakness of [GetCountry('BYZ').GetName] has emboldened the dynatoi throughout the [GetCountry('BYZ').GetFlavorRank], who now defy imperial decrees and rule their domains as though they answered to no sovereign. We must halt the fragmentation of the realm, restore the authority of the throne, and compel these lords to bend the knee once more."
 #bul_push_for_diplomatic_reintegration: "Pursue Diplomatic Reintegration"
 #bul_push_for_diplomatic_reintegration_desc: "To avert the fires of civil war, we have entrusted portions of our lands to lords who govern them in the name of Rome. Though such an arrangement may preserve the peace for a season, it is our imperial duty to pursue the diplomatic reunification of the $rank_empire_byzantine$. For a realm divided cannot long endure the trials that await it."

 br_ere_disaster_events.13.title: "Surrounded by Vultures"
 br_ere_disaster_events.13.desc: "While the Empire remains consumed by strife within, our opportunistic neighbors circle like vultures around a dying beast. Sensing weakness, they watch our every movement and await the hour in which they may descend upon what remains of our $rank_empire_byzantine$. Now word has reached the capital that [target_country.GetName] has laid claim to [border_claim_province.GetName], intending to seize it should fortune grant them the opportunity."
 br_ere_disaster_events.13.a: "Let them test the strength of Rome!"
 br_ere_disaster_events.13.b: "Buy their silence and make them revoke the claim."
