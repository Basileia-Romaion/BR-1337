l_english:


 br_latin_wars.1.title: "The Catalan Crusade"
 br_latin_wars.1.desc: "The continued Muslim control of Zaragoza has reignited calls throughout Catholic Iberia for a renewed crusade against Al-Andalus. Clergymen preach that the struggle for Hispania is far from over, while knights and nobles from across the western Mediterranean gather beneath the banner of the Cross.\n\nHis Holiness now considers proclaiming a great crusade in support of the Crown of Aragon, hoping to unite the princes of Latin Christendom against the powers of Al-Andalus and reclaim lands long held by the faithful."
 br_latin_wars.1.a: "Let the Cross march upon Iberia."
 br_latin_wars.1.b: "Christendom is too divided for such a war."

 br_latin_wars.2.title: "The Call to Crusade"
 br_latin_wars.2.desc: "A Papal proclamation has spread throughout the courts and churches of Christendom, calling upon the faithful to join a crusade against Al-Andalus in Iberia.\n\nThe Crown of Aragon has become the leading power of the expedition, and already nobles, knights, and adventurers prepare themselves for war. Priests promise glory and salvation to those who take up the Cross against the enemies of the faith."
 br_latin_wars.2.a: "We shall join the crusade."
 br_latin_wars.2.b: "We will not participate."

 br_latin_wars.3.title: "A Crusade Against Al-Andalus"
 br_latin_wars.3.desc: "News has spread across Al-Andalus that the Pope has proclaimed a new crusade in Iberia. Christian princes and holy orders gather their armies while fiery sermons call for the reconquest of Muslim lands.\n\nMany within the realm see this as yet another attempt by the Latin kingdoms to break the power of Al-Andalus and restore Christian rule across the peninsula. The people now prepare for another great struggle between crescent and cross."
 br_latin_wars.3.a: "We shall defend Iberia."

 br_latin_wars.4.title: "The Cession of the Conquered Lands"
 br_latin_wars.4.desc: "With victories won against Al-Andalus, debate has emerged among the crusading leadership regarding the administration of the conquered territories. Some argue that these lands should remain under the direct control of the crusading orders and their commanders, while others insist they rightfully belong to the Crown of Aragon, whose rulers bore the greatest burden of the campaign.\n\nThe future of the newly conquered lands must now be decided."
 br_latin_wars.4.a: "Transfer the lands to Aragon."
 br_latin_wars.4.b: "The crusaders shall retain them."

 br_latin_wars.5.title: "The Crusader Offer"
 br_latin_wars.5.desc: "The leaders of the crusading forces have offered to formally cede the newly conquered territories to the Crown of Aragon. Such an arrangement would strengthen Aragonese influence across Iberia and further establish the kingdom as a champion of the Catholic cause.\n\nYet some advisers warn that accepting these territories may provoke resistance from local powers and entangle the Crown in endless frontier conflicts."
 br_latin_wars.5.a: "Accept the territories."
 br_latin_wars.5.b: "Refuse the offer."

 br_latin_wars.6.desc_accept: "The Crown of Aragon has accepted the transfer of the conquered territories, securing greater influence and prestige for the kingdom throughout Iberia. Many within the Church celebrate the decision as a triumph for the Catholic cause and a step toward the further rollback of Muslim power in the peninsula."

 br_latin_wars.6.desc_deny: "The Crown of Aragon has refused the transfer of the conquered territories. The decision has surprised many among the crusading leadership, who had hoped the kingdom would assume responsibility for governing the reclaimed lands."

 br_latin_wars.6.title: "The Aragonese Decision"
 br_latin_wars.6.a: "A victory for Christendom."
 br_latin_wars.6.b: "A disappointing outcome."

 br_latin_wars.20.title: "The Question of Illyria"
 br_latin_wars.20.desc: "The growing influence of the Romans along the Adriatic has caused deep concern within the councils of Venice. With [ShowLocationName('durres')] now firmly in imperial hands, many merchants and senators fear that Roman expansion into Illyria threatens Venetian trade routes and influence throughout the eastern Mediterranean.\n\nAmong the nobility and merchant houses, voices increasingly call for decisive action before the Romans secure complete dominance over the Adriatic coast."
 br_latin_wars.20.a: "We cannot ignore this Roman expansion."
 br_latin_wars.20.b: "The Republic has greater concerns."

 br_latin_wars.21.title: "Venetian Demands"
 br_latin_wars.21.desc: "Envoys from Venice have arrived demanding the surrender of [ShowLocationName('durres')], claiming that Roman control of the city threatens the balance of power within the Adriatic. Venetian merchants speak openly of protecting their trade privileges, while many within the imperial court see these demands as little more than Latin interference in Roman affairs.\n\nThe question now stands before the Emperor: should the city be retained, or ceded in the hope of preserving peace with Venice?"
 br_latin_wars.21.a: "[ShowLocationName('durres')] shall remain Roman."
 br_latin_wars.21.b: "Better peace than conflict."

 br_latin_wars.22.title: "The Illyrian Dispute"
 br_latin_wars.22.desc: "The Romans have refused Venetian demands regarding [ShowLocationName('durres')], further escalating tensions between Constantinople and the Republic. Merchants warn that Roman domination of the Adriatic may soon threaten Venetian commerce itself, while many senators call for immediate retaliation.\n\nWar now appears increasingly inevitable."
 br_latin_wars.22.a: "We shall reclaim what is ours."

 br_latin_wars.23.title: "The Cession of [ShowLocationName('durres')]"
 br_latin_wars.23.desc: "The Romans have agreed to surrender [ShowLocationName('durres')] to Venice, avoiding what many feared would become a wider conflict in the Adriatic. The acquisition is celebrated throughout the Republic as a major diplomatic victory and a triumph for Venetian influence over the eastern seas."
 br_latin_wars.23.a: "A great victory for the Republic."

 br_latin_wars.24.title: "The Morean Question"
 br_latin_wars.24.desc: "Roman influence within the Morea continues to expand, alarming many within the Venetian Republic who view the Peloponnese as vital to their commercial and strategic interests in the eastern Mediterranean.\n\nSome senators argue that if Venice fails to act now, the Romans may soon dominate the trade routes and ports upon which the Republic depends. Others warn that conflict with Constantinople could prove both costly and dangerous."
 br_latin_wars.24.a: "We must confront the Romans."
 br_latin_wars.24.b: "War with Constantinople is unwise."

 br_latin_wars.25.title: "Venetian Provocation"
 br_latin_wars.25.desc: "Venice has openly challenged Roman influence within the Morea, issuing demands and stirring hostility against the Empire throughout the Adriatic. Many within the imperial court see the actions of the Republic as yet another example of Latin ambition directed against Roman lands and interests.\n\nThe situation threatens to further deteriorate relations between Venice and Constantinople."
 br_latin_wars.25.a: "The Latins test our patience."