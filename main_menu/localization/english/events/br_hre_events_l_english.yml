l_english:
 
 br_hre_events.2.title: "A Crusade or an Act of Madness?"
 br_hre_events.2.desc: "A magnificent opportunity presents itself before us. The Iberian princes have just sent envoys proposing an alliance under our leadership against Al-Andalus. In exchange for our assistance, they pledge to swear an oath of fealty to the Empire. Furthermore, given its power, the Kingdom of Asturias shall be granted the rank of Electorate, which should secure us a loyal elector.
On the other hand, another path lies before us. While the first option could help restore our authority, we could instead launch a swift and daring attack against the possessions of the prince-electors, declaring war upon them directly. An almost reckless act, but one that could definitively restore our imperial authority and wash away the disgrace brought upon us by Louis IV. Yet who can say what the consequences would be should we fail?"
 br_hre_events.2.a: "CRUSADE"
 br_hre_events.2.b: "Whait what ? #R Warning , this is a difficult path#!"
 
br_hre_events.3.title: "Victorious Crusaders"
 br_hre_events.3.desc: "Those accursed heretics of Al-Andalus are now nothing more than a distant memory. The united Christian armies have utterly obliterated their former power. The Christians who had languished under their impure rule for centuries have finally been liberated and now live under the rightful governance of Christian lords.
PRAISE BE TO GOD! PRAISE BE TO THE EMPEROR!"
 br_hre_events.3.a: "Deus Vult !"
 
br_hre_events.4.title: "An Unprecedented Victory!"
 br_hre_events.4.desc: "By a miracle that only God can explain, our armies, despite being vastly outnumbered, have defeated the prince-electors. They have been forced to restore several privileges previously stripped from the Emperor. But most importantly, we have secured the direct vassalisation of the prince-electors bordering our territories.
Perhaps Louis IV the Mad was not so mad after all. Perhaps he had simply chosen the wrong moment to act."
 br_hre_events.4.a: "We are invicible"
 
br_hre_events.5.title: "Improved Imperial Authority"
 br_hre_events.5.desc: "Following the Iberian Crusade, we have slowly but steadily begun to reclaim our authority through long but necessary reforms. We are still far from matching the greatness of Charlemagne, but at least the princes no longer spend their days laughing behind our backs. No, now they fear us!"
 br_hre_events.5.a: "Glory to the Empire"
 
br_hre_events.6.title: "Convoke the Electors count"
 br_hre_events.6.desc: "It is time to put an end to the charade that is the princes of the Holy Roman Empire. Let us summon them and demand that they be annexed into the Imperial Domain!"
 br_hre_events.6.a: "What can they do after all ?"
 
br_hre_events.7.title: "The princes have refused!"
 br_hre_events.7.desc: "The princes have rejected the demands of our most holy Emperor. These vultures, hungry for glory and power, cannot they understand something as simple as the res publica? Do they wish for war? Then war they shall have! We shall rally the princes loyal to the Empire and defeat these dogs!"
 br_hre_events.7.a: "How dare you ?!"
 
br_hre_events.8.title: "The Eastern German Princes Leave the Empire!"
 br_hre_events.8.desc: "In an act of sheer treachery, the Eastern German princes have declared that the Empire no longer serves their interests and that their vassalage agreements are therefore null and void. Such an act deserves an immediate military response, but given our current situation, we can do nothing but watch!"
 br_hre_events.8.a: "Oh shit"

br_hre_events.10.title: "The Powerful Vassals"
br_hre_events.10.desc: "Reviving the Empire from its ashes is no easy task, especially for our overburdened administration. We have therefore had to delegate our authority in Aquitaine, Bavaria, Italy, Flanders, and Holland. Though these vassals answer to the Emperor, we must swiftly reform the imperial administration so that we may integrate them as soon as possible and undo the mistakes of the past. Furthermore, in exchange for recognizing our new title, the Pope demanded the return of Siena and Pisa to the Papacy, as well as full independence for the Papal States terms we had no choice but to accept."
br_hre_events.10.a: "We must restore the Empire's strength."
