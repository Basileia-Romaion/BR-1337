 br_orthodox_events.4.title: "The Independence of the Bulgarian Church"
 br_orthodox_events.4.desc: "The Bulgarian realm has grown into a power whose influence can no longer be measured by the bounds of its provinces alone. Its armies command respect, its court is counted among the great powers of Christendom, and its bishops preside over a flourishing Orthodox people. Yet the highest dignity of the Bulgarian Church remains subject to the authority of Constantinople. The bishops and magnates now petition that this no longer be so: that the Church of Bulgaria be raised to an autocephalous Patriarchate, with its own Patriarch enthroned at Tărnovo, befitting the stature of the Bulgarian realm."
 br_orthodox_events.4.a: "Let the Church of Bulgaria be raised to a Patriarchate."
 br_orthodox_events.4.b: "The authority of Constantinople shall remain."
 br_orthodox_events.4.historical_info: "The Bulgarian Patriarchate was restored at Tărnovo in 1235 following an agreement between the Bulgarian ruler Ivan Asen II and the Byzantine Emperor John III Doukas Vatatzes. Its restoration reflected the growing political and ecclesiastical importance of the Bulgarian Empire."

 br_orthodox_events.5.title: "The Independence of the Georgian Church"
 br_orthodox_events.5.desc: "The Georgian realm stands preeminent among the Christian powers of the Caucasus. Its kings command a mighty realm, its nobles hold sway across the mountain passes, and its Church remains the spiritual heart of a proud Orthodox people. Yet despite the stature of the Georgian crown, the highest ecclesiastical dignity remains bound to the wider hierarchy of the Orthodox world. The bishops now petition that the Church of Georgia be granted the dignity befitting its realm: an autocephalous Patriarchate, with its own Patriarch enthroned at Tbilisi and the authority to govern the Georgian Church without recourse to Constantinople."
 br_orthodox_events.5.a: "Let the Church of Georgia be raised to a Patriarchate."
 br_orthodox_events.5.b: "The authority of Constantinople shall remain."
 br_orthodox_events.5.historical_info: "The Georgian Church possessed an ancient independent ecclesiastical tradition, with the Catholicos of Iberia exercising authority over the Georgian Church. The title of Catholicos-Patriarch became firmly established in the medieval Georgian kingdom."

 #Petition to send bishop to Middle Kingdom
 hangzhou.1.title: "Strange Visitors"
 hangzhou.1.entry: "$hangzhou.1.title$"
 hangzhou.1.desc: "Strange visitors came to our palace in Antioch. It turned out they are followers of Christ that live far away in the Middle Kingdom. They got here by Silk Road and ask for our help. Their community is small and they have no bishop to guide them. They are heretics but maybe we could help them?"
 hangzhou.1.a: "They are God's children too."
 hangzhou.1.b: "They don't deserve our attention!"
 
 #Bishop arrived to Middle Kingdom
 hangzhou.2.title: "Bishop Arrived"
 hangzhou.2.entry: "$hangzhou.2.title$"
 hangzhou.2.desc: "It is told that the bishop we sent to Middle Kingdom has arrived to his destination."
 hangzhou.2.a: "May God bless him."
 hangzhou.2.b: "He is accompanied by our most talented missionary."
 
 hangzhou.3.title: "Patriarchate Established"
 hangzhou.3.desc: "For my profession of holy faith, I promise the canons of the Holy Apostles, the Seven Ecumenical and the God-fearing Local Councils and the canons of the Holy Fathers, to protect and preserve everything that they accepted, I accept, and everything they rejected, I reject."
 hangzhou.3.a: "Let the Middle Kingdom hear the Word of God."