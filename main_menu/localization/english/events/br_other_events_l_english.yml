 br_country_startup.4.title: "The Fate of Sardinia"

 br_country_startup.4.desc: "For generations, Sardinia stood within the maritime system of the Basileía Romaíon. In the days of the Komnenian Emperors, imperial fleets secured our waters, our ports prospered under their protection, and though distant from Constantinople, we were never truly alone. But the Empire that once bound the seas together has changed. As imperial authority waned, its grip loosened not in a single moment, but over decades. The fleets grew fewer, the governors more distant, and the island was left to stand on its own. What was once a shield has become a memory. Now, the balance has broken. Genoese forces have seized the north, claiming stewardship where the Empire no longer can, while in the south the Sultan of Ifriqiya from across the sea has carved out their own domain on our shores. We are caught between worlds—no longer firmly within the Empire, yet not beyond its shadow. Genoa offers terms: submit to their protection, and they will restore what they have taken. It is a bitter bargain, trading one master for another—but perhaps it is the only way to survive in this new age. Or we may reject them, and face the storm alone..."

 br_country_startup.4.a: "Accept Genoese Protection"
 br_country_startup.4.b: "We Will Reclaim What Is Ours"
 br_country_startup.4.c: "Seek Terms with the Southern Emirs"

 br_country_startup.5.title: "The Division of Sicily"
 br_country_startup.5.desc: "The struggle for Sicily has defined our people for generations. There was a time when even the great cities of Syracuse and Messene were lost, and Roman authority on the island seemed extinguished for good. Yet in the great campaigns that followed, the tide was turned. The general Georgios Maniakes, alongside the Varangian Harald Sigurðsson, returned in force, reclaiming the eastern strongholds and restoring Syracuse as the seat of a renewed Theme of Sikelia. From that foothold, the reconquest surged forward. Reinforced in the days of the Komnenian Emperors, Roman armies drove westward, city by city, until even Palermo stood within reach. For a brief moment, the dream of a united Sicily seemed not only possible, but inevitable. But the Empire's strength was not without limit. The Tagmata were recalled to face Lombards and Normans on the mainland, the fleets thinned, and the local themata of Sicily were left to hold what they had won. Without imperial support, the advance stalled. What had been triumph became stalemate, and stalemate gave way to uneasy peace. A truce was struck, and the island was divided. Now we stand as the heirs of that hard-won restoration—masters of the east, with Syracuse once more our capital, yet with the west still beyond our grasp. The work of Maniakes remains unfinished, and the question of Sicily's fate endures."

 br_country_startup.5.a: "Stand with the Empire, and Finish the Reconquest"
 br_country_startup.5.b: "We Will Reclaim Sicily Ourselves"