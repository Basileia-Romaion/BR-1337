 br_country_startup.4.title: "The Fate of Sardinia"

 br_country_startup.4.desc: "For generations, Sardinia stood within the maritime system of the Basileía Romaíon. In the days of the Komnenian Emperors, imperial fleets secured our waters, our ports prospered under their protection, and though distant from Constantinople, we were never truly alone. But the Empire that once bound the seas together has changed. As imperial authority waned, its grip loosened not in a single moment, but over decades. The fleets grew fewer, the governors more distant, and the island was left to stand on its own. What was once a shield has become a memory. Now, the balance has broken. Genoese forces have seized the north, claiming stewardship where the Empire no longer can, while in the south the Sultan of Ifriqiya from across the sea has carved out their own domain on our shores. We are caught between worlds—no longer firmly within the Empire, yet not beyond its shadow. Genoa offers terms: submit to their protection, and they will restore what they have taken. It is a bitter bargain, trading one master for another—but perhaps it is the only way to survive in this new age. Or we may reject them, and face the storm alone..."

 br_country_startup.4.a: "Accept Genoese Protection"
 br_country_startup.4.b: "We Will Reclaim What Is Ours"
 br_country_startup.4.c: "Seek Terms with the Southern Emirs"

