l_english:

 br_country_startup.4.title: "The Fate of Sardinia"
 br_country_startup.4.desc: "For generations, Sardinia stood within the maritime system of the Basileía Romaíon. In the days of the Komnenian Emperors, imperial fleets secured our waters, and our ports prospered under their protection. Though distant from Constantinople, we were never truly alone.\n\nBut the Empire that once bound the seas together has changed. Its authority did not vanish in a single moment, but faded over decades. The fleets grew fewer, the governors more distant, and the island was left to stand on its own. What was once a shield has become a memory.\n\nNow, the balance has broken. Genoese forces have seized the north, claiming stewardship where the Empire no longer can, while in the south the Sultan of Ifriqiya from across the sea has carved out a domain upon our shores. We are caught between worlds—no longer firmly within the Empire, yet not beyond its shadow.\n\nGenoa offers terms: submit to their protection, and they will restore what they have taken. It is a bitter bargain, trading one master for another—but perhaps it is the only way to survive in this new age. Or we may reject them, and face the storm alone..."
 br_country_startup.4.a: "Accept Genoese Protection"
 br_country_startup.4.b: "We Will Reclaim What Is Ours"
 br_country_startup.4.c: "Seek Terms with the Southern Emirs"

 br_country_startup.5.title: "The Division of Sicily"
 br_country_startup.5.desc: "The struggle for Sicily has defined our people for generations. There was a time when even the great cities of Syracuse and Messene were lost, and Roman authority on the island seemed extinguished for good.\n\nYet in the great campaigns that followed, the tide was turned. The general Georgios Maniakes, alongside the Varangian Harald Sigurðsson, returned in force, reclaiming the eastern strongholds and restoring Syracuse as the seat of a renewed Theme of Sikelia. From that foothold, the reconquest surged forward. Reinforced in the days of the Komnenian Emperors, Roman armies drove westward, city by city, until even Palermo stood within reach. For a brief moment, the dream of a united Sicily seemed not only possible, but inevitable.\n\nBut the Empire's strength was not without limit. The Tagmata were recalled to face Lombards and Normans on the mainland, the fleets thinned, and the local themata of Sicily were left to hold what they had won. Without imperial support, the advance stalled. What had been triumph became stalemate, and stalemate gave way to uneasy peace. A truce was struck, and the island was divided.\n\nNow we stand as the heirs of that hard-won restoration—masters of the east, with Syracuse once more our capital, yet with the west still beyond our grasp. The work of Maniakes remains unfinished, and the question of Sicily's fate endures."
 br_country_startup.5.a: "Stand with the Empire, and Finish the Reconquest"
 br_country_startup.5.b: "We Will Reclaim Sicily Ourselves"

 br_country_startup.6.title: "The Fate of the Doukai"

 br_country_startup.6.desc: "Once counted among the great houses of the Empire, the Doukai stood at the very heart of Roman power. Emperors bore their name, and their kin were woven into the highest ranks of court and command. Yet the rise of Alexios I Komnenos marked the end of their ascendancy. Stripped of influence and quietly removed from Constantinople, the family was granted vast estates along the Balkan frontier—lands far from the intrigues of the capital, where loyalty could be measured in grain and steel rather than words.\n\nWhen the Bulgarians rose in revolt against imperial authority, the Doukai did not stand as defenders of the Empire. Whether out of ambition, resentment, or cold pragmatism, they cast their lot with the rebels. In return, they secured their holdings, their privileges, and their future beyond the reach of the Basileus.\n\nNow, generations later, the Doukai remain powerful lords within the Bulgarian realm—Roman in heritage, yet bound to a Slavic crown. Their position is secure, but their identity is not. Are they loyal servants of their new liege, masters of their own frontier domain, or heirs to a legacy not yet extinguished?"
 br_country_startup.6.a: "We are loyal servants of our new realm."
 #br_country_startup.6.b: "The frontier is ours to rule."
 #br_country_startup.6.c: "We have not forgotten who we are."

 br_indikes_events.1.title: "The Founding of the Hetaireía Indikēs"
 br_indikes_events.1.desc: "With imperial sanction and merchant capital, plans long discussed in the halls of power are set into motion. The Hetaireía Indikēs is proclaimed, a chartered association charged with opening and securing the sea routes to the riches of the East. From select ports, ships are fitted out and crews assembled, bound for distant markets where Roman banners have rarely flown. Trade, profit, and influence now sail together into the Indian Ocean."
 br_indikes_events.1.a: "Let the fleets be launched"

 br_indikes_events.2.title: "Subjugation of Hetaireía Indikēs"
 br_indikes_events.2.desc: "With control of the Suez, the opportunity arises to assert dominance over the traders of Hetaireía Indikēs. This move could expand influence and secure crucial trade routes in the East."
 br_indikes_events.2.a: "Subjugate Hetaireía Indikēs and make it a trade company subject."
 br_indikes_events.2.b: "Leave Hetaireía Indikēs independent for now."

 br_country_startup.1.title: "A Fleet Takes Shape"
 br_country_startup.1.desc: "With authority secured and the harbors prepared, the foundations of the realm’s naval strength are laid. Ships are commissioned at the capital, crews gathered from the coast, and banners raised above newly launched hulls. Though modest in number, this fleet marks the beginning of our presence upon the seas and the promise of power yet to come."
 br_country_startup.1.a: "To the oars and sails"

 br_ere_succession_crisis.1.title: "The Question of Succession"
 br_ere_succession_crisis.1.desc: "The death of the Emperor has cast a long shadow over the Empire. With no undisputed heir to command universal loyalty, the great houses whisper, governors hesitate, and oaths once sworn grow uncertain. From the capital to the provinces, power is weighed anew, and those who sense weakness move quickly to secure their own advantage. The unity of the [GetUniqueInternationalOrganization('roman_world').GetName] now hangs upon the resolution of the succession."
 br_ere_succession_crisis.1.a: "The bonds of loyalty are tested"

 br_country_startup.2.title: "Raising the Host"
 br_country_startup.2.desc: "With sovereignty secured, the foundations of military power must be laid at once. Infantry are mustered from loyal households, cavalry assembled from trusted retainers, and auxiliary forces organized to support the core host. Though modest in size, this army represents the first assertion of authority and the promise of defense in the years ahead."
 br_country_startup.2.a: "The banners are raised."