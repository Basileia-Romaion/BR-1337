### subject types
 br_thema_subject: "Théma"
 br_thema_subject_desc: "The Thémata stand among the foremost pillars of the Roman order, provinces entrusted to $country_rank_br_thema_ruler_male$ who govern in the name of the Basileus. Born from the necessities of war and the defense of the Empire, they bind military command with civil authority, raising soldiers from their lands and guarding the frontiers against the enemies of [GetCountry('BYZ').GetName]. Though their offices have grown powerful and oft hereditary, the Thémata remain subjects of the Imperial Throne, sustained by the grace and authority of Constantinople."

 LEAD_br_thema_subject: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_br_thema_subject: "[SUBJECT_TYPE.GetName] of $LIST$."

 OFFER_br_thema_subject_TOOLTIP_HEADER: "Demand that [TARGET_COUNTRY.GetName] becomes a $br_thema_subject$"
