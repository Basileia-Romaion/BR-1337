 br_stavropegion_subject: "Imperial Stavropegion"
 br_stavropegion_subject_desc: "The Imperial Stavropegia are sacred institutions placed under the direct protection of the Emperor and the highest ecclesiastical authority. Freed from local episcopal control, these holy communities govern their own spiritual and temporal affairs according to ancient monastic and canonical tradition. In return for their privileges, they serve as bastions of prayer, learning, and devotion, preserving the Orthodox faith and the memory of the Roman oikoumenē. From the deserts of Sinai to the Holy Mountain of Athos, they stand apart from worldly power while remaining bound to the Roman order through faith and patronage."

