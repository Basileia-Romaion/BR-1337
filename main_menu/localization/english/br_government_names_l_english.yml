 br_naval_thema_subject: "Nautikē Théma"
 br_naval_thema_subject_desc: "The Nautikē Thematikós are the maritime bulwarks of the Empire, entrusted to $country_rank_br_thema_ruler_male$ charged with mastery of the sea. From their harbors and arsenals come the fleets that secure the trade of the Roman world, defend the straits, and carry the Emperor’s will across the waters of the Oikoumenē. Their captains and sailors enjoy ancient privileges in return for perpetual naval service, standing ever vigilant against pirates, Latins, and foreign powers that threaten the seas of [GetCountry('BYZ').GetName]."

