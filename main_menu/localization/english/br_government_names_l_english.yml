 REQUEST_br_thema_subject_TOOLTIP_HEADER_NO_TARGET: "Request that we become a $br_thema_subject$ of a [country|e]"
 CANCEL_br_thema_subject_TOOLTIP_HEADER: "Make [TARGET_COUNTRY.GetName] stop being a $br_thema_subject$"
 CANCEL_br_thema_subject_TOOLTIP_HEADER_NO_TARGET: "Make a [country|e] stop being a $br_thema_subject$"
