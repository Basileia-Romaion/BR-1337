 br_romaiokratia_casus_belli: "Enforce the Imperial Order"
 br_romaiokratia_casus_belli_desc: "Those who stand within the [GetUniqueInternationalOrganization('roman_world').GetName] are bound by duty to the Basileus and the structures of [ShowLawName('br_romaiokratia_law')]. When obedience falters, it falls upon the Empire to restore order and reaffirm the bonds that sustain the Roman world."
