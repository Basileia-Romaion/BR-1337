 br_romaiokratia_casus_belli: "Enforce the Imperial Order"
 br_romaiokratia_casus_belli_desc: "Those who stand within the Oikoumenē are bound by duty to the Basileus and the structures of Romaiokratía. When obedience falters, it falls upon the Empire to restore order and reaffirm the bonds that sustain the Roman world."
 br_romaiokratia_casus_belli_price: "Issue Imperial Mandate"

 stratiotai_focus: "Stratiōtai"
 br_bureaucratic_focus: "Logothetai"
 br_bureaucratic_vs_stratiotai: "Logothetai vs. Stratiōtai"
 br_bureaucratic_vs_stratiotai_desc: "This value reflects the balance within the Basileía Romaíon between the authority of the Logothetai—the learned officials and ministers of the imperial administration—and the Stratiōtai alongside the great military households of the provinces. Soldier-farmers and landed nobles alike uphold the Empire through land, service, and arms. The former strengthens governance, law, and diplomacy; the latter ensures martial vigor, aristocratic power, and the security of the frontiers."
 MODIFIER_TYPE_NAME_monthly_towards_bureaucratic: "Monthly Shift toward the Logothetai"
 MODIFIER_TYPE_DESC_monthly_towards_bureaucratic: "Authority flows through the imperial court and its ministries, guided by learned officials, jurists, and clerics. The machinery of state grows more refined and far-reaching, strengthening administration and diplomacy, though often at the expense of martial tradition and the influence of the landed soldiery."
 MODIFIER_TYPE_NAME_monthly_towards_stratiotai: "Monthly Shift toward the Stratiōtai"
 MODIFIER_TYPE_DESC_monthly_towards_stratiotai: "The Empire places its trust in the Stratiōtai and the great military households of the provinces. Landed nobles and soldier-farmers alike form the backbone of imperial strength, binding service to land and lineage. This fosters a hardened and disciplined host and strengthens the martial aristocracy, though it diminishes the reach of the central administration and the influence of the imperial court."