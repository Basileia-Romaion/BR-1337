l_english:
 lot_imperial_authority_2_hre_decision.title: "Restore Imperial Authority"
 lot_imperial_authority_2_hre_decision.desc: "We finally have the opportunity to restore our authority."
 lot_imperial_authority_2_hre_decision.a: "Restore Imperial Authority"

 lot_convoque_the_elector_count_hre_decision.title: "Convoke the Electors count"
 lot_convoque_the_elector_count_hre_decision.desc: "It is time to put an end to the charade that is the princes of the Holy Roman Empire. Let us summon them and demand that they be annexed into the Imperial Domain!"
 lot_convoque_the_elector_count_hre_decision.a: "Convoke the Electors count"

lot_taille_tax_decision.title: "The birth of permanent taxation"
lot_taille_tax_decision.desc: "For too long, the nobility has grown wealthy from the Crown's lands, at the expense of the peasant population, which suffers under taxes that contribute little to the royal treasury. This situation once seemed unchangeable, but with the resurgence of our authority, we can now order the nobles to contribute to the financial effort. By drawing upon the immense wealth they possess, we will be able to ease the tax burden on the peasantry."
lot_taille_tax_decision.a: "Money is the sinews of war."
