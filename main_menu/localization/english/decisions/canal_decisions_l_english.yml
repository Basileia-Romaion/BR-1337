l_english:
 build_suez_canal.title: "Construct the Suez Canal"
 build_suez_canal.desc: "Our engineers report that a channel through the Isthmus of Suez is within our technical grasp. The project would be immense, but the prize, command of all eastern trade, is greater still."
 build_suez_canal.a: "Break ground on the canal."
 build_suez_canal.b: "Not at this time."

 build_panama_canal.title: "Construct the Panama Canal"
 build_panama_canal.desc: "Our engineers have surveyed the narrow neck of the New World. A canal linking the two great oceans is possible. The cost will be enormous, the reward incalculable."
 build_panama_canal.a: "Break ground on the canal."
 build_panama_canal.b: "Not at this time."

 build_niagara_canal.title: "Construct the Niagara Canal"
 build_niagara_canal.desc: "Our engineers have come up with a plan for our ships to scale the great Niagara falls. This system of locks will allow us to access the rest of the Great Lakes."
 build_niagara_canal.a: "Break ground on the canal."
 build_niagara_canal.b: "Not at this time."