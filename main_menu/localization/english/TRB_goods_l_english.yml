 br_tribal_capital_desc: "The tribal capital serves as the political and ceremonial heart of the confederation. Here the ruling clan gathers warriors, settles disputes, and directs the affairs of the tribes, binding together a realm whose strength rests upon loyalty rather than bureaucracy."

