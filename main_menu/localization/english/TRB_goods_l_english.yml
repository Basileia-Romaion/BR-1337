 tribal_war_camp: "Tribal War Camp"
 tribal_war_camp_desc: "Here the tribes prepare to make war."
 tribal_hunting_lodge: "Tribal Hunting Camp"
 tribal_hunting_lodge_desc: "Here the Tribes gather to prepare for hunts and skin their catches."
